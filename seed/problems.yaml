  - skill: linked_list.fast_slow
    mapping_weight_bp: 10000
  guide:
    summary: "Return the node where a linked list's cycle begins, or null when there is no cycle."
    pattern: "Floyd's cycle detection, then restart one pointer from the head"
    time: "O(n)"
    space: "O(1)"
    hints:
    - "First detect whether a cycle exists with a slow and a fast pointer."
    - "After they meet, the distance from the head to the entry equals the distance from the meeting point to the entry, modulo the cycle length."
    - "Move one pointer back to the head and advance both one step at a time; they meet at the entry."
    mistakes:
    - "Reading fast.next.next without checking that fast and fast.next exist."
    - "Returning the meeting node instead of the cycle entry."
    - "Using a visited set when O(1) extra space is required."
    prerequisites: [linked_list.manipulation]
    relevance: HIGH
