  guide:
    summary: "Reverse a singly linked list and return its new head."
    pattern: "Iterative pointer reversal with prev, curr and a saved next"
    time: "O(n)"
    space: "O(1)"
    hints:
    - "Each node's next pointer must end up pointing at its predecessor."
    - "Keep a prev pointer and save curr.next before overwriting it."
    - "The recursive form reverses the rest, then sets head.next.next = head and head.next = None."
    mistakes:
    - "Overwriting curr.next before saving it and losing the rest of the list."
    - "Returning the old head instead of prev."
    - "In the recursive version, not clearing head.next, which leaves a two-node cycle."
