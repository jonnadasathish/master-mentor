    pattern: "Monotonic decreasing deque of indices"
    time: "O(n)"
    space: "O(k)"
    hints:
    - "A smaller value to the left of a larger one can never again be a window maximum."
    - "Keep a deque of indices whose values decrease; the front is the current maximum."
