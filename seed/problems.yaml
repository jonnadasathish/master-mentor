# Curated interview problem bank (seed-v2): high-signal classics covering every DSA pattern skill. Still not bulk-loaded.
# expected_minutes null => DEFAULT_EXPECTED_MINUTES (EASY 15, MEDIUM 30, HARD 45). is_canonical => PROBLEM revision items always created.
# Validator: unique (platform, platform_key); every skill key exists and is_pattern or allowed; exactly one primary (10000) mapping.
# guide: paraphrased summary (never the platform statement), pattern, optimal time/space, hint ladder (weakest first), mistakes, relevance.
seed_version: seed-v2
problems:
- id: 1
  platform: LEETCODE
  platform_key: two-sum
  title: Two Sum
  difficulty: EASY
  expected_minutes: null
  is_canonical: true
  skills:
  - skill: hashing.lookup_frequency
    mapping_weight_bp: 10000
  - skill: arrays.traversal
    mapping_weight_bp: 5000
  guide:
    summary: "Return the indices of the two numbers in an array that add up to a target."
    pattern: "One-pass hash map from value to index (complement lookup)"
    time: "O(n)"
    space: "O(n)"
    hints:
    - "A brute force checks every pair; what would let you ask 'have I already seen target - x?' in O(1)?"
    - "Store each value's index in a dict as you scan."
    - "Look up the complement before inserting the current value so an element is never paired with itself."
    mistakes:
    - "Inserting the current value before checking, which pairs an element with itself when target is 2x."
    - "Sorting first and losing the original indices."
    - "Returning the values instead of their indices."
    prerequisites: [arrays.traversal]
    relevance: HIGH
- id: 2
  platform: LEETCODE
  platform_key: group-anagrams
  title: Group Anagrams
  difficulty: MEDIUM
  expected_minutes: null
  is_canonical: true
  skills:
  - skill: hashing.lookup_frequency
    mapping_weight_bp: 10000
  - skill: strings.manipulation
    mapping_weight_bp: 5000
  guide:
    summary: "Group a list of words so that anagrams of each other end up together."
    pattern: "Hash map keyed by a canonical signature (sorted word or 26-letter count tuple)"
    time: "O(n * k) with a count-tuple key, O(n * k log k) with a sorted-word key"
    space: "O(n * k)"
    hints:
    - "Two words are anagrams exactly when some canonical form of them is equal."
    - "Use that canonical form as a dict key and append each word to its bucket."
    - "A tuple of 26 letter counts is a hashable key that avoids sorting each word."
    mistakes:
    - "Using a list as the dict key, which is unhashable; use a tuple or a string."
    - "Comparing every pair of words, which is O(n^2 * k)."
    - "Forgetting that the empty string is a valid word with its own group."
    prerequisites: [python.collections]
    relevance: HIGH
- id: 3
  platform: LEETCODE
  platform_key: top-k-frequent-elements
  title: Top K Frequent Elements
  difficulty: MEDIUM
  expected_minutes: null
  is_canonical: true
  skills:
  - skill: heap.top_k
    mapping_weight_bp: 10000
  - skill: hashing.lookup_frequency
    mapping_weight_bp: 5000
  guide:
    summary: "Return the k values that occur most often in an integer array."
    pattern: "Frequency count plus a size-k min-heap, or bucket sort by frequency"
    time: "O(n log k) with a heap, O(n) with buckets"
    space: "O(n)"
    hints:
    - "First count how often each value appears."
    - "You only need the top k, so fully sorting the counts does more work than necessary."
    - "Frequencies are bounded by n, so buckets indexed by frequency give a linear pass."
    mistakes:
    - "Pushing all distinct values into a max-heap when a size-k min-heap suffices."
    - "Pushing (value, count) instead of (count, value), so the heap orders by the wrong field."
    - "Sorting the whole input array instead of the distinct counts."
    prerequisites: [hashing.lookup_frequency, python.collections]
    relevance: HIGH
- id: 4
  platform: LEETCODE
  platform_key: 3sum
  title: 3Sum
  difficulty: MEDIUM
  expected_minutes: null
  is_canonical: true
  skills:
  - skill: two_pointers.core
    mapping_weight_bp: 10000
  - skill: sorting.algorithms
    mapping_weight_bp: 5000
  guide:
    summary: "Find every unique triplet in an array whose three values sum to zero."
    pattern: "Sort, fix one element, then opposite-end two pointers with duplicate skipping"
    time: "O(n^2)"
    space: "O(1) extra besides the output and the sort"
    hints:
    - "Sorting lets you move pointers in a direction that predictably changes the sum."
    - "Fix nums[i] and solve a sorted two-sum for -nums[i] on the suffix with lo and hi."
    - "Skip equal neighbours for i, and for lo and hi after recording a triplet, to avoid duplicates."
    mistakes:
    - "Deduplicating with a set of tuples instead of skipping duplicates, hiding a slower loop."
    - "Skipping duplicates for i but not for lo and hi after a match."
    - "Not stopping early once nums[i] is positive."
    prerequisites: [arrays.traversal]
    relevance: HIGH
- id: 5
  platform: LEETCODE
  platform_key: container-with-most-water
  title: Container With Most Water
  difficulty: MEDIUM
  expected_minutes: null
  is_canonical: false
  skills:
  - skill: two_pointers.core
    mapping_weight_bp: 10000
  - skill: greedy.core
    mapping_weight_bp: 5000
  guide:
    summary: "Choose two vertical lines that, together with the x-axis, hold the most water."
    pattern: "Opposite-end two pointers, always moving the shorter line inward"
    time: "O(n)"
    space: "O(1)"
    hints:
    - "Start with the widest possible container and ask what could improve it."
    - "The area is capped by the shorter line, so moving the taller line can never help."
    - "Move the pointer at the shorter line inward each step and track the best area."
    mistakes:
    - "Moving the taller pointer, which shrinks the width without raising the height bound."
    - "Using the taller height instead of min(height[l], height[r]) in the area."
    - "Trying all pairs, O(n^2)."
    relevance: HIGH
- id: 6
  platform: LEETCODE
  platform_key: longest-substring-without-repeating-characters
  title: Longest Substring Without Repeating Characters
  difficulty: MEDIUM
  expected_minutes: null
  is_canonical: true
  skills:
  - skill: sliding_window.core
    mapping_weight_bp: 10000
  - skill: hashing.lookup_frequency
    mapping_weight_bp: 5000
  guide:
    summary: "Find the length of the longest substring that has no repeated character."
    pattern: "Variable sliding window with a last-seen index map"
    time: "O(n)"
    space: "O(min(n, alphabet))"
    hints:
    - "Keep a window that never contains a duplicate and grow it to the right."
    - "When the new character already occurs inside the window, the left edge must jump past that earlier position."
    - "Store last-seen indices and set left = max(left, last[c] + 1)."
    mistakes:
    - "Moving left backwards by not taking the max with its current value."
    - "Off-by-one window length (right - left instead of right - left + 1)."
    - "Restarting the scan after each duplicate, which is O(n^2)."
    prerequisites: [hashing.lookup_frequency]
    relevance: HIGH
- id: 7
  platform: LEETCODE
  platform_key: minimum-window-substring
  title: Minimum Window Substring
  difficulty: HARD
  expected_minutes: null
  is_canonical: true
  skills:
  - skill: sliding_window.core
    mapping_weight_bp: 10000
  - skill: hashing.lookup_frequency
    mapping_weight_bp: 5000
  guide:
    summary: "Find the shortest substring of s that contains every character of t, counting duplicates."
    pattern: "Variable sliding window with need counts and a count of satisfied characters"
    time: "O(|s| + |t|)"
    space: "O(alphabet)"
    hints:
    - "Expand right until the window covers t, then shrink from the left while it stays valid."
    - "Track how many distinct characters currently meet their required count so the validity check is O(1)."
    - "Record the best window each time it is valid, before shrinking it further."
    mistakes:
    - "Rechecking the whole count map on every step, which multiplies the cost by the alphabet size."
    - "Ignoring repeated characters in t, such as needing two 'a' characters."
    - "Updating the answer after the window has already become invalid."
    prerequisites: [hashing.lookup_frequency]
    relevance: HIGH
- id: 8
  platform: LEETCODE
  platform_key: subarray-sum-equals-k
  title: Subarray Sum Equals K
  difficulty: MEDIUM
  expected_minutes: null
  is_canonical: true
  skills:
  - skill: prefix_sum.core
    mapping_weight_bp: 10000
  - skill: hashing.lookup_frequency
    mapping_weight_bp: 5000
  guide:
    summary: "Count the contiguous subarrays whose sum equals k."
    pattern: "Running prefix sum with a hash map of prefix-sum counts"
    time: "O(n)"
    space: "O(n)"
    hints:
    - "The sum of a subarray is the difference of two prefix sums."
    - "For the current prefix p, count how many earlier prefixes equal p - k."
    - "Seed the map with prefix 0 seen once so subarrays starting at index 0 are counted."
    mistakes:
    - "Using a sliding window, which breaks when the array has negative numbers."
    - "Forgetting the initial {0: 1} entry."
    - "Adding the current prefix to the map before querying it."
    relevance: HIGH
- id: 9
  platform: LEETCODE
  platform_key: merge-intervals
  title: Merge Intervals
  difficulty: MEDIUM
  expected_minutes: null
  is_canonical: true
  skills:
  - skill: intervals.core
    mapping_weight_bp: 10000
  - skill: python.sorting_keys
    mapping_weight_bp: 5000
  guide:
    summary: "Combine all overlapping intervals into the smallest set of disjoint intervals."
    pattern: "Sort by start, then sweep and extend the last merged interval"
    time: "O(n log n)"
    space: "O(n)"
    hints:
    - "Overlaps are easy to detect once the intervals are in start order."
    - "Compare each interval's start with the end of the last merged interval."
    - "On overlap, set the merged end to the max of the two ends."
    mistakes:
    - "Setting the end to the new interval's end instead of the max, which shrinks nested intervals."
    - "Treating touching intervals such as [1,2] and [2,3] as disjoint when they must merge."
    - "Forgetting to sort first."
    prerequisites: [python.sorting_keys]
    relevance: HIGH
- id: 10
