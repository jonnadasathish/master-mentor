# Learning content: flagship full-stack project, Inventory Management System (Vue, FastAPI, MySQL, Redis, Docker, AWS).
seed_version: seed-v2
content:
- key: proj.inventory.project
  type: project
  title: "Flagship project: Inventory Management System"
  skills:
