- key: dsa.tree_lca.interview
  type: interview_question
  title: "Interview question: LCA when nodes may be missing, and with parent pointers"
  skills: [trees.lca_construction]
  minutes: 12
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 720}
  body:
    prompt: "Your LCA function assumes both nodes exist. Product now says either node may be missing (return None then), and a second service stores parent pointers but no root reference. Explain both variants."
    key_points:
      - "Missing nodes: do a full traversal (do not short-circuit at p or q) and count how many targets were found; return the candidate only if the count is 2."
      - "Short-circuiting at p fails because q might not be below p at all, yet p would be returned."
      - "Parent pointers: collect p's ancestors in a set and walk up from q until a node is in the set; O(h) time and space."
      - "O(1) space alternative: two pointers that switch to the other start when reaching the top, like linked-list intersection."
    model_answer: "For missing nodes I keep the post-order logic but always recurse into both children, increment a found counter when I visit p or q, and return the LCA only if the counter reaches 2. With parent pointers, the paths from p and q to the root are linked lists that merge at the LCA, so either an ancestor set or the two-pointer switch trick finds the merge point in O(h)."
    pitfalls:
      - Returning p when only p exists.
      - Using value equality instead of node identity when values can repeat.
    follow_ups:
      - prompt: How would you answer many LCA queries on a static tree quickly?
        look_for: Binary lifting (ancestor at 2^k) after O(n log n) preprocessing gives O(log n) per query; or Euler tour plus range-minimum.
      - prompt: How do you get the distance between p and q?
        look_for: depth(p) + depth(q) - 2 × depth(lca).
