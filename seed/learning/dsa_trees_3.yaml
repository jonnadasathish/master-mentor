- key: dsa.bst.interview
  type: interview_question
  title: "Interview question: in-order successor in a BST"
  skills: [bst.operations]
  minutes: 12
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 720}
  body:
    prompt: "Given the root of a BST and a node in it, explain how to find the node with the next larger key. Cover the case with parent pointers and the case without them, with complexity."
    key_points:
      - "If the node has a right child, the successor is the leftmost node of the right subtree."
      - "Without parent pointers, walk from the root: when the current key is greater than the target, record it as a candidate and go left; otherwise go right."
      - "With parent pointers and no right child, move up until you arrive from a left child; that parent is the successor."
      - "O(h) time and O(1) extra space in all variants; None if the node holds the maximum."
    model_answer: If there is a right subtree, the next key is its minimum. Otherwise, from the root I walk toward the target key, remembering the last node where I turned left, because that is the smallest ancestor larger than the target. With parent pointers I climb until I move up from a left child. Each approach follows one root-to-leaf path, so O(h).
    pitfalls:
      - Doing a full in-order traversal into a list (O(n) time and space).
      - Returning the parent unconditionally when there is no right child.
    follow_ups:
      - prompt: How would you implement an iterator that returns keys in order with O(h) memory?
        look_for: Controlled iterative in-order with a stack; next() pops and pushes the left spine of the right child; amortised O(1) per call.
      - prompt: What is the predecessor rule?
        look_for: Mirror image; rightmost node of the left subtree, or the last ancestor where you turned right.
- key: dsa.bst.cards
  type: revision_card
  title: "Recall: binary search trees"
  skills: [bst.operations]
  minutes: 5
  body:
    cards:
      - front: BST invariant scope?
        back: Whole left subtree smaller, whole right subtree larger.
      - front: Validate a BST?
        back: Pass an inherited (low, high) interval, or check that in-order is strictly increasing.
      - front: Delete a node with two children?
        back: Copy the in-order successor's key, then delete the successor.
      - front: Cost of BST operations?
        back: O(h); log n if balanced, n if skewed.
      - front: Successor when there is a right child?
        back: Leftmost node of the right subtree.
