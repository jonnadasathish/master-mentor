        back: height(left) + height(right) edges; return 1 + max to the parent.
      - front: Balanced check in O(n)?
        back: Return height or a -1 sentinel; never recompute heights.
      - front: Why clamp gains with max(g, 0) in max path sum?
        back: A negative branch only lowers the path.
      - front: Prefix-sum map for downward paths — key step?
        back: Count prefix 0 once at the start, add before children, remove on return.
      - front: Return value vs recorded answer?
        back: Return the extendable chain; record the bent path.

# ---------------------------------------------------------------------------------------------- LCA and construction
- key: dsa.tree_lca.lesson
  type: lesson
  title: "Lowest common ancestor, building trees from traversals, serialisation"
  skills: [trees.lca_construction, trees.traversal]
  minutes: 30
  difficulty: MEDIUM
  body:
    summary: LCA is a post-order search that returns what it found; construction uses one traversal to find roots and the in-order to split subtrees; serialisation needs explicit null markers.
    what: |-
      - **Lowest common ancestor (LCA)** of nodes p and q: the deepest node that has both as descendants, where a node counts as its own descendant.
      - **Construction**: rebuild a binary tree from two traversals. Pre-order (or post-order) tells you the root; in-order, with unique values, tells you which values are in the left and right subtrees.
      - **Serialisation**: write a tree to a string and read it back to the same shape. A traversal with markers for missing children is enough on its own.
    why: |-
      LCA appears in version control (merge base of two commits), org charts (nearest shared manager), file systems (common parent directory) and taxonomy queries. Construction and serialisation test whether you really understand what each traversal order encodes, and serialisation is what caches, RPC and persistence do with trees.
    when: |-
      - The question asks for the nearest shared ancestor, the distance between two nodes (depth(p) + depth(q) - 2·depth(lca)), or a path between them.
      - You get traversal arrays and must rebuild or verify a tree.
      - You must send or store a tree and restore it exactly.
    how: |-
      **LCA in a binary tree**, single post-order pass. Contract: `lca(node)` returns p or q if found in this subtree, the LCA if both are found, or None.

      ```python
      def lca(node, p, q):
          if node is None or node is p or node is q:
              return node
          left = lca(node.left, p, q)
          right = lca(node.right, p, q)
          if left and right:
              return node          # p and q are on different sides: node is the split point
          return left or right     # pass up whatever was found
      ```

      This assumes both nodes exist. If either may be missing, count how many were actually found and only trust the answer when the count is 2.

      **With parent pointers**, it becomes "intersection of two linked lists": walk up from p and q, or store p's ancestors in a set and walk up from q until you hit one.

      **Construction** from in-order and post-order (pre-order is analogous): the last post-order value is the root; its position in the in-order splits left and right subtrees. Use a value-to-index dict so each split is O(1), and consume the traversal with a moving pointer instead of slicing.

      **Serialisation**: pre-order with a marker such as `#` for None, joined by commas: `1,2,#,#,3,4,#,#,5,#,#`. Deserialise with an iterator over tokens and the same recursion: read a token; `#` means None; otherwise make a node and build its left then right subtree.
    mental_model: |-
      For LCA, imagine p and q each sending a flare up the tree. Each node forwards a flare it receives from below. The first node that receives flares from both sides — or that is itself one of the targets with the other flare arriving from below — is the meeting point. For construction, pre-order or post-order is the list of roots in the order you meet them; in-order is the ruler that measures how big each subtree is.
    tradeoffs: |-
      Recursive LCA is O(n) time and O(h) space per query. For many queries on a static tree, preprocess with binary lifting (O(n log n) preprocessing, O(log n) per query). Pre-order serialisation with null markers is compact and simple; level-order with markers matches common textual tree formats but stores many trailing markers on a sparse bottom level. Pre-order plus in-order without markers needs unique values; markers work with duplicates.
    mistakes:
      - Returning as soon as p is found without considering that q may be below p; the contract handles it because p is then the LCA.
      - Assuming both nodes exist when the question says they might not.
      - Using `list.index` in each construction step, which makes it O(n²).
      - Slicing the traversal arrays in each call, which also costs O(n²) time and memory on skewed trees.
      - Building left before right when consuming post-order from the end (it yields root, right, left).
      - Serialising without null markers, which loses the shape.
    interview: |-
      State the return contract for LCA before coding and ask whether both nodes are guaranteed to exist. For construction, explain why the root comes from pre-order or post-order and the split from in-order, and that values must be unique. For serialisation, say the format, how None is encoded and how the decoder consumes tokens.
    explain_it:
      - The contract (what the recursive call returns).
      - Why the first node with hits on both sides is the lowest.
      - Which traversal gives roots and which gives the split.
      - O(n) time and O(h) stack for LCA and construction; O(n) for the index map and serialised string.
    example:
      language: python
      code: |-
        def build(inorder: list[int], postorder: list[int]):
            index = {v: i for i, v in enumerate(inorder)}     # unique values required
            post_i = len(postorder) - 1

            def helper(lo: int, hi: int):                    # subtree of inorder[lo..hi]
                nonlocal post_i
                if lo > hi:
                    return None
                root = TreeNode(postorder[post_i])
                post_i -= 1
                mid = index[root.val]
                root.right = helper(mid + 1, hi)   # post-order read backwards: root, right, left
                root.left = helper(lo, mid - 1)
                return root

            return helper(0, len(inorder) - 1)
      explanation: O(n) time with the dict and the moving pointer; O(n) for the dict and O(h) recursion depth.
    complexity: "LCA O(n) time, O(h) space; construction O(n) time with an index map, O(n) space; serialisation O(n) time and output size."
    edge_cases:
      - p is an ancestor of q (the answer is p).
      - p equals q.
      - One of the nodes is absent from the tree.
      - Empty tree serialises to a single marker.
- key: dsa.tree_lca.check
  type: concept_check
  title: "Concept check: LCA and construction"
  skills: [trees.lca_construction]
  minutes: 10
  difficulty: MEDIUM
  body:
    intro: Trace on the small trees given; the code is the lesson's LCA function.
    questions:
      - id: q1
        kind: single
        prompt: "What does lca return for nodes 6 and 7 in this tree?"
        code:
          language: text
          code: |-
            tree:
                    3
                   / \
                  5   1
                 / \
                6   2
                   /
                  7
        options: ["5", "2", "3", "6"]
        answer: [0]
        explanation: "6 is found in 5's left subtree and 7 in 5's right subtree (under 2), so 5 is the first node with hits on both sides. 3 is a common ancestor but not the lowest; 2 only contains 7."
      - id: q2
        kind: single
        prompt: "A tree with unique values has pre-order [5, 2, 1, 8, 7, 9] and in-order [1, 2, 5, 7, 8, 9]. What is its post-order?"
        options: ["1 2 7 9 8 5", "1 2 5 7 8 9", "2 1 8 7 9 5", "1 7 9 2 8 5"]
        answer: [0]
        explanation: "Root 5 splits in-order into [1, 2] and [7, 8, 9]. Left subtree: pre-order [2, 1] → root 2 with left child 1. Right: pre-order [8, 7, 9] → root 8 with children 7 and 9. Post-order: 1 2 7 9 8 5."
      - id: q3
        kind: multi
        prompt: "With unique values, which pairs of traversals always determine a binary tree uniquely?"
        options: ["Pre-order and in-order", "Post-order and in-order", "Pre-order and post-order", "Level-order and in-order"]
        answer: [0, 1, 3]
        explanation: "Each pair with in-order works: the other traversal identifies roots and in-order splits the subtrees. Pre-order and post-order cannot tell a single child on the left from one on the right (1 with left child 2 and 1 with right child 2 give the same pair), unless every node has 0 or 2 children."
      - id: q4
        kind: single
        prompt: When building from in-order and post-order by consuming post-order from the end, why must the right subtree be built before the left?
        options:
          - "It is faster"
          - "Read backwards, post-order lists root, then the right subtree, then the left subtree"
          - "In-order requires it"
          - "It does not matter"
        answer: [1]
        explanation: "Post-order is left, right, root; reversed it is root, right, left. Building left first would assign right-subtree values to the left side."
      - id: q5
        kind: single
        prompt: Why does pre-order serialisation need explicit null markers?
        options:
          - "To make the string shorter"
          - "Without them, different shapes share the same sequence, such as 1 with left child 2 and 1 with right child 2"
          - "Because values can be negative"
          - "Markers are only needed for BSTs"
        answer: [1]
        explanation: "A single traversal without markers does not encode where children are missing. With markers, the pre-order alone determines the shape, even with duplicate values."
      - id: q6
        kind: short
        prompt: Explain what the recursive LCA function returns and why the first node that gets non-None results from both children is the answer.
        model_answer: "lca(node) returns p or q if exactly one of them is in node's subtree (the topmost one found), the LCA if both are, and None if neither is. If both children return non-None, p and q are in different subtrees, so node is the deepest node containing both; any lower node contains only one side. If node itself is p or q, returning it is correct whether or not the other is below."
        explanation: Stating the three-way contract makes the short code verifiable.
