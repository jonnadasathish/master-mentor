# Learning content, DSA (3/4): binary tree traversals, height/diameter/path problems, LCA and construction, and binary search trees.
seed_version: seed-v3
content:
# ---------------------------------------------------------------------------------------------- tree traversal
- key: dsa.tree_traversal.lesson
  type: lesson
  title: "Tree traversals: DFS orders, BFS by level, recursive and iterative"
  skills: [trees.traversal, recursion.fundamentals]
  minutes: 30
  difficulty: EASY
  body:
    summary: Every tree algorithm is a traversal plus a decision about when to do the work — before the children (pre-order), between them (in-order), after them (post-order) or level by level (BFS).
    what: |-
      A binary tree node holds a value and two child references:

      ```python
      class TreeNode:
          def __init__(self, val=0, left=None, right=None):
              self.val, self.left, self.right = val, left, right
      ```

      - **Pre-order** (node, left, right): work on the way down. Copying or serialising a tree, passing state from parent to child.
      - **In-order** (left, node, right): on a binary search tree this visits values in sorted order.
      - **Post-order** (left, right, node): work on the way up, after the children's answers are known. Height, size, diameter, deleting a tree.
      - **Level-order** (BFS): visit by distance from the root using a queue. Anything that says "level", "row", "nearest", "minimum depth" or "view from the side".
    why: |-
      Interviews use trees to test recursion, state passing and complexity reasoning at the same time. Most tree problems are short once you pick the right order: "does the parent need the children's results?" (post-order) or "does the child need the parent's state?" (pre-order). Production code walks trees too: DOM and JSON documents, file systems, ASTs, category hierarchies, org charts.
    when: |-
      - Use DFS (recursive) by default; it is the shortest code and O(h) memory.
      - Use BFS when the answer is organised by level or when you want the shallowest match first (stopping early).
      - Use an iterative DFS with an explicit stack when the tree can be deeper than about 1000 levels, CPython's default recursion limit.
    how: |-
      **Recursive DFS** — the order is only where the "visit" line sits:

      ```python
      def inorder(node, out):
          if node is None:
              return
          inorder(node.left, out)
          out.append(node.val)       # move this line up for pre-order, down for post-order
          inorder(node.right, out)
      ```

      **Iterative in-order** — go left as far as possible pushing nodes, then pop, visit, and move to the right child:

      ```python
      def inorder_iter(root):
          out, stack, node = [], [], root
          while stack or node:
              while node:
                  stack.append(node)
                  node = node.left
              node = stack.pop()
              out.append(node.val)
              node = node.right
          return out
      ```

      **Iterative pre-order**: pop a node, visit it, push the right child then the left child (so the left is popped first).

      **Level-order BFS** with `collections.deque`; record the queue length at the start of each level so you know where the level ends:

      ```python
      from collections import deque

      def levels(root):
          if root is None:
              return []
          out, q = [], deque([root])
          while q:
              level = []
              for _ in range(len(q)):       # exactly the nodes of this level
                  node = q.popleft()
                  level.append(node.val)
                  if node.left:
                      q.append(node.left)
                  if node.right:
                      q.append(node.right)
              out.append(level)
          return out
      ```
    mental_model: |-
      Picture walking around the outside of the tree, starting left of the root and keeping the tree on your right hand. You pass every node three times: on its left side (pre-order), underneath it (in-order) and on its right side (post-order). BFS is different: it is a flood that rises one level at a time.
    tradeoffs: |-
      Recursive DFS uses O(h) stack — O(log n) on a balanced tree, O(n) on a degenerate one, which can hit the recursion limit. BFS uses O(w) queue memory, where w is the widest level, up to about n/2 on a complete tree. Iterative DFS has the same O(h) bound without the recursion limit, at the cost of more code. Morris traversal achieves O(1) extra space by temporarily rewiring null right pointers, but it mutates the tree during the walk.
    mistakes:
      - Using `list.pop(0)` as a queue; it is O(n) per pop. Use `deque.popleft()`.
      - Reading `len(q)` inside the inner loop instead of once per level, so nodes from the next level leak into the current one.
      - Pushing the left child first in iterative pre-order, which visits the right subtree first.
      - Forgetting the `None` root case.
      - "Calling recursion \"O(1) space\": the call stack is O(h)."
    interview: |-
      Say which order you need and why ("post-order, because a node's height depends on its children"). State time O(n) and space O(h) for DFS or O(w) for BFS. Typical follow-ups: do it iteratively, return levels in zigzag order, the right side view, the minimum depth (BFS stops early), and in-order of a BST is sorted.
    explain_it:
      - Which traversal and why the work belongs at that point.
      - The base case for None.
      - Time O(n), every node visited once.
      - "Space: O(h) stack for DFS (log n balanced, n skewed), O(w) queue for BFS."
    example:
      language: python
      code: |-
        def max_depth_bfs(root) -> int:
            """Number of levels, iteratively; no recursion limit."""
            from collections import deque
            if root is None:
                return 0
            depth, q = 0, deque([root])
            while q:
                depth += 1
                for _ in range(len(q)):
                    node = q.popleft()
                    for child in (node.left, node.right):
                        if child:
                            q.append(child)
            return depth
      explanation: O(n) time, O(w) space for the widest level. The recursive one-liner 1 + max(depth(left), depth(right)) is O(h) space instead.
    complexity: O(n) time for every traversal; O(h) extra for DFS (recursive or explicit stack), O(w) for BFS; h ranges from log n to n, w up to about n/2.
    edge_cases:
      - Empty tree.
      - A single node.
      - A degenerate tree (every node has only a left child), which makes h = n.
      - Duplicate values, which do not matter for traversal but matter for BST questions.
    misconceptions:
      - "\"BFS always uses less memory than DFS.\" On a wide, shallow tree BFS holds a whole level; DFS holds one path."
      - "\"In-order means sorted.\" Only on a binary search tree."
- key: dsa.tree_traversal.visual
  type: visual_explanation
  title: "Visual: traversal orders, the in-order stack and the BFS queue"
  skills: [trees.traversal]
  minutes: 8
  body:
    summary: One six-node tree walked four ways, then the explicit stack of iterative in-order and the queue of level-order.
    frames:
      - caption: The tree used in every frame.
        diagram: |-
          tree:
                  1
                /   \
               2     3
              / \     \
             4   5     6
      - caption: "The four orders. Pre-order visits a node first, in-order between its subtrees, post-order last."
        diagram: |-
          pre-order   (node, left, right):  1  2  4  5  3  6
          in-order    (left, node, right):  4  2  5  1  3  6
          post-order  (left, right, node):  4  5  2  6  3  1
          level-order (by depth):          [1] [2, 3] [4, 5, 6]
      - caption: "Iterative in-order: push while going left, pop to visit, then step right."
        diagram: |-
          step  action                 stack (top right)   output
          ----  ---------------------  ------------------  ------------------
           1    push 1, 2, 4 (left)    [1, 2, 4]
           2    pop 4, visit, right=∅  [1, 2]              4
           3    pop 2, visit, right=5  [1]                 4 2
           4    push 5                 [1, 5]
           5    pop 5, visit, right=∅  [1]                 4 2 5
           6    pop 1, visit, right=3  []                  4 2 5 1
           7    push 3; pop 3, visit   []                  4 2 5 1 3
           8    push 6; pop 6, visit   []                  4 2 5 1 3 6
          max stack size = 3 = height of the tree → O(h)
      - caption: "Level-order BFS: the queue length at the start of a level is exactly that level's size."
        diagram: |-
          level  queue at start   size  popped → children appended   level output
          -----  ---------------  ----  ---------------------------  ------------
            0    [1]               1    1 → 2, 3                     [1]
            1    [2, 3]            2    2 → 4, 5 ; 3 → 6             [2, 3]
            2    [4, 5, 6]         3    no children                  [4, 5, 6]
          max queue size = 3 = widest level → O(w)
- key: dsa.tree_traversal.check
  type: concept_check
  title: "Concept check: traversal orders"
  skills: [trees.traversal]
  minutes: 10
  difficulty: EASY
  body:
    intro: "Trees are drawn as text. Write the order down before choosing."
    questions:
      - id: q1
        kind: single
        prompt: What is the post-order traversal of this tree?
        code:
          language: text
          code: |-
            tree:
                  8
                 / \
                3   10
               / \    \
              1   6    14
                 / \
                4   7
        options: ["1 4 7 6 3 14 10 8", "8 3 1 6 4 7 10 14", "1 3 4 6 7 8 10 14", "1 4 6 7 3 10 14 8"]
        answer: [0]
        explanation: "Post-order finishes both subtrees before the node: left subtree 1 4 7 6 3, right subtree 14 10, then 8. The second option is pre-order and the third is in-order (sorted, because this is a BST)."
      - id: q2
        kind: single
        prompt: "You need the number of nodes in every node's subtree. Which order computes it in one traversal?"
        options: ["Pre-order", "In-order", "Post-order", "Level-order from the root"]
        answer: [2]
        explanation: "size(node) = 1 + size(left) + size(right) needs both children's results first, which is post-order. Pre-order and top-down BFS reach the node before its children are known."
      - id: q3
        kind: single
        prompt: "On the six-node tree 1(2(4, 5), 3(-, 6)), what does walk return? Note the push order."
        code:
          language: python
          code: |-
            def walk(root):
                out, stack = [], [root]
                while stack:
                    node = stack.pop()
                    if node:
                        out.append(node.val)
                        stack.append(node.left)
                        stack.append(node.right)
                return out
        options: ["1 2 4 5 3 6", "1 3 6 2 5 4", "4 5 2 6 3 1", "1 2 3 4 5 6"]
        answer: [1]
        explanation: "The right child is pushed last, so it is popped first: node, right, left = 1 3 6 2 5 4. Reversed, that is 4 5 2 6 3 1, the post-order — a known trick. Pre-order needs the right child pushed first."
      - id: q4
        kind: single
        prompt: For a perfect binary tree with n nodes, what are the peak memory of recursive DFS and of BFS?
        options: ["O(log n) and O(log n)", "O(log n) and O(n)", "O(n) and O(log n)", "O(1) and O(n)"]
        answer: [1]
        explanation: "DFS holds one root-to-leaf path, about log₂ n frames. BFS holds the last level, about n/2 nodes, which is O(n). Assuming BFS is always lighter is the tempting mistake."
      - id: q5
        kind: multi
        prompt: Which techniques correctly group BFS output by level?
        options:
          - "Read len(queue) at the start of each level and pop exactly that many nodes"
          - "Enqueue (node, depth) pairs and append each value to the list for its depth"
          - "Use a stack instead of a queue"
          - "Start a new level whenever a popped node has no children"
        answer: [0, 1]
        explanation: "Both the size snapshot and explicit depth tags identify level boundaries. A stack gives DFS order, and leaves can appear in the middle of a level, so the last option splits levels wrongly."
      - id: q6
        kind: short
        prompt: Why is recursive DFS O(h) space, and what is h in the best and worst case?
        model_answer: "At any moment the call stack holds one frame per node on the current root-to-node path, so the maximum is the height h. For a balanced tree h is about log₂ n; for a degenerate (linked-list shaped) tree h = n, which in CPython can also exceed the default recursion limit of 1000."
        explanation: Interviewers expect the call stack to be included in space complexity.
- key: dsa.tree_traversal.exercise
  type: coding_exercise
  title: "Exercise: zigzag level order"
  skills: [trees.traversal, queue.deque]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 900}
  body:
    prompt: |-
      Return the values of a binary tree level by level, alternating direction: the first level left to right, the second right to left, and so on.
    examples:
      - "For the tree 1(2(4, 5), 3(-, 6)): [[1], [3, 2], [4, 5, 6]]"
      - "Empty tree: []"
    hints:
      - Do a normal level-order BFS with a size snapshot per level.
      - Reverse every second level's list, or append to a deque from the left on odd levels.
      - Do not change the order in which children are enqueued; only the output order changes.
    solution:
      language: python
      code: |-
        from collections import deque

        def zigzag(root) -> list[list[int]]:
            if root is None:
                return []
            out, q, left_to_right = [], deque([root]), True
            while q:
                level = deque()
                for _ in range(len(q)):
                    node = q.popleft()
                    if left_to_right:
                        level.append(node.val)
                    else:
                        level.appendleft(node.val)
                    if node.left:
                        q.append(node.left)
                    if node.right:
                        q.append(node.right)
                out.append(list(level))
                left_to_right = not left_to_right
            return out
      explanation: O(n) time, O(w) extra space for the queue and the current level.
    rubric:
      - key: correct
        label: "Correct output including empty and single-node trees"
        points: 4
      - key: level_boundary
        label: "Uses a per-level size snapshot or depth tags"
        points: 2
      - key: order_trick
        label: "Changes only output order (reverse or appendleft), not enqueue order"
        points: 2
      - key: complexity
        label: "States O(n) time and O(w) space"
        points: 2
    follow_ups:
      - prompt: Return only the last value of each level. Can you do it with DFS?
        look_for: "Right side view; DFS visiting right first and recording the first value seen at each new depth, O(h) space."
      - prompt: What if the tree is 10⁶ levels deep and one node wide?
        look_for: BFS is fine (queue size 1); recursive DFS would hit the recursion limit.
- key: dsa.tree_traversal.guided
  type: guided_problem
  title: "Guided practice: depth and mirror"
  skills: [trees.traversal]
  minutes: 20
  difficulty: EASY
  problems: [20, 83]
  body:
    guidance:
      - Write the contract of the recursive function in one line before coding.
      - "Maximum depth: post-order; also write the BFS version and compare memory."
      - "Mirror: swap children at each node; say whether pre-order or post-order both work and why."
    hints:
      - depth(None) = 0.
      - Swapping before or after recursing both work because each node is swapped exactly once.
- key: dsa.tree_traversal.timed
  type: timed_problem
  title: "Timed practice: level order and right side view"
  skills: [trees.traversal]
  minutes: 30
  difficulty: MEDIUM
  problems: [21, 84]
  body:
    guidance:
      - Use a deque and a size snapshot; state O(n) time and O(w) space before coding.
      - "Right side view: give both the BFS (last of each level) and the right-first DFS answer, then code one."
      - Trace a tree whose deepest level has only a left node; it must still appear in the view.
- key: dsa.tree_traversal.interview
  type: interview_question
  title: "Interview question: nearest leaf in a huge, lopsided tree"
  skills: [trees.traversal]
  minutes: 12
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 720}
  body:
    prompt: "A binary tree has 10⁶ nodes; one branch is 500,000 levels deep and there is a leaf at depth 3. You need the minimum depth (the number of nodes on the shortest root-to-leaf path). Which traversal do you use and why? Compare it with recursive DFS on time, memory and failure modes."
    key_points:
      - "BFS level by level returns as soon as it pops the first leaf, so it touches only the top few levels here."
      - "Recursive DFS must explore the deep branch, O(n) time, and would exceed CPython's recursion limit at depth 500,000."
      - "A leaf is a node with no children; a node with one child is not a leaf, so min(left, right) on a None child is wrong."
      - "BFS memory is O(w) of the levels visited; DFS memory is O(h)."
    model_answer: BFS, because the question asks for the shallowest leaf and BFS discovers nodes in order of depth; it stops at depth 3 after touching only a handful of nodes. A recursive DFS must visit the whole deep branch before it can be sure, and at 500,000 levels it raises RecursionError in CPython. If DFS is required, use an explicit stack and prune branches deeper than the best found so far. Careful with the definition — a node with one child is not a leaf.
    pitfalls:
      - Computing 1 + min(depth(left), depth(right)) without handling a missing child, which returns 1 for a root with only one child.
      - Saying DFS and BFS are equivalent because both are O(n) in the worst case.
    follow_ups:
      - prompt: Write the iterative post-order traversal without recursion.
        look_for: Stack of (node, visited) pairs or two stacks; a node is emitted only after both children are processed.
      - prompt: How would you traverse in O(1) extra space?
        look_for: Morris traversal using temporary threads through null right pointers, restored afterwards; it mutates the tree during the walk.
- key: dsa.tree_traversal.cards
  type: revision_card
  title: "Recall: tree traversals"
  skills: [trees.traversal]
  minutes: 5
  body:
    cards:
      - front: Pre-, in-, post-order positions of the visit?
        back: Before the children, between them, after them.
      - front: Which order computes heights and sizes?
        back: Post-order, because it needs the children's results.
      - front: How do you know where a BFS level ends?
        back: Snapshot len(queue) at the start of the level.
      - front: Space of DFS vs BFS?
        back: O(h) stack vs O(w) queue.
      - front: Iterative pre-order push order?
        back: Push right, then left, so left is popped first.
      - front: Reverse of node-right-left order?
        back: Post-order.

# ---------------------------------------------------------------------------------------------- height, diameter, paths
- key: dsa.tree_paths.lesson
  type: lesson
  title: "Height, diameter and path sums: return one thing, record another"
  skills: [trees.path_depth, trees.traversal]
  minutes: 30
  difficulty: MEDIUM
  body:
    summary: Path problems are post-order recursions that return the best path going down through a node while updating a global best for paths that bend at that node.
    what: |-
      Definitions vary, so state yours:

      - **Depth** of a node: its distance from the root. **Height** of a node: the length of the longest downward path from it. Count in **nodes** (empty tree 0, leaf 1) or **edges** (leaf 0); say which.
      - **Diameter**: the longest path between any two nodes, usually counted in edges. It may not pass through the root.
      - **Root-to-leaf path sum**: does a path from the root to a leaf add up to a target?
      - **Downward path sum**: paths that start anywhere and go down.
      - **Maximum path sum**: any path, any start and end, values may be negative.
    why: |-
      These are the standard tests of whether you can separate "what my parent needs from me" from "what the global answer is". The same split appears in tree DP, in computing critical paths in dependency trees and in aggregating metrics up a hierarchy.
    when: |-
      - The answer is a length or sum of a path inside a tree.
      - A node's answer depends on its children's answers (bottom-up), or a path's state must be carried from the root (top-down).
      - Paths "can start and end anywhere": expect the return-one-record-another pattern.
    how: |-
      **Bottom-up (post-order)** returns information to the parent. The diameter through a node is `height(left) + height(right)` edges when heights are counted in nodes, but the parent can only extend one side, so the function returns `1 + max(left, right)` and records the bent path in an outer variable:

      ```python
      def diameter(root) -> int:
          best = 0
          def height(node) -> int:          # nodes on the longest downward path
              nonlocal best
              if node is None:
                  return 0
              left, right = height(node.left), height(node.right)
              best = max(best, left + right)   # edges of the path bending here
              return 1 + max(left, right)
          height(root)
          return best
      ```

      **Balanced check** in O(n): return the height, or `-1` as a sentinel once any subtree is unbalanced, so no height is computed twice.

      **Top-down (pre-order)** carries state from the root: pass `remaining = target - node.val` to the children and check it at a leaf.

      **Downward paths with any start**: keep a hash map of prefix sums along the current root-to-node path. At each node, the number of paths ending here with sum `target` is `count[prefix - target]`. Increment the count before recursing into children and **decrement it when returning**, because the prefix belongs only to the current path.

      **Maximum path sum** (values may be negative): a child's contribution is `max(gain(child), 0)` — a negative branch is better left out.
    mental_model: |-
      Each node is a manager who reports one number upward (the best single chain it can offer its boss) but privately checks whether the best overall project is the one bending through its own office (left chain + itself + right chain). The report and the private check are different numbers; mixing them up is the classic bug.
    tradeoffs: |-
      Bottom-up recursion visits each node once: O(n) time, O(h) stack. The naive alternative — call height() from every node — is O(n log n) on a balanced tree and O(n²) on a degenerate one. A global (or `nonlocal`) best variable is simplest; returning a tuple `(height, best)` avoids shared state and is easier to test. The prefix-sum approach for downward paths is O(n) time and O(h) map entries, versus O(n · h) for starting a fresh DFS at every node.
    mistakes:
      - Returning the bent path (left + right) to the parent, which would let the parent build a path that forks.
      - Mixing node and edge counts, giving answers off by one.
      - Calling height() inside an outer recursion over every node, repeating work.
      - Forgetting to undo the prefix count when backtracking, so sibling subtrees count non-downward paths.
      - In maximum path sum, initialising the best to 0 when all values may be negative; start from the root's value or minus infinity.
    interview: |-
      Before coding say: "the function returns X to the parent; the answer is tracked separately as Y." State the unit (edges or nodes). Follow-ups include longest path with equal values, maximum path sum with negatives, counting paths with a target sum, and doing it iteratively.
    explain_it:
      - The definition and unit (nodes or edges).
      - What the recursive function returns to the parent.
      - What is recorded globally and why it differs from the return value.
      - O(n) time, O(h) stack, plus O(h) for any path map.
    example:
      language: python
      code: |-
        def max_path_sum(root) -> int:
            """Largest sum of any non-empty path; values may be negative."""
            best = root.val

            def gain(node) -> int:          # best sum of a chain going down from node
                nonlocal best
                if node is None:
                    return 0
                left = max(gain(node.left), 0)     # drop a negative branch
                right = max(gain(node.right), 0)
                best = max(best, node.val + left + right)   # path bending at node
                return node.val + max(left, right)          # parent can extend one side only
            gain(root)
            return best
      explanation: "For the tree -3(4, 10(6, 2)) the best path is 6 → 10 → 2 = 18; the path through the root, 4 → -3 → 10 → 6, sums to only 17. O(n) time, O(h) stack."
    complexity: O(n) time for each of height, diameter, balance, path sum and maximum path sum; O(h) recursion stack; the prefix-sum count map adds O(h) entries.
    edge_cases:
      - Empty tree (diameter 0, balanced).
      - Single node (diameter 0 edges, height 1 node).
      - All negative values in maximum path sum.
      - Path sum targets that a single node satisfies, or a target of 0 with zero-valued nodes.
- key: dsa.tree_paths.visual
  type: visual_explanation
  title: "Visual: diameter computed bottom-up"
  skills: [trees.path_depth]
  minutes: 6
  body:
    summary: Each node returns its height to the parent and records left + right as a candidate diameter.
    frames:
      - caption: The tree. Heights are counted in nodes; the diameter in edges.
        diagram: |-
          tree:
                    1
                   / \
                  2   3
                 / \
                4   5
               /
              6
      - caption: "Post-order: children report first. Each row shows what the node returns and the path that bends at it."
        diagram: |-
          node  left h  right h  bends here (edges)  returns h  best so far
          ----  ------  -------  ------------------  ---------  -----------
           6      0       0        0                    1          0
           4      1       0        1                    2          1
           5      0       0        0                    1          1
           2      2       1        3  (6-4-2-5)         3          3
           3      0       0        0                    1          3
           1      3       1        4  (6-4-2-1-3)       4          4
      - caption: "The answer is 4 edges. Node 2 returned 3 (its single best chain 2-4-6), not its bent path, so node 1 could extend it."
        diagram: |-
          longest path:  6 — 4 — 2 — 1 — 3     (4 edges)
          returned by 2: chain 2 — 4 — 6       (height 3)
          recorded at 2: 6 — 4 — 2 — 5         (3 edges, later beaten)
- key: dsa.tree_paths.check
  type: concept_check
  title: "Concept check: heights and paths"
  skills: [trees.path_depth]
  minutes: 10
  difficulty: MEDIUM
  body:
    intro: For every question, decide what the function returns upward and what it records.
    questions:
      - id: q1
        kind: single
        prompt: Using the diameter code from the lesson, what is the diameter (in edges) of this tree?
        code:
          language: text
          code: |-
            tree:
                    1
                   / \
                  2   3
                 / \
                4   5
               /
              6
        options: ["3", "4", "5", "6"]
        answer: [1]
        explanation: "The longest path is 6-4-2-1-3: 4 edges, bending at the root (left height 3 + right height 1). 3 is the best path bending at node 2; 5 counts nodes instead of edges."
      - id: q2
        kind: single
        prompt: "A balance check calls height(node.left) and height(node.right) at every node, recomputing heights each time. Its cost on a perfectly balanced tree of n nodes?"
        options: ["O(n)", "O(n log n)", "O(n²)", "O(log n)"]
        answer: [1]
        explanation: "Each node's height is recomputed once per ancestor, and a balanced tree has about log n ancestors per node: O(n log n). The post-order version with a -1 sentinel computes each height once, O(n)."
      - id: q3
        kind: single
        prompt: "In maximum path sum, why is each child's gain clamped with max(gain, 0)?"
        options:
          - "To avoid recursion errors"
          - "A branch with a negative sum only lowers the path, so the path should stop at the current node instead"
          - "Because node values are non-negative"
          - "To convert edges to nodes"
        answer: [1]
        explanation: "Paths may end at any node; including a negative branch can never help. The clamp is not about non-negative inputs — it exists precisely because values can be negative."
      - id: q4
        kind: single
        prompt: "Counting downward paths with a target sum using a prefix-sum count map: why decrement the current prefix's count when the recursion returns from a node?"
        options:
          - "To save memory"
          - "The prefix belongs to the current root-to-node path; leaving it would let a node in a sibling subtree pair with it, forming a path that is not downward"
          - "To avoid counting the empty path"
          - "Because hash maps cannot hold duplicates"
        answer: [1]
        explanation: "The map must describe exactly the ancestors of the current node. This is the backtracking undo step; skipping it inflates counts."
      - id: q5
        kind: multi
        prompt: Which are naturally solved bottom-up (children return values to the parent)?
        options:
          - "Height of every node"
          - "Diameter"
          - "Whether some root-to-leaf path sums to a target"
          - "Whether the tree is height-balanced"
        answer: [0, 1, 3]
        explanation: "Height, diameter and balance need the children's results. The root-to-leaf sum is naturally top-down: pass the remaining target down and test at leaves (it can be written bottom-up, but the state flows from the root)."
      - id: q6
        kind: short
        prompt: Why does the diameter solution need a separate best variable instead of just returning the diameter?
        model_answer: "The parent needs the longest single downward chain from the child to extend, while the diameter may bend at the child (left + right) and cannot be extended upward without forking. One return value cannot serve both, so the function returns the height and records the bent path separately (outer variable or a tuple)."
        explanation: This return-one-record-another split is the core of every any-path tree problem.
