# ---------------------------------------------------------------------------------------------- BST
- key: dsa.bst.lesson
  type: lesson
  title: "Binary search trees: invariant, search, insert, delete, validate"
  skills: [bst.operations, trees.traversal, binary_search.basic]
  minutes: 30
  difficulty: MEDIUM
  body:
    summary: Every key in the left subtree is smaller and every key in the right subtree is larger — for the whole subtree, not just the child — so each comparison discards one side, like binary search.
    what: |-
      A **binary search tree (BST)** is a binary tree where, for every node, all keys in its left subtree are less than its key and all keys in its right subtree are greater (with a stated rule for duplicates). Consequences:

      - In-order traversal yields the keys in sorted order.
      - Search, insert, delete, minimum, maximum, floor, ceiling, successor and predecessor all cost O(h), where h is the height.
      - h is O(log n) only if the tree is balanced. Inserting sorted keys into a plain BST builds a chain with h = n.

      Self-balancing variants (AVL, red-black trees) keep h = O(log n) by rotating on insert and delete; they back ordered maps in many languages. The Python standard library has no balanced BST; `bisect` on a sorted list gives O(log n) search but O(n) insertion.
    why: |-
      A BST answers ordered questions that a hash map cannot: "the largest price at or below 100", "the next event after time t", "the k-th smallest". Database indexes generalise the same idea into B-trees. Interviews use BSTs to test whether you exploit the invariant to reach O(h) instead of a full O(n) traversal.
    when: |-
      - The data has an order and you need floor, ceiling, range or rank queries.
      - A problem says "BST" — the invariant is the hint; use it to prune.
      - You need sorted output from a tree (in-order).
    how: |-
      **Search / insert**: compare and go left or right; insert at the None you reach.

      **Validate**: carry an open interval `(low, high)` down the tree. The root's interval is unbounded; the left child inherits `(low, node.val)`, the right `(node.val, high)`. Checking only a node against its children is not enough.

      **Delete** has three cases:

      ```python
      def delete(root, key):
          if root is None:
              return None
          if key < root.val:
              root.left = delete(root.left, key)
          elif key > root.val:
              root.right = delete(root.right, key)
          else:
              if root.left is None:          # zero or one child: splice it out
                  return root.right
              if root.right is None:
                  return root.left
              succ = root.right              # two children: copy the in-order successor
              while succ.left:
                  succ = succ.left
              root.val = succ.val
              root.right = delete(root.right, succ.val)
          return root
      ```

      **k-th smallest**: iterative in-order, stop after popping k nodes: O(h + k). If k-th queries are frequent and the tree changes, store subtree sizes in each node for O(h) rank queries.

      **LCA in a BST**: walk from the root; if both keys are smaller go left, if both larger go right, otherwise the current node is the split point. O(h), no full traversal.
    mental_model: |-
      Each node is a signpost: "smaller this way, larger that way". Every node also owns an interval of keys it is allowed to hold, inherited from its ancestors. Validation checks the interval; search follows the signposts; the in-order walk reads the keys like a sorted list.
    tradeoffs: |-
      A plain BST is simple but degrades to O(n) per operation on sorted inserts. Balanced trees guarantee O(log n) but are rarely coded in interviews. A hash map gives O(1) average lookups but no order. A sorted Python list with `bisect` gives O(log n) lookups and order but O(n) inserts — fine for read-heavy data. A heap gives the minimum in O(1) but no search or floor.
    mistakes:
      - Validating with only `node.left.val < node.val < node.right.val`, which misses a deep node that violates an ancestor's bound.
      - Resetting the bounds at each level instead of inheriting them from all ancestors.
      - Forgetting the duplicate rule (strictly less vs less-or-equal) required by the question.
      - Doing a full traversal (O(n)) for search or LCA when the invariant allows O(h).
      - Claiming O(log n) without saying "if balanced".
    interview: |-
      State the invariant precisely (whole subtrees, strict or not), give complexities in terms of h, and say what h is for balanced and skewed trees. Expect follow-ups: validate, k-th smallest, successor, LCA, convert a sorted array to a balanced BST (pick the middle as root), and "what if the tree is modified often and k-th is queried often?" (subtree sizes).
    explain_it:
      - The invariant over whole subtrees and the duplicate rule.
      - How each operation uses one comparison to discard a subtree.
      - O(h) cost, with h = log n balanced and n skewed.
      - Delete's three cases.
    example:
      language: python
      code: |-
        def floor(root, x: int):
            """Largest key <= x, or None. Iterative, O(h)."""
            best = None
            node = root
            while node:
                if node.val == x:
                    return x
                if node.val < x:
                    best = node.val        # a candidate; a closer one may be on the right
                    node = node.right
                else:
                    node = node.left       # everything here and to the right is too big
            return best
      explanation: "Each step discards a subtree that cannot hold a better floor. Ceiling is symmetric. O(h) time, O(1) space."
    complexity: Search, insert, delete, floor, ceiling, successor and BST LCA are O(h); h = O(log n) balanced, O(n) worst; in-order traversal O(n); k-th smallest O(h + k).
    edge_cases:
      - Empty tree.
      - Deleting the root, or a node whose successor has a right child.
      - Duplicates, and values at the integer limits (use None or infinities for open bounds).
      - Keys inserted in sorted order (degenerate tree).
    misconceptions:
      - "\"A BST is always O(log n).\" Only when balanced."
      - "\"Each node greater than its left child and smaller than its right child makes a BST.\" The condition must hold for entire subtrees."
- key: dsa.bst.check
  type: concept_check
  title: "Concept check: BST invariants"
  skills: [bst.operations]
  minutes: 10
  difficulty: MEDIUM
  body:
    intro: Remember that the invariant covers whole subtrees.
    questions:
      - id: q1
        kind: single
        prompt: "is_bst_local checks only each node against its direct children. What do it and a correct validator return for this tree?"
        code:
          language: text
          code: |-
            tree:
                  5
                 / \
                3   8
                   /
                  4
        options: ["Both True", "Local True, correct False", "Local False, correct True", "Both False"]
        answer: [1]
        explanation: "4 < 8 passes the local check, but 4 sits in 5's right subtree, where every key must exceed 5. A bounds-based validator gives node 4 the interval (5, 8) and rejects it."
      - id: q2
        kind: single
        prompt: Keys 1, 2, 3, 4, 5 are inserted in that order into an empty plain BST. Height (in nodes) and search cost?
        options: ["3 and O(log n)", "5 and O(n)", "4 and O(n)", "5 and O(log n)"]
        answer: [1]
        explanation: "Each key goes to the right of the previous one, forming a chain of 5 nodes; search degrades to linear. Balanced trees avoid this by rotating."
      - id: q3
        kind: single
        prompt: Deleting a node with two children — what replaces its key?
        options:
          - "Its left child's key"
          - "The minimum of its right subtree (in-order successor), or the maximum of its left subtree"
          - "The root's key"
          - "Any leaf's key"
        answer: [1]
        explanation: "The successor (or predecessor) is the only key that keeps every left key smaller and every right key larger after the swap; then delete that key from the subtree, which has at most one child. A child's key can break the order on the other side."
      - id: q4
        kind: single
        prompt: Cost of finding the k-th smallest key with an iterative in-order traversal that stops after k pops?
        options: ["O(n)", "O(k)", "O(h + k)", "O(k log n)"]
        answer: [2]
        explanation: "You first descend h nodes to the minimum, then each of the k pops does amortised O(1) work. O(n) ignores the early stop; O(k) ignores the initial descent."
      - id: q5
        kind: multi
        prompt: Which hold for every valid BST with distinct keys?
        options:
          - "The in-order traversal is strictly increasing"
          - "The minimum key is in the leftmost node"
          - "The root holds the median key"
          - "Every node's left child, if any, has a smaller key"
        answer: [0, 1, 3]
        explanation: "Sorted in-order, minimum at the leftmost node and smaller left children follow from the invariant. The root is the median only in a perfectly balanced tree built that way."
      - id: q6
        kind: short
        prompt: Explain how to find the LCA of two keys in a BST in O(h) without a full traversal.
        model_answer: "Start at the root. If both keys are smaller than the node, the LCA is in the left subtree; if both are larger, in the right; otherwise the keys split here (or one equals the node), so the node is the LCA. Each step goes one level down, so O(h) time and O(1) space iteratively."
        explanation: The invariant tells you which side holds both keys without searching both subtrees.
