- key: dsa.tree_paths.interview
  type: interview_question
  title: "Interview question: longest path of equal values"
  skills: [trees.path_depth]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 900}
  body:
    prompt: "Explain how to find the length, in edges, of the longest path in a binary tree where every node on the path has the same value. The path may not pass through the root. State the return value of your helper, what you record, and the complexity."
    key_points:
      - "Helper returns the longest single downward chain of equal values starting at the node (in edges)."
      - "For each child, arm = child_chain + 1 if the child's value equals the node's value, else 0."
      - "Records left_arm + right_arm as the best path bending at the node; returns max(left_arm, right_arm)."
      - "O(n) time, O(h) stack."
    model_answer: "A post-order helper returns the longest equal-value chain going down from a node. At a node, each child's chain extends by one edge only if the child has the same value; otherwise that arm is 0. The best path bending at the node is the sum of the two arms, recorded in an outer variable; the parent receives only the larger arm. Every node is visited once."
    pitfalls:
      - Returning left + right, which lets the parent extend a forked path.
      - Resetting the arm to the child's chain length instead of 0 when values differ.
    follow_ups:
      - prompt: How do you avoid a shared outer variable?
        look_for: Return a tuple (chain, best_in_subtree) and combine children's bests with the bend at the node.
      - prompt: What changes if the tree is an n-ary tree?
        look_for: Keep the two largest arms among all children; the bend is their sum.
