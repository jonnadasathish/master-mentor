- key: dsa.backtracking.interview
  type: interview_question
  title: "Interview question: placing non-attacking queens"
  skills: [backtracking.core]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 900}
  body:
    prompt: "Explain how you would list every way to place n queens on an n × n board so that no two attack each other. Describe the state, the pruning checks and their cost, and the complexity."
    key_points:
      - "Place one queen per row, so a level of the decision tree chooses the column for that row."
      - "Keep three sets: used columns, used diagonals (row - col) and used anti-diagonals (row + col), giving O(1) validity checks."
      - "Choose by adding to all three sets, recurse to the next row, unchoose by removing them."
      - "Time is bounded by O(n!) placements (fewer in practice due to diagonal pruning); space O(n) besides the output."
    model_answer: Each row gets exactly one queen, so the recursion goes row by row and tries every column. A column is allowed if it is not in the column set, row minus column is not in the diagonal set and row plus column is not in the anti-diagonal set. On reaching row n, record the board. The search tree has at most n · (n-1) · … nodes because columns cannot repeat, and diagonal pruning cuts far more. For n = 8 there are 92 solutions.
    pitfalls:
      - Checking validity by scanning the whole board, which makes each check O(n²).
      - Using the same key for both diagonal directions.
    follow_ups:
      - prompt: How would you only count the solutions faster?
        look_for: Same search without building boards; bitmasks for columns and diagonals shifted per row to get available positions in O(1) words.
      - prompt: How would you stop at the first solution?
        look_for: Return a boolean from the recursion and propagate True upward to stop exploring.
- key: dsa.backtracking.cards
  type: revision_card
  title: "Recall: backtracking"
  skills: [backtracking.core]
  minutes: 5
  body:
    cards:
      - front: Backtracking skeleton?
        back: Check complete, then for each valid choice — choose, explore, unchoose.
      - front: Why record path[:] and not path?
        back: The path list keeps changing; you need a snapshot.
      - front: Skip duplicates at the same level?
        back: "Sort, then skip when i > start and nums[i] == nums[i - 1]."
      - front: Reusable elements in combination sum?
        back: Recurse with start i, not i + 1.
      - front: Cost of subsets and permutations?
        back: O(n · 2ⁿ) and O(n · n!), stack depth O(n).
