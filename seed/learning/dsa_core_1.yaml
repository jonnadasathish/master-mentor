# ---------------------------------------------------------------------------------------------- prefix sums
- key: dsa.prefix_sum.lesson
  type: lesson
  title: Prefix sums and prefix-state hashing
  skills: [prefix_sum.core, hashing.lookup_frequency]
  minutes: 25
  difficulty: MEDIUM
  body:
    summary: A subarray sum is the difference of two prefix sums, so range queries become O(1) and "count subarrays with property X" becomes a hash-map lookup on earlier prefixes.
    what: |-
      The prefix sum array `P` has `P[0] = 0` and `P[i + 1] = P[i] + nums[i]`, so `P[i]` is the sum of the first `i` elements. Then:

      ```text
      sum(nums[l..r]) = P[r + 1] - P[l]        (inclusive l..r)
      ```

      **Prefix-state hashing** extends this: while scanning, keep a map from each prefix value (or a state derived from it: a remainder, a parity, a balance) to how many times it occurred, or to where it first occurred. A subarray ending at `j` with sum `k` exists exactly when some earlier prefix equals `P[j + 1] - k`.
    why: |-
      Without prefix sums, each range sum costs O(length), and counting all subarrays with a given sum costs O(n²) even with running sums. Prefix sums make each range query O(1) after an O(n) build, and prefix-state hashing counts qualifying subarrays in a single O(n) pass. Unlike a sliding window, this works with **negative numbers**, because it never assumes that growing a window increases its sum.
    when: |-
      - Many range-sum queries on an array that does not change.
      - "Count or find subarrays whose sum equals k, is divisible by k, or has equal numbers of two kinds of element."
      - The input can contain negatives or zeros, which breaks sliding-window reasoning.
      - Variants: prefix XOR, prefix products (careful with zeros), 2-D prefix sums for rectangle sums, difference arrays for many range updates.
    how: |-
      **Range queries:** build `P` with a leading zero; each query is one subtraction.

      **Count subarrays with sum k:**

      ```python
      count, running = 0, 0
      seen = {0: 1}                       # the empty prefix, so subarrays starting at 0 count
      for x in nums:
          running += x
          count += seen.get(running - k, 0)
          seen[running] = seen.get(running, 0) + 1
      ```

      **Longest subarray with a property:** store the **first** index of each prefix state, and never overwrite it; length is `j - first[state]`.

      **Divisible by k:** two prefixes with the same remainder `P % k` differ by a multiple of k. In Python `%` with a positive k is already non-negative, so negative sums need no fix.

      **2-D:** `S[r + 1][c + 1] = grid[r][c] + S[r][c + 1] + S[r + 1][c] - S[r][c]`, and a rectangle sum uses four lookups with inclusion–exclusion.
    mental_model: |-
      Every subarray is "prefix up to the end, minus prefix before the start". So instead of choosing two endpoints, you stand at each end point and ask how many start points (earlier prefixes) give the value you need. Invariant: when processing index `j`, the map holds exactly the prefixes `P[0..j]`, never the current one before the lookup.
    tradeoffs: |-
      Prefix arrays cost O(n) memory and must be rebuilt (O(n)) after every update; with frequent updates a Fenwick tree or segment tree gives O(log n) queries and updates. For non-negative arrays a sliding window finds "shortest/longest subarray with sum at least/at most k" in O(1) extra space, so prefix hashing is the tool of choice mainly when negatives appear or when you count exact matches.
    mistakes:
      - "Forgetting the seed `{0: 1}` (or `{0: -1}` for first-index maps), which misses subarrays that start at index 0."
      - Inserting the current prefix before looking it up, so a k = 0 query counts the empty subarray.
      - Overwriting the first-seen index when looking for the longest subarray.
      - Mixing inclusive and exclusive ends; with a leading zero, the sum of `l..r` is `P[r + 1] - P[l]`.
      - Using a sliding window for "sum equals k" when values can be negative.
      - Taking remainders in a language where `%` can be negative without normalising (not an issue in Python, but worth saying).
    interview: |-
      The tell is "count subarrays" or "longest subarray" with an exact condition, especially with negative numbers allowed. Say: "a subarray sum is a difference of prefix sums, so for each end I need the number of earlier prefixes equal to current minus k". Expect follow-ups on divisibility (remainders), equal counts of 0s and 1s (map 0 to -1), and 2-D versions.
    explain_it:
      - "Write the identity sum(l..r) = P[r + 1] - P[l]."
      - Say what the map stores (count or first index) and why that matches the question (count or longest).
      - Explain the seed for the empty prefix.
      - Explain why negatives do not break it, unlike a sliding window.
      - Give O(n) time and O(n) space.
    example:
      language: python
      code: |-
        def longest_balanced(bits: list[int]) -> int:
            """Length of the longest subarray with as many 0s as 1s."""
            first_index = {0: -1}            # balance 0 is reached before any element
            balance, best = 0, 0
            for i, b in enumerate(bits):
                balance += 1 if b == 1 else -1
                if balance in first_index:
                    best = max(best, i - first_index[balance])
                else:
                    first_index[balance] = i  # keep the earliest index only
            return best

        assert longest_balanced([0, 1, 0]) == 2
        assert longest_balanced([0, 0, 1, 0, 0, 0, 1, 1]) == 6
      explanation: Mapping 0 to -1 turns "equal counts" into "subarray sum 0", that is two equal prefix balances. Storing the first index maximises length. O(n) time and space.
    complexity: Build O(n), range query O(1); prefix-state hashing O(n) average time and O(n) space. 2-D build O(rows × cols), rectangle query O(1).
    edge_cases:
      - The whole array is the answer (needs the seed).
      - k = 0 and runs of zeros (many overlapping subarrays).
      - All negative values.
      - A single element equal to k.
    misconceptions:
      - "Prefix sums need sorted input — they need nothing; order matters only because subarrays are contiguous."
      - "Sliding window and prefix sums are interchangeable — the window needs a monotonic condition, usually non-negative values."
- key: dsa.prefix_sum.check
  type: concept_check
  title: "Concept check: prefix sums"
  skills: [prefix_sum.core]
  minutes: 8
  difficulty: MEDIUM
  body:
    intro: Use the identity sum(l..r) = P[r + 1] - P[l] with P[0] = 0.
    questions:
      - id: q1
        kind: single
        prompt: "For nums = [3, -1, 2, 4], P = [0, 3, 2, 4, 8]. What is the sum of nums[1..2] (inclusive), computed from P?"
        options: ["P[2] - P[1] = -1", "P[3] - P[1] = 1", "P[3] - P[2] = 2", "P[2] - P[0] = 2"]
        answer: [1]
        explanation: "Inclusive l = 1, r = 2 means P[r + 1] - P[l] = P[3] - P[1] = 4 - 3 = 1, and indeed -1 + 2 = 1. P[2] - P[1] is only nums[1]."
      - id: q2
        kind: single
        prompt: "What does this return for `nums = [1, 1, 1]` and `k = 2`, and what happens if the seed `{0: 1}` is replaced by `{}`?"
        code:
          language: python
          code: |-
            def f(nums, k):
                count, running, seen = 0, 0, {0: 1}
                for x in nums:
                    running += x
                    count += seen.get(running - k, 0)
                    seen[running] = seen.get(running, 0) + 1
                return count
        options: ["2, and 1 without the seed", "2, and 2 without the seed", "3, and 2 without the seed", "1, and 0 without the seed"]
        answer: [0]
        explanation: "Subarrays [1, 1] at 0..1 and 1..2 give 2. The one starting at index 0 is found only through the empty prefix 0, so without the seed the count drops to 1."
      - id: q3
        kind: single
        prompt: Why does a sliding window fail for "count subarrays with sum k" when values can be negative?
        options:
          - Because adding an element can decrease the sum, so shrinking from the left is not a safe decision
          - Because sliding windows only work on strings
          - Because the window must have a fixed size
          - It does not fail; it only becomes slower
        answer: [0]
        explanation: "The window relies on monotonicity: extending can only increase the sum, shrinking only decrease it. With negatives a too-large sum may become valid again after extending, so discarding the left end loses answers. Prefix hashing has no such assumption."
      - id: q4
        kind: multi
        prompt: Which problems reduce naturally to prefix sums or prefix-state hashing?
        options:
          - Count subarrays whose sum is divisible by k
          - Longest subarray with equal numbers of 0s and 1s
          - Maximum of every window of size k
          - Sum of any sub-rectangle of a fixed grid in O(1) per query
        answer: [0, 1, 3]
        explanation: "Divisibility uses equal remainders, the 0/1 balance uses equal prefix balances, and rectangles use a 2-D prefix table. Window maximum is not additive; it needs a monotonic deque."
      - id: q5
        kind: single
        prompt: "In Python, what is `-7 % 5`, and why does it matter for remainder-based prefix hashing?"
        options:
          - "3; Python's % is non-negative for a positive modulus, so equal remainders group correctly without a fix"
          - "-2; you must add 5 before using it as a key"
          - "2; Python takes the absolute value first"
          - It raises ValueError for negative operands
        answer: [0]
        explanation: "Python's % takes the sign of the divisor, so -7 % 5 == 3 (because -7 = 5 × -2 + 3). In C or Java the result is -2 and you must normalise with ((x % k) + k) % k."
      - id: q6
        kind: short
        prompt: Give the formula for the sum of the rectangle with corners (r1, c1) and (r2, c2), inclusive, using a 2-D prefix table S with a zero row and column.
        model_answer: "S[r2 + 1][c2 + 1] - S[r1][c2 + 1] - S[r2 + 1][c1] + S[r1][c1]. The last term is added back because the top-left block was subtracted twice."
        explanation: Inclusion–exclusion is the whole trick; off-by-one errors disappear when the table has a leading zero row and column.
- key: dsa.prefix_sum.exercise
  type: coding_exercise
  title: "Exercise: count subarrays with a sum divisible by k"
  skills: [prefix_sum.core, hashing.lookup_frequency]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      Given an integer array (values may be negative) and a positive integer `k`, return the number of non-empty contiguous subarrays whose sum is divisible by `k`. Aim for O(n) time.
    examples:
      - "nums = [4, 5, 0, -2, -3, 1], k = 5 -> 7"
      - "nums = [5], k = 9 -> 0"
      - "nums = [0, 0], k = 3 -> 3"
    constraints:
      - Up to 3 × 10⁴ elements; -10⁴ <= value <= 10⁴; 2 <= k <= 10⁴.
    hints:
      - When is P[j] - P[i] divisible by k?
      - Exactly when P[j] and P[i] have the same remainder modulo k.
      - Count remainders seen so far, seeded with remainder 0 seen once.
    solution:
      language: python
      code: |-
        def count_divisible_subarrays(nums: list[int], k: int) -> int:
            remainder_count = [0] * k
            remainder_count[0] = 1            # empty prefix
            running, total = 0, 0
            for x in nums:
                running = (running + x) % k   # Python: always in 0..k-1
                total += remainder_count[running]
                remainder_count[running] += 1
            return total
      explanation: Remainders are in 0..k-1, so a list replaces the dict. O(n + k) time and O(k) space. Each new prefix pairs with every earlier prefix of the same remainder.
    rubric:
      - {key: correct, label: "Returns 7, 0 and 3 for the examples", points: 4}
      - {key: identity, label: Explains that equal remainders imply a divisible difference, points: 2}
      - {key: seed_and_order, label: Seeds the empty prefix and looks up before incrementing, points: 2}
      - {key: complexity, label: "States O(n + k) time and O(k) space (or O(n) with a dict)", points: 2}
    follow_ups:
      - prompt: Return whether some subarray of length at least 2 has a sum divisible by k. What do you store instead of counts?
        look_for: The first index of each remainder (seed remainder 0 at index -1) and check j - first >= 2.
      - prompt: How would this look in Java, where % can be negative?
        look_for: Normalise with ((running % k) + k) % k.
