- key: dsa.heap_patterns.interview
  type: interview_question
  title: "Interview question: merge sorted logs from many servers"
  skills: [heap.two_heaps_merge_k]
  minutes: 15
  difficulty: HARD
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 900}
  body:
    prompt: "Each of 500 servers produces a log file already sorted by timestamp; together they hold 2 billion lines, far more than memory. Explain how to produce one globally sorted output file, the complexity, and the memory you need."
    key_points:
      - "K-way merge with a min-heap of (timestamp, file_index, line) holding one current line per file."
      - "Each line is pushed and popped once: O(N log k) with N = 2 × 10⁹ and k = 500, so about 9 heap levels per line."
      - "Memory is O(k) lines plus buffered reads per file; output is written sequentially."
      - "Tie-break on file index so equal timestamps never compare whole lines, and the merge is deterministic."
    model_answer: Open all 500 files with buffered readers, push each file's first line into a min-heap keyed by (timestamp, file index), then repeatedly pop the smallest, write it, and push the next line from the same file. Every line goes through a heap of at most 500 entries, so the work is N log k and memory is a few hundred lines plus I/O buffers. If 500 open files are too many, merge in two levels (for example 25 groups of 20), costing one extra pass over the data.
    pitfalls:
      - Concatenating and sorting, which needs the data in memory or an external sort with more passes.
      - Merging files one by one into a growing output, which reads early data k times.
    follow_ups:
      - prompt: Timestamps are only sorted within a few seconds of skew per server. What changes?
        look_for: Buffer a window per source or use a bounded reorder buffer (min-heap keyed by timestamp, emit when older than the max skew).
      - prompt: Why does the number of open files matter and how do you work around it?
        look_for: OS file-descriptor limits and memory per buffer; multi-pass merge with a fan-in that fits.
- key: dsa.heap_patterns.cards
  type: revision_card
  title: "Recall: two heaps and K-way merge"
  skills: [heap.two_heaps_merge_k]
  minutes: 5
  body:
    cards:
      - front: Two-heap median invariants?
        back: Every low value ≤ every high value; len(low) equals len(high) or is one more.
      - front: Median read cost with two heaps?
        back: O(1) from the tops; O(log n) per insert.
      - front: K-way merge cost?
        back: O(N log k) time, O(k) heap.
      - front: Tie-breaker in heap tuples for nodes?
        back: Insert a unique index before the node.
      - front: Deleting from a heap without support?
        back: Lazy deletion when the stale value reaches the top.

# ---------------------------------------------------------------------------------------------- trie
- key: dsa.trie.lesson
  type: lesson
  title: "Tries: prefix trees for words and prefixes"
  skills: [trie.core, trees.traversal, hashing.lookup_frequency]
  minutes: 25
  difficulty: MEDIUM
  body:
    summary: A trie stores strings character by character on paths from the root, so any prefix query costs O(length of the prefix), independent of how many words are stored.
    what: |-
      A **trie** (prefix tree) is a tree where each edge is a character and each node represents the prefix spelled by the path from the root. A flag on a node marks that a complete word ends there. Words sharing a prefix share the nodes of that prefix.

      ```python
      class TrieNode:
          __slots__ = ("children", "is_word", "pass_count")

          def __init__(self) -> None:
              self.children: dict[str, "TrieNode"] = {}
              self.is_word = False
              self.pass_count = 0          # how many inserted words pass through this node
      ```
    why: |-
      A hash set answers "is this exact word present?" well, but not "which words start with `pre`?" or "is any stored word a prefix of this string?" without scanning everything. Tries answer prefix questions in time proportional to the prefix, which is why they appear in autocomplete, spell checkers, routing tables (longest-prefix match on bits), and word-search puzzles where a prefix that matches nothing lets you stop early.
    when: |-
      - Many prefix queries against a fixed or growing set of words.
      - "Find the shortest or longest stored prefix of a given string."
      - Searching a grid or with wildcards, where you want to prune as soon as no word continues the current path.
      - If you only need exact lookups, a set is simpler and uses less memory.
    how: |-
      **Insert**: walk from the root, creating missing children, then set `is_word` on the last node. **Search**: walk; fail on a missing child; succeed only if the last node has `is_word`. **Prefix check**: the same walk without the flag check.

      ```python
      class Trie:
          def __init__(self) -> None:
              self.root = TrieNode()

          def insert(self, word: str) -> None:
              node = self.root
              for ch in word:
                  node = node.children.setdefault(ch, TrieNode())
                  node.pass_count += 1
              node.is_word = True

          def _walk(self, s: str):
              node = self.root
              for ch in s:
                  node = node.children.get(ch)
                  if node is None:
                      return None
              return node

          def search(self, word: str) -> bool:
              node = self._walk(word)
              return node is not None and node.is_word

          def count_prefix(self, prefix: str) -> int:
              node = self._walk(prefix)
              return node.pass_count if node else 0
      ```

      **Wildcards** (`.` matches any letter): DFS; on `.` try every child. **Grid word search**: put all dictionary words in a trie, start a DFS from each cell, and follow trie children as you move; stop when the current letter has no child. When a word is found, clear its flag (to avoid duplicates) and prune leaf nodes that no longer lead to any word.

      **Children as dict or array**: a 26-slot list per node gives O(1) indexing and lexicographic order for free but wastes memory on sparse nodes; a dict stores only present children.
    mental_model: |-
      A trie is a phone keypad menu: each key press narrows the options, and a word is a path through the menu that ends on a "done" light. Two words that start the same way walk the same menu until they diverge, so the shared beginning is stored once.
    tradeoffs: |-
      Time per operation is O(L) for a word of length L, independent of the number of words n. Memory is O(total characters) nodes in the worst case, and in Python each node is an object plus a dict, which costs far more than the characters themselves; a set of strings is usually much smaller. A sorted list plus `bisect` also answers prefix queries in O(L log n) and is compact, at the cost of O(n) insertion. Tries shine when there are many queries, many shared prefixes, or when early pruning saves an exponential search.
    mistakes:
      - Returning True from search when the path exists but `is_word` is False (a prefix is not a word).
      - Creating nodes during search (using `setdefault` in the read path), which silently grows the trie.
      - In grid search, building the trie but still checking each word separately, losing the shared-prefix pruning.
      - Forgetting to clear a found word's flag in grid search, which reports duplicates.
      - Assuming a trie always saves memory compared with a set.
    interview: |-
      Implement insert, search and starts_with cleanly first (this is often the whole first question), then expect extensions: wildcard search, counting words with a prefix, deleting words, autocomplete suggestions, and grid word search with pruning. State O(L) per operation and memory in terms of total characters, and mention the per-node overhead in Python.
    explain_it:
      - What a node represents (a prefix) and what the end flag means.
      - Insert, search and prefix walks, and how they differ.
      - O(L) time per operation; O(total characters) nodes.
      - Where pruning comes from in wildcard and grid searches.
    example:
      language: python
      code: |-
        def search_with_wildcards(node: "TrieNode", word: str, i: int = 0) -> bool:
            """'.' matches any single letter."""
            if i == len(word):
                return node.is_word
            ch = word[i]
            if ch == ".":
                return any(search_with_wildcards(child, word, i + 1)
                           for child in node.children.values())
            child = node.children.get(ch)
            return child is not None and search_with_wildcards(child, word, i + 1)
      explanation: "Without wildcards O(L). Each '.' branches into every child, so with many wildcards the search can visit every node down to depth L; the depth of recursion is L."
    complexity: Insert, search and prefix queries O(L); space O(total characters) nodes; wildcard search worst case visits all nodes up to depth L.
    edge_cases:
      - Empty string as a word (the root's flag).
      - A word that is a prefix of another (car and cart).
      - Inserting the same word twice (pass counts should reflect your chosen semantics).
      - Non-lowercase characters when children are a 26-slot array.
- key: dsa.trie.check
  type: concept_check
  title: "Concept check: tries"
  skills: [trie.core]
  minutes: 10
  difficulty: MEDIUM
  body:
    intro: Draw the trie for the small examples.
    questions:
      - id: q1
        kind: single
        prompt: "After inserting car, cart and cat into an empty trie, how many nodes exist, including the root?"
        options: ["6", "7", "10", "11"]
        answer: [0]
        explanation: "root → c → a, then a → r → t (for car and cart) and a → t (for cat): root, c, a, r, t, t = 6. 11 counts one node per character without sharing prefixes (plus the root)."
      - id: q2
        kind: single
        prompt: "With car, cart and cat inserted, what do search('ca') and starts_with('ca') return?"
        options: ["True and True", "False and True", "True and False", "False and False"]
        answer: [1]
        explanation: "The path c-a exists, so starts_with is True, but no word ends at that node (is_word is False), so search is False. Treating a path as a word is the most common trie bug."
      - id: q3
        kind: single
        prompt: Time to search for a word of length L in a trie holding n words?
        options: ["O(log n)", "O(L)", "O(n · L)", "O(L log n)"]
        answer: [1]
        explanation: "The walk visits one node per character with an O(1) child lookup; the number of stored words does not matter. O(L log n) is the cost of binary search on a sorted list of strings."
      - id: q4
        kind: multi
        prompt: Which statements are true?
        options:
          - "A trie answers \"does any word start with p?\" in O(len(p))"
          - "A hash set answers exact lookups in O(L) on average, because hashing reads the string"
          - "A trie always uses less memory than a set of the same words"
          - "DFS over a trie with 26-slot child arrays visited in index order yields words in lexicographic order"
        answer: [0, 1, 3]
        explanation: "Prefix queries and ordered traversal are the trie's strengths, and hashing a string is linear in its length. Memory depends on sharing; in Python, node objects and dicts usually make a trie larger than a set."
      - id: q5
        kind: single
        prompt: "In grid word search with a trie, why clear a word's end flag (and prune empty leaves) once the word is found?"
        options:
          - "It is required for correctness of the trie"
          - "It prevents reporting the same word twice and stops exploring branches that can no longer produce new words"
          - "It reduces the grid size"
          - "Python requires it to free memory"
        answer: [1]
        explanation: "The same word may be traceable along several paths; clearing the flag reports it once. Pruning leaves cuts future DFS work, which matters because grid search is exponential in word length."
      - id: q6
        kind: short
        prompt: How would you support "how many stored words start with prefix p" in O(len(p))?
        model_answer: "Keep a pass count on each node, incremented for every node on the path when a word is inserted (and decremented on delete). Then walk to the node for p and return its pass count, or 0 if the path is missing."
        explanation: Augmenting nodes with counts is the standard way to answer aggregate prefix queries without a subtree traversal.
- key: dsa.trie.exercise
  type: coding_exercise
  title: "Exercise: replace words with their shortest stored root"
  skills: [trie.core, strings.manipulation]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      You are given a list of roots and a sentence of space-separated lowercase words. Replace every word that starts with some root by the **shortest** such root; leave other words unchanged. Return the new sentence.
    examples:
      - "replace(['go', 'gone', 'pre'], 'going prefix gone now') == 'go pre go now'"
      - "replace(['a'], 'apple banana') == 'a banana'"
    constraints:
      - Up to 1000 roots of length ≤ 100; the sentence has up to 10⁶ characters.
    hints:
      - Insert all roots into a trie.
      - For each word, walk the trie and stop at the first node with the end flag.
      - If the walk falls off the trie first, keep the word.
    solution:
      language: python
      code: |-
        def replace(roots: list[str], sentence: str) -> str:
            END = "$"
            trie: dict = {}
            for root in roots:
                node = trie
                for ch in root:
                    node = node.setdefault(ch, {})
                node[END] = root

            def shortest_root(word: str) -> str:
                node = trie
                for ch in word:
                    if END in node:
                        return node[END]
                    node = node.get(ch)
                    if node is None:
                        return word
                return node.get(END, word)

            return " ".join(shortest_root(w) for w in sentence.split())
      explanation: "Building costs O(total root characters); each word stops at its shortest root or when it leaves the trie, so the whole sentence is O(total characters). The checking-every-root alternative is O(words × roots × L)."
    rubric:
      - key: correct
        label: "Correct for words with no root, several roots, and a word equal to a root"
        points: 4
      - key: shortest
        label: "Stops at the first end flag on the walk so the shortest root wins"
        points: 3
      - key: complexity
        label: "States linear time in total characters and compares with the brute force"
        points: 2
      - key: no_mutation_on_read
        label: "Does not create trie nodes while querying"
        points: 1
    follow_ups:
      - prompt: How would you do this without a trie, and when is that good enough?
        look_for: Put roots in a set and test word prefixes of length 1..min(L, max_root_len); O(L²) per word due to slicing and hashing, fine for short words.
      - prompt: What if you needed the longest root instead?
        look_for: Keep walking and remember the last end flag seen; return it when the walk ends.
