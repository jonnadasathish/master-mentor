- key: dsa.trie.interview
  type: interview_question
  title: "Interview question: autocomplete suggestions"
  skills: [trie.core]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 900}
  body:
    prompt: "As the user types into a search box, return up to three suggestions starting with the typed prefix, ranked by past search count, ties alphabetical. There are 10⁶ distinct past queries. Compare a trie-based design with a sorted-list design and discuss latency and memory."
    key_points:
      - "Trie: walk to the prefix node in O(len(prefix)); either DFS the subtree to rank candidates, or store a precomputed top-3 list at every node."
      - "Precomputed top-3 per node makes each keystroke O(len(prefix)) but costs memory per node and updates along the whole path when counts change."
      - "Sorted list plus bisect: lexicographic suggestions in O(log n) per keystroke, but ranking by count needs extra work."
      - "Incremental typing: keep the current node and step one child per keystroke instead of walking from the root."
      - "Mentions Python per-node overhead and that a production system would shard or use a compact structure."
    model_answer: A trie maps prefixes to nodes. Ranking by count with a DFS of the subtree is too slow for short prefixes like 'a' that cover most queries, so I would store at each node the top three (count, query) pairs, maintained on insert by updating every node on the path. A keystroke then costs one child step from the previous node. A sorted list with bisect is simpler and compact for alphabetical suggestions, but ranking by count would need a scan of the prefix range. Memory is the main cost of the trie in Python; at 10⁶ queries I would measure it and consider a more compact representation.
    pitfalls:
      - DFS over the entire subtree for every keystroke.
      - Forgetting to update stored top-k lists when counts change.
    follow_ups:
      - prompt: How do you handle a count update for a query that is already stored?
        look_for: Walk its path and update each node's top-k list (remove and reinsert); O(L · k).
      - prompt: How would you support typos?
        look_for: Bounded edit-distance search over the trie (DFS carrying a DP row), pruning branches whose minimum distance exceeds the limit.
- key: dsa.trie.cards
  type: revision_card
  title: "Recall: tries"
  skills: [trie.core]
  minutes: 5
  body:
    cards:
      - front: What does a trie node represent?
        back: The prefix spelled by the path from the root.
      - front: search vs starts_with?
        back: Same walk; search also requires the end flag.
      - front: Trie operation cost?
        back: O(L) for a string of length L, independent of n.
      - front: Count words with a prefix?
        back: Store a pass count on each node during insert.
      - front: Grid word search speed-up?
        back: One trie of all words prunes paths with no matching prefix.
