- key: dsa.dry_run.cards
  type: revision_card
  title: "Recall: testing and dry runs"
  skills: [execution.testing_dry_run]
  minutes: 5
  body:
    cards:
      - front: Best size of input for a hand trace?
        back: The smallest one that exercises every branch, usually 2–3 elements.
      - front: Where is the bug when trace row 3 diverges?
        back: In the code that ran between row 2 and row 3.
      - front: Edge cases to always consider?
        back: Empty, single, duplicates, all equal, negatives, answer at either end.
      - front: What to do before running a test?
        back: Write the expected output, so a wrong output is recognisable.
      - front: After a fix, which tests do you re-run?
        back: The failing case and the previously passing cases.
