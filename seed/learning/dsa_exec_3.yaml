- key: dsa.bug_free.cards
  type: revision_card
  title: "Recall: first-pass correctness habits"
  skills: [execution.bug_free_coding]
  minutes: 5
  body:
    cards:
      - front: Safest default range convention?
        back: "Half-open [lo, hi), used consistently."
      - front: Most forgotten line in group or run code?
        back: The final flush after the loop.
      - front: Initial value for a running maximum that may be negative?
        back: The first element or -math.inf, never 0.
      - front: Deleting dict keys while iterating?
        back: Iterate over list(d) or rebuild; otherwise RuntimeError.
      - front: Linked-list idiom that removes the head special case?
        back: A dummy head node.
      - front: Three questions of the line review?
        back: In range? Initialised and updated on every path? Loop makes progress?

# ---------------------------------------------------------------------------------------------- testing and dry run
- key: dsa.dry_run.lesson
  type: lesson
  title: Testing and dry-running your own code
  skills: [execution.testing_dry_run]
  minutes: 20
  difficulty: EASY
  body:
    summary: Pick a few targeted inputs, trace them in a variable table, and compare each row with what the invariant says should be there.
    what: |-
      A dry run is executing your code by hand on a small input, writing down the variables after each iteration. Testing is choosing which inputs to run (by hand or for real) so that each one could expose a different kind of bug. Together they are how you verify code before the interviewer asks "does this work?"
    why: |-
      Interviewers usually expect you to test without being prompted. A good dry run catches the off-by-one, the missing flush or the wrong initial value in a minute, and shows that you verify your work. Saying "I think it works" without a trace gives the interviewer nothing.
    when: |-
      - Before writing code: two or three examples to understand the problem and confirm expected outputs.
      - After writing code: one normal case traced fully, then targeted edge cases checked quickly.
      - After any fix: re-run the case that failed and one that previously passed.
    how: |-
      **Choose inputs by the bug they target**, not at random:

      - The given example (sanity).
      - Smallest non-trivial input (2–3 elements): fast to trace, hits every branch.
      - Empty and single element: initialisation and guards.
      - Answer at the very first or very last position: bounds and final flush.
      - Duplicates, all equal, negatives, already sorted or reverse sorted: comparison and tie handling.
      - The input that breaks the tempting wrong approach (for example, negatives for a sliding window).

      **Trace in a table**, one row per iteration:

      ```text
      i | x | left | window   | best
      0 | a | 0    | {a}      | 1
      1 | b | 0    | {a,b}    | 2
      2 | a | 1    | {b,a}    | 2
      ```

      Compare each row with what the invariant says it should be. The first divergent row locates the bug.

      **If you can run code**, turn the cases into asserts: `assert f([]) == 0`. One line per case keeps them re-runnable after every fix.
    mental_model: |-
      Tests are a net with holes in different places: each input should catch a different kind of fish. Ten random arrays catch the same bug ten times; six chosen inputs catch six different bugs.
    tradeoffs: |-
      A full trace of a long input wastes time and invites arithmetic slips; trace the smallest input that exercises every branch, and check edge cases by reasoning about the guard lines. When you can run code, asserts are faster than hand traces, but a hand trace is still how you explain why a case passes.
    mistakes:
      - Tracing what you intended the code to do instead of what each line actually does.
      - Testing only the provided example, which was usually chosen to be well-behaved.
      - Using inputs too large to trace, then skipping rows.
      - Forgetting to re-test previously passing cases after a fix.
      - Not computing the expected output before running, so any output looks plausible.
    interview: |-
      After coding, say "let me test it" before the interviewer asks. Trace one example aloud with the variable values, then list the edge cases and say how the code handles each. If you find a bug, that is a good outcome: you found it before they did.
    explain_it:
      - Name each test input and the bug class it targets.
      - Trace the smallest non-trivial case with a variable table.
      - Compare each row with the invariant.
      - Re-test after every fix.
    example:
      language: python
      code: |-
        def max_profit(prices: list[int]) -> int:
            best, low = 0, float("inf")
            for p in prices:
                low = min(low, p)
                best = max(best, p - low)
            return best

        # Targeted tests, written before running:
        assert max_profit([7, 1, 5, 3, 6, 4]) == 5   # given example
        assert max_profit([]) == 0                   # empty: guard by initial values
        assert max_profit([5]) == 0                  # single price: no transaction
        assert max_profit([5, 4, 3]) == 0            # falling prices: never negative
        assert max_profit([1, 9]) == 8               # answer at the last position
        assert max_profit([3, 3, 3]) == 0            # all equal
      explanation: Each assert targets a different bug class; none of them repeats another's purpose.
    complexity: A trace costs O(iterations × variables) of your time; keep inputs to a handful of elements.
    edge_cases:
      - Inputs where the expected output itself is ambiguous; clarify with the interviewer before testing.
      - Randomised or order-independent outputs; compare sorted results or check properties instead of exact equality.
    misconceptions:
      - "If the example passes, the code is correct. Examples are chosen to explain the problem, not to break code."
      - "More tests are better tests. Different tests are better tests."
- key: dsa.dry_run.check
  type: concept_check
  title: "Concept check: choosing and tracing tests"
  skills: [execution.testing_dry_run]
  minutes: 8
  difficulty: EASY
  body:
    intro: Pick the inputs and traces that would actually catch bugs.
    questions:
      - id: q1
        kind: single
        prompt: "Your sliding-window loop is `for right in range(len(nums) - 1)`. Which test exposes the bug?"
        options:
          - The given example, where the best window is in the middle
          - An input where the best window ends at the last element
          - An empty input
          - An input whose best window starts at index 0 and ends before the last element
        answer: [1]
        explanation: "The loop never processes the last element, so only a test whose answer needs that element fails. Middle answers pass by luck; that is why 'answer at either end' belongs in every test set."
      - id: q2
        kind: multi
        prompt: "Which tests belong in a small, targeted set for a function returning the maximum subarray sum?"
        options:
          - A single negative number
          - All negative numbers
          - A mix with the best run at the end
          - Ten random arrays of length 1,000
        answer: [0, 1, 2]
        explanation: "Each targets a bug class: initialisation, the best = 0 trap, and the end boundary. Random large arrays cannot be checked by hand and rarely hit a specific edge."
      - id: q3
        kind: single
        prompt: Trace this monotonic-stack loop on temps = [3, 1, 2]. What is the stack (indices) after processing index 2?
        code:
          language: python
          code: |-
            answer = [0] * len(temps)
            stack = []
            for i, t in enumerate(temps):
                while stack and t > temps[stack[-1]]:
                    j = stack.pop()
                    answer[j] = i - j
                stack.append(i)
        options: ["[0, 1, 2]", "[0, 2]", "[2]", "[1, 2]"]
        answer: [1]
        explanation: "i=0 push → [0]. i=1, 1 > 3 is false, push → [0, 1]. i=2, 2 > 1 pops index 1 (answer[1] = 1), 2 > 3 is false, push → [0, 2]. Index 0 stays because no warmer day follows it."
      - id: q4
        kind: single
        prompt: Your trace's third row disagrees with the expected value. Where is the bug most likely?
        options:
          - In the return statement
          - In whatever updated the variables between row two and row three
          - In the first line of the function
          - Anywhere; you need to retrace from the start with a bigger input
        answer: [1]
        explanation: "Rows one and two matched, so the state was correct entering that iteration. The first divergent row localises the bug to the code that ran just before it. A bigger input only adds rows."
      - id: q5
        kind: single
        prompt: You fixed a bug found by the empty-input test. What do you run next?
        options:
          - Nothing; the fix is obviously correct
          - The empty-input test and the tests that passed before the fix
          - Only new tests
          - Only the given example
        answer: [1]
        explanation: "Re-run the failing case to confirm the fix, and the passing ones to confirm nothing regressed. Guard fixes in particular can change the non-empty path."
      - id: q6
        kind: short
        prompt: "List five test inputs for a function that merges overlapping intervals, and say what each targets."
        model_answer: "Empty list (guard). One interval (no merge loop). Touching intervals [1,2],[2,3] (the boundary convention). One interval containing another [1,10],[2,3] (end must be max, not the later end). Unsorted input [5,6],[1,2] (forgot to sort). Optionally all overlapping into one (chain merge)."
        explanation: The containment case catches the common bug of setting end = current end instead of max(end, current end).
- key: dsa.dry_run.trace_exercise
  type: coding_exercise
  title: "Exercise: dry-run a monotonic stack and report the state"
  skills: [execution.testing_dry_run, stack.monotonic]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 900}
  body:
    prompt: |-
      Without running anything, trace the function below.

      ```python
      def days_until_warmer(temps):
          answer = [0] * len(temps)
          stack = []                      # indices
          for i, t in enumerate(temps):
              while stack and t > temps[stack[-1]]:
                  j = stack.pop()
                  answer[j] = i - j
              stack.append(i)
          return answer
      ```

      1. For `temps = [73, 74, 75, 71, 69, 72, 76, 73]`, write the stack (as indices) after each iteration and the final `answer`.
      2. A colleague changes `>` to `>=`. Trace `[70, 70, 71]` with both versions, and say which output is correct for "strictly warmer" and why.
      3. State the invariant the stack maintains.
    hints:
      - One row per index i, columns for popped indices and the stack after the push.
      - Equal temperatures are the case the operator change affects.
    solution:
      language: python
      code: |-
        # Part 1
        # i=0 73: push            stack [0]
        # i=1 74: pop 0 (ans 1)   stack [1]
        # i=2 75: pop 1 (ans 1)   stack [2]
        # i=3 71: push            stack [2, 3]
        # i=4 69: push            stack [2, 3, 4]
        # i=5 72: pop 4 (ans 1), pop 3 (ans 2)   stack [2, 5]
        # i=6 76: pop 5 (ans 1), pop 2 (ans 4)   stack [6]
        # i=7 73: push            stack [6, 7]
        # answer = [1, 1, 4, 2, 1, 1, 0, 0]
        #
        # Part 2
        # '>'  on [70, 70, 71]: [0] -> [0, 1] -> 71 pops 1 (ans 1) and 0 (ans 2) -> [2]   answer [2, 1, 0]  correct
        # '>=' on [70, 70, 71]: [0] -> 70 >= 70 pops 0 (ans 1) -> [1] -> pops 1 (ans 1) -> [2]   answer [1, 1, 0]  wrong
        #
        # Invariant: temperatures at the stack's indices are non-increasing from bottom to top,
        # and every index on the stack has not yet seen a strictly warmer day.
      explanation: "With >=, an equal temperature counts as warmer, so day 0 reports 1 instead of 2. Equal values are exactly the edge case an operator change affects, which is why 'duplicates' belongs in every test set."
    rubric:
      - {key: trace_correct, label: Stack after every iteration and the final answer match the reference, points: 4}
      - {key: variant, label: "Traces both operator versions on [70, 70, 71] and identifies > as correct for strictly warmer", points: 3}
      - {key: invariant, label: States the non-increasing stack invariant and what an index on the stack means, points: 2}
      - {key: format, label: Uses a clear one-row-per-iteration table, points: 1}
    follow_ups:
      - prompt: Why is the function O(n) despite the nested while?
        look_for: Each index is pushed once and popped at most once, so the inner loop runs at most n times in total.
      - prompt: Which single test would you add to a test suite to protect against the >= change?
        look_for: "An input with equal adjacent temperatures followed by a warmer one, such as [70, 70, 71] → [2, 1, 0]."
