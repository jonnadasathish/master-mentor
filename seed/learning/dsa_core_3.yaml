# Learning content: DSA foundations — stacks, queues and deques, monotonic stacks, linked lists and fast/slow pointers.
seed_version: seed-v3
content:
# ---------------------------------------------------------------------------------------------- stack
- key: dsa.stack.lesson
  type: lesson
  title: Stacks for matching, nesting and evaluation
  skills: [stack.basic]
  minutes: 20
  difficulty: EASY
  body:
    summary: A stack holds the things that are still open, most recent on top; whenever the newest open thing must be resolved first, a stack is the structure.
    what: |-
      A stack is last-in, first-out (LIFO): `push` adds on top, `pop` removes from the top, `peek` reads the top. In Python a `list` is the stack: `append`, `pop()` and `stack[-1]`, all amortised O(1).

      Typical uses:

      - **Matching:** brackets, tags, quotes — the most recent opener must be closed first.
      - **Nesting:** decoding `3[a2[c]]`, simplifying file paths, undo history.
      - **Evaluation:** postfix (reverse Polish) expressions, and infix expressions with operator precedence.
      - **Replacing recursion:** an explicit stack for iterative DFS when the recursion depth could exceed Python's limit (1000 by default).
    why: |-
      Nested structure means the last thing opened is the first thing that can be closed. A counter can check a single bracket type, but as soon as there are several types or the content between them matters, you need to remember the order of what is open — exactly what a stack stores. Each element is pushed and popped at most once, so a stack pass is O(n).
    when: |-
      - The input has nesting or matching pairs.
      - Processing an element may cancel or combine with the most recent unprocessed element ("remove adjacent duplicates", "asteroid collisions").
      - You evaluate an expression or parse a path or a nested encoding.
      - You need to convert recursion to iteration.
    how: |-
      **Matching brackets:**

      ```python
      pairs = {")": "(", "]": "[", "}": "{"}
      stack = []
      for ch in s:
          if ch in "([{":
              stack.append(ch)
          elif not stack or stack.pop() != pairs[ch]:
              return False
      return not stack          # leftover openers mean unbalanced
      ```

      **Postfix evaluation:** push numbers; on an operator pop the **right** operand first, then the left, compute and push the result. For division that truncates toward zero, use `int(a / b)` for small values or sign-aware integer division; `//` floors, so `-7 // 2 == -4` while truncation gives `-3`.

      **Nested decoding:** when you meet `[`, push a frame (the string built so far and the repeat count) and start fresh; on `]`, pop the frame and set `current = previous + count × current`.
    mental_model: |-
      The stack is the list of things still waiting for their partner, ordered by how recently they started. Invariant: the top is the only element that can be resolved next. If an element could be resolved out of order, a stack is the wrong tool.
    tradeoffs: |-
      A stack uses O(n) memory in the worst case (all openers). For a single bracket type a counter is O(1) memory and enough. Recursion is a stack too, and often reads more clearly for nested grammars, but Python's default recursion limit (1000) and frame overhead make an explicit stack safer for deep inputs.
    mistakes:
      - Returning True at the end without checking that the stack is empty.
      - Popping from an empty stack (IndexError) when a closer arrives first.
      - "Swapping operands for `-` and `/`: the first pop is the right operand."
      - Using `//` where the problem asks for truncation toward zero.
      - Reading multi-digit numbers one character at a time without accumulating them.
      - Using `list.pop(0)` thinking it pops the top; that is the bottom, and O(n).
    interview: |-
      Stack problems are often warm-ups; the signal is how cleanly you handle the empty-stack and leftover cases. Say the invariant ("the stack holds unmatched openers"), then test with an input that starts with a closer and one that ends with an opener. Follow-ups: support another bracket type, evaluate with precedence, return the index of the first error.
    explain_it:
      - Say what the stack holds and when items are pushed and popped.
      - State the invariant (the top is the only resolvable item).
      - Cover the empty-stack case on pop and the non-empty stack at the end.
      - O(n) time because each element is pushed and popped at most once; O(n) space worst case.
    example:
      language: python
      code: |-
        def simplify_path(path: str) -> str:
            """Canonical form of a Unix-style absolute path."""
            stack: list[str] = []
            for part in path.split("/"):
                if part == "" or part == ".":
                    continue                    # empty segments and "." change nothing
                if part == "..":
                    if stack:
                        stack.pop()             # go up, but never above the root
                else:
                    stack.append(part)
            return "/" + "/".join(stack)

        assert simplify_path("/a/./b/../../c/") == "/c"
        assert simplify_path("/../") == "/"
        assert simplify_path("/home//user/") == "/home/user"
      explanation: The stack holds the directories of the current path; ".." resolves the most recent one. O(n) time and space.
    complexity: Push, pop and peek are amortised O(1) on a Python list; a full pass is O(n) time with O(n) worst-case space.
    edge_cases:
      - Empty input.
      - A closer before any opener.
      - Only openers.
      - Deep nesting (recursion limit if you solve it recursively).
    misconceptions:
      - "A counter is enough for any bracket problem — only for a single bracket type; \"([)]\" has balanced counts but is invalid."
- key: dsa.stack.check
  type: concept_check
  title: "Concept check: stacks"
  skills: [stack.basic]
  minutes: 8
  difficulty: EASY
  body:
    intro: Trace each snippet with a tiny input.
    questions:
      - id: q1
        kind: single
        prompt: This bracket checker has a bug. Which input does it wrongly accept?
        code:
          language: python
          code: |-
            def balanced(s):
                pairs = {")": "(", "]": "[", "}": "{"}
                stack = []
                for ch in s:
                    if ch in "([{":
                        stack.append(ch)
                    elif not stack or stack.pop() != pairs[ch]:
                        return False
                return True
        options: ["\"(]\"", "\"((\"", "\")(\"", "\"([)]\""]
        answer: [1]
        explanation: "It never checks the leftover stack, so \"((\" returns True. The others are rejected inside the loop: a mismatched pop, a closer on an empty stack, and ) meeting [ on top."
      - id: q2
        kind: single
        prompt: "A postfix evaluator handles `-` with `stack.append(stack.pop() - stack.pop())`. What does it produce for the tokens 2 1 - (correct answer 1)?"
        options: ["1", "-1", "3", "It raises an error"]
        answer: [1]
        explanation: "Python evaluates the left operand first, so the first pop returns 1 (the right operand) and the expression computes 1 - 2 = -1. Pop into named variables: b = pop(), a = pop(), push a - b."
      - id: q3
        kind: single
        prompt: "What are `-7 // 2` and `int(-7 / 2)` in Python?"
        options: ["-4 and -3", "-3 and -3", "-3 and -4", "-4 and -4"]
        answer: [0]
        explanation: "`//` floors toward negative infinity (-4); int() truncates toward zero (-3). Problems that specify truncation need the second form (or sign-aware integer division to avoid float precision on huge values)."
      - id: q4
        kind: multi
        prompt: Which problems are naturally solved with a stack?
        options:
          - "Decode a nested encoding such as 3[a2[c]]"
          - Undo the most recent edit in an editor
          - Shortest path in an unweighted grid
          - Check that HTML-like tags are properly nested
        answer: [0, 1, 3]
        explanation: "Nesting and most-recent-first are stack properties. Shortest path in an unweighted grid needs BFS, which uses a FIFO queue; a stack would give DFS, which does not find shortest paths."
      - id: q5
        kind: single
        prompt: What does `3[a2[c]]` decode to?
        options: ["\"acc\"", "\"accaccacc\"", "\"aaacc\"", "\"acacac\""]
        answer: [1]
        explanation: "Inner first: 2[c] is cc, so a2[c] is acc, and 3[acc] is accaccacc. Decoding outer-first gives the wrong nesting."
      - id: q6
        kind: short
        prompt: Describe the stack-based decoding of strings like `3[a2[c]]`, including multi-digit counts.
        model_answer: "Keep current string and current number. Digits: number = number × 10 + digit. On [, push (current, number) and reset both. Letters: append to current. On ], pop (previous, count) and set current = previous + current × count. At the end current is the answer. Each character is handled once, but output size can be much larger than the input."
        explanation: The frame (string so far, repeat count) is what makes nesting work; forgetting multi-digit counts is the usual bug.
- key: dsa.stack.exercise
  type: coding_exercise
  title: "Exercise: remove adjacent equal pairs until none remain"
  skills: [stack.basic, strings.manipulation]
  minutes: 10
  difficulty: EASY
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 600}
  body:
    prompt: |-
      Repeatedly delete two adjacent equal characters from a lowercase string until no such pair remains, and return the result. The final result is unique regardless of the order of deletions. Do it in one pass.
    examples:
      - "\"abbaca\" -> \"ca\""
      - "\"azxxzy\" -> \"ay\""
      - "\"aa\" -> \"\""
    constraints:
      - Up to 10⁵ characters.
    hints:
      - After deleting a pair, the characters on each side become adjacent. Which one do you need to compare next?
      - The previous surviving character is the top of a stack.
    solution:
      language: python
      code: |-
        def remove_adjacent_pairs(s: str) -> str:
            stack: list[str] = []
            for ch in s:
                if stack and stack[-1] == ch:
                    stack.pop()            # ch cancels the most recent survivor
                else:
                    stack.append(ch)
            return "".join(stack)
      explanation: The stack holds the survivors so far; each character is pushed and popped at most once, O(n) time and space. Re-scanning the string after every deletion is O(n²).
    rubric:
      - {key: correct, label: Returns the right result for the three examples, points: 4}
      - {key: one_pass, label: Uses a stack in one pass instead of repeated scans, points: 3}
      - {key: complexity, label: "States O(n) time and space and the O(n²) cost of the naive approach", points: 3}
    follow_ups:
      - prompt: Now remove groups of k adjacent equal characters.
        look_for: Stack of (char, run count); pop when the count reaches k; O(n).
- key: dsa.stack.guided
  type: guided_problem
  title: "Guided practice: matching brackets"
  skills: [stack.basic]
  minutes: 15
  difficulty: EASY
  problems: [13]
  body:
    guidance:
      - State what the stack holds before writing code.
      - Map each closer to its opener with a small dict.
      - "Handle the three failure modes: closer on an empty stack, mismatched pair, leftover openers."
      - Test with "]", "((" and "([)]".
    hints:
      - An odd length is an instant False, but it is only a shortcut, not the algorithm.
- key: dsa.stack.timed
  type: timed_problem
  title: "Timed practice: evaluation and nested decoding"
  skills: [stack.basic]
  minutes: 45
  difficulty: MEDIUM
  problems: [69, 70]
  body:
    guidance:
      - "Postfix evaluation: pop the right operand first; use truncation toward zero for division; say O(n) time and space."
      - "Nested decoding: push a frame of (string so far, repeat count) on [ and combine on ]; accumulate multi-digit counts."
      - Solve both without hints within the timer, then dry-run one nested example aloud.
- key: dsa.stack.cards
  type: revision_card
  title: "Recall: stacks"
  skills: [stack.basic]
  minutes: 5
  body:
    cards:
      - front: Bracket check — what must be true at the end?
        back: The stack is empty (no unmatched openers).
      - front: Postfix operator — which pop is the right operand?
        back: The first pop.
      - front: "-7 // 2 vs int(-7 / 2)?"
        back: "-4 (floor) vs -3 (truncation toward zero)."
      - front: Python list as a stack — operations and cost?
        back: append, pop(), stack[-1]; amortised O(1).
      - front: Why can a counter not validate "([)]"?
        back: Counts balance, but the order of different bracket types matters.

# ---------------------------------------------------------------------------------------------- queue and deque
- key: dsa.deque.lesson
  type: lesson
  title: Queues, deques and the monotonic queue
  skills: [queue.deque]
  minutes: 25
  difficulty: MEDIUM
  body:
    summary: Use collections.deque for O(1) work at both ends; keep it monotonic to get the maximum or minimum of a sliding window in amortised O(1).
    what: |-
      A **queue** is first-in, first-out (FIFO). A **deque** (double-ended queue) allows O(1) appends and pops at both ends. In Python, `collections.deque` provides `append`, `appendleft`, `pop`, `popleft`, and an optional `maxlen` that turns it into a fixed-size ring buffer.

      A **monotonic queue** is a deque whose values are kept sorted (increasing or decreasing) from front to back by popping dominated elements from the back before each append. Its front is the minimum or maximum of the current window.
    why: |-
      `list.pop(0)` shifts every remaining element, so a list-based queue costs O(n) per dequeue and O(n²) for a BFS over n nodes. A deque is a linked block structure with O(1) operations at both ends. The monotonic queue answers "maximum of each window of size k" in O(n) total instead of O(n × k), because an element that is smaller and older than a newer element can never be the window maximum again.
    when: |-
      - Breadth-first search, level-order traversal, multi-source BFS: FIFO.
      - Rate limiting and "events in the last W seconds": drop expired items from the front.
      - Recent history with a fixed size: `deque(maxlen=k)`.
      - Sliding window maximum or minimum, or optimising a DP whose transition takes a max over a sliding range: monotonic deque.
    how: |-
      **Monotonic deque for window maximum** (store indices so you can tell when the front leaves the window):

      1. Before appending index `i`, pop from the back every index whose value is `<=` `nums[i]` — they are older and not larger, so they are dominated.
      2. Append `i`.
      3. If the front index is `<= i - k`, it has left the window: `popleft`.
      4. Once `i >= k - 1`, the front holds the window maximum.

      **Queue from two stacks:** push onto `inbox`; to dequeue, if `outbox` is empty move everything from `inbox` to `outbox` (reversing the order), then pop from `outbox`. Each element is moved at most once, so every operation is amortised O(1).
    mental_model: |-
      For a window maximum, think of a queue of candidates for "future maximum". A new value walks in from the back and sends home every candidate that is smaller than it, because it is both larger and will stay longer. Invariant: indices in the deque are increasing (in arrival order), their values are decreasing, and all lie in the current window.
    tradeoffs: |-
      A deque gives O(1) at the ends but O(n) indexing in the middle, so it is not a replacement for a list when you need random access. A heap also gives the window maximum but costs O(log n) per step and needs lazy deletion of expired entries; the monotonic deque is O(1) amortised and simpler once learned. `queue.Queue` adds locking for threads and is slower; use it only for producer–consumer code, not for algorithms.
    mistakes:
      - "Using `list.pop(0)` for BFS, which makes it O(n²)."
      - Storing values instead of indices in the monotonic deque, so you cannot tell when the front expires.
      - Checking expiry before appending in a way that leaves an expired front when outputting.
      - "Using `<` instead of `<=` (or vice versa) without thinking about duplicates; both work for maxima if expiry uses indices, but be able to say why."
      - "Forgetting that `deque(maxlen=k)` silently drops from the opposite end when full."
    interview: |-
      Deques appear as the hidden structure inside BFS and as the "can you do better than a heap?" answer for window extremes. Explain the domination argument and the amortised bound: each index is appended once and popped at most once. A common follow-up is the queue-with-two-stacks design and its amortised analysis.
    explain_it:
      - Say why a list is the wrong queue in Python.
      - "State the monotonic deque invariant: increasing indices, decreasing values, all in the window."
      - Explain why a dominated element can be discarded forever.
      - O(n) total time because each index is pushed and popped at most once; O(k) space.
    example:
      language: python
      code: |-
        from collections import deque

        def window_minimums(nums: list[int], k: int) -> list[int]:
            dq: deque[int] = deque()   # indices; values strictly increasing front to back
            out: list[int] = []
            for i, x in enumerate(nums):
                while dq and nums[dq[-1]] >= x:   # older and not smaller: never the minimum again
                    dq.pop()
                dq.append(i)
                if dq[0] <= i - k:                # front has left the window
                    dq.popleft()
                if i >= k - 1:
                    out.append(nums[dq[0]])
            return out

        assert window_minimums([4, 2, 12, 3, 8, 1, 7], 3) == [2, 2, 3, 1, 1]
      explanation: This is the mirror of the window-maximum deque (flip the comparison). O(n) time, O(k) space.
    complexity: deque append, appendleft, pop, popleft are O(1); indexing near the middle is O(n). Monotonic deque over n elements is O(n) total.
    internals: |-
      CPython implements deque as a doubly linked list of fixed-size blocks (64 slots each in current versions), which is why both ends are O(1) and why indexing walks blocks from the nearer end. Unlike `list`, a deque never needs to move existing elements when it grows.
    edge_cases:
      - k equal to 1 (every element is its own window) and k equal to n.
      - Duplicates of the maximum inside one window.
      - Empty input.
    misconceptions:
      - "deque is a thread-safe queue for producers and consumers — its appends and pops are thread-safe, but blocking waits, bounded put/get and task tracking are what queue.Queue provides."
- key: dsa.deque.check
  type: concept_check
  title: "Concept check: queues and deques"
  skills: [queue.deque]
  minutes: 8
  difficulty: MEDIUM
  body:
    intro: Several questions are traces; write the deque contents after each step.
    questions:
      - id: q1
        kind: single
        prompt: What is `list(d)` at the end?
        code:
          language: python
          code: |-
            from collections import deque
            d = deque([1, 2, 3], maxlen=3)
            d.append(4)
            d.appendleft(0)
        options: ["[0, 2, 3]", "[0, 1, 2]", "[2, 3, 4]", "[0, 1, 2, 3, 4]"]
        answer: [0]
        explanation: "append(4) on a full deque drops from the left: [2, 3, 4]. appendleft(0) on a full deque drops from the right: [0, 2, 3]. The tempting [2, 3, 4] forgets the second step."
      - id: q2
        kind: multi
        prompt: Which operations are O(1) on a collections.deque of length n?
        options: ["popleft()", "append(x)", "d[n // 2]", "appendleft(x)"]
        answer: [0, 1, 3]
        explanation: "Both ends are O(1). Indexing walks blocks from the nearer end, so the middle is O(n)."
      - id: q3
        kind: single
        prompt: A window-maximum deque stores indices with decreasing values and pops from the back while the back value is <= the new value. Processing [5, 3, 4] (no expiry yet), what does the deque hold at the end?
        options: ["[0, 2]", "[0, 1, 2]", "[2]", "[1, 2]"]
        answer: [0]
        explanation: "5 enters: [0]. 3 enters behind it: [0, 1]. 4 pops index 1 (3 <= 4) but stops at 5: [0, 2]. 5 stays because it is larger, even though it is older."
      - id: q4
        kind: single
        prompt: A queue built from two stacks moves all of inbox into outbox only when outbox is empty. What is the cost of n enqueues and n dequeues in total?
        options: ["O(n)", "O(n log n)", "O(n²)", "O(1)"]
        answer: [0]
        explanation: "Each element is pushed to inbox once, moved to outbox once and popped once: 3n operations. A single dequeue can cost O(n), which is why the bound is amortised, not worst-case per operation."
      - id: q5
        kind: single
        prompt: Why should BFS in Python use a deque rather than a list with pop(0)?
        options:
          - pop(0) shifts every remaining element, so BFS becomes O(V²) instead of O(V + E)
          - Lists cannot hold node objects
          - deque keeps nodes sorted by distance automatically
          - pop(0) returns the last element
        answer: [0]
        explanation: "Lists are arrays; removing the first element moves the rest. The deque does it in O(1). Nodes come out in distance order because of FIFO, not because the deque sorts anything."
      - id: q6
        kind: short
        prompt: Explain why the monotonic-deque window maximum runs in O(n) even though there is a while loop inside the for loop.
        model_answer: "Every index is appended exactly once and can be removed at most once (either popped from the back when dominated or popped from the front when it expires). So the total number of pops over the whole run is at most n, and the for loop does O(1) other work per index: O(n) total."
        explanation: Amortised counting of pushes and pops is the same argument as for sliding windows and monotonic stacks.
- key: dsa.deque.exercise
  type: coding_exercise
  title: "Exercise: a sliding-window rate limiter with a deque"
  skills: [queue.deque]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 900}
  body:
    prompt: |-
      Implement `RateLimiter(limit, window_seconds)` with `allow(now) -> bool`. An event at time `now` (integer seconds, non-decreasing across calls) is allowed when fewer than `limit` events were **accepted** in the half-open interval `(now - window_seconds, now]`. Accepted events count against the limit; rejected ones do not.
    examples:
      - "limit 2, window 10: allow(1) True, allow(2) True, allow(3) False, allow(11) True, allow(12) True, allow(12) False"
    constraints:
      - Up to 10⁵ calls; each call should be amortised O(1).
    hints:
      - Keep the accepted timestamps in arrival order.
      - Before deciding, drop timestamps that are no longer inside the window from the front.
      - "A timestamp t is expired when t <= now - window_seconds."
    solution:
      language: python
      code: |-
        from collections import deque

        class RateLimiter:
            def __init__(self, limit: int, window_seconds: int) -> None:
                self.limit = limit
                self.window = window_seconds
                self.accepted: deque[int] = deque()   # oldest first

            def allow(self, now: int) -> bool:
                while self.accepted and self.accepted[0] <= now - self.window:
                    self.accepted.popleft()
                if len(self.accepted) < self.limit:
                    self.accepted.append(now)
                    return True
                return False
      explanation: Each timestamp is appended once and popped once, so calls are amortised O(1); memory is O(limit) because at most `limit` accepted events are inside a window.
    rubric:
      - {key: correct, label: Matches the example sequence including the boundary at 11 and the duplicate 12, points: 4}
      - {key: expiry, label: Expires from the front with the correct boundary comparison, points: 2}
      - {key: rejected_not_counted, label: Only accepted events are stored, points: 1}
      - {key: complexity, label: States amortised O(1) per call and O(limit) memory, points: 3}
    follow_ups:
      - prompt: Memory must not depend on the limit (limit can be 10⁶). What approximation would you use?
        look_for: Fixed-window counters or a sliding-window counter that weights the previous window; mention the accuracy trade-off.
      - prompt: Timestamps can arrive slightly out of order. What breaks?
        look_for: Front expiry assumes order; buffer and sort a small delay, or use a structure ordered by time.
