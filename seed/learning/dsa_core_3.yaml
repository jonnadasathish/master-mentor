- key: dsa.deque.timed
  type: timed_problem
  title: "Timed practice: monotonic deques"
  skills: [queue.deque]
  minutes: 70
  difficulty: HARD
  problems: [14, 74]
  body:
    guidance:
      - "Window maximum: indices in the deque, values decreasing; pop dominated from the back, expired from the front; output once the first window is full."
      - "Shortest subarray with sum at least K (negatives allowed): prefix sums plus an increasing deque of prefix indices; pop from the front while the current prefix minus the front prefix reaches K (record), and from the back while the back prefix is >= the current one."
      - State why each structure stays monotonic and why the total work is O(n).
- key: dsa.deque.cards
  type: revision_card
  title: "Recall: queues and deques"
  skills: [queue.deque]
  minutes: 5
  body:
    cards:
      - front: Why not list.pop(0) as a queue?
        back: It shifts every element, O(n) per dequeue.
      - front: Monotonic deque invariant for window maximum?
        back: Increasing indices, decreasing values, all inside the window.
      - front: Why store indices, not values, in the window deque?
        back: To detect when the front has left the window.
      - front: Queue from two stacks — cost?
        back: Amortised O(1); each element moves from inbox to outbox once.
      - front: deque(maxlen=3) is full and you appendleft?
        back: The rightmost element is dropped.

# ---------------------------------------------------------------------------------------------- monotonic stack
- key: dsa.monotonic_stack.lesson
  type: lesson
  title: Monotonic stacks for next greater and next smaller
  skills: [stack.monotonic]
  minutes: 25
  difficulty: MEDIUM
  body:
    summary: Keep a stack of indices still waiting for an answer, in sorted value order; each new element resolves every waiting element it beats, so all next-greater answers come out in one O(n) pass.
    what: |-
      A monotonic stack is a stack whose values are kept in sorted order from bottom to top. Before pushing a new element you pop every element that would break the order. Each pop is a moment of discovery: the element being pushed is the **next greater** (or next smaller) element of the one being popped.

      - Next greater to the right: keep values **decreasing**; pop while the top is smaller than the new value.
      - Next smaller to the right: keep values **increasing**; pop while the top is larger.
      - Previous greater or smaller: after popping, the element left on top is the answer for the new element.
    why: |-
      The brute force scans right from every index until it finds a larger value: O(n²) on a decreasing input. In the stack version every index is pushed once and popped at most once, so the whole pass is O(n). The same structure answers "how far can this bar extend" (largest rectangle in a histogram), "how many days until warmer", and the contribution of each element to subarray minima or maxima.
    when: |-
      - "For each element, find the nearest element to the left or right that is greater or smaller."
      - "Spans: how many consecutive previous elements are smaller or equal."
      - "Areas or widths bounded by the nearest smaller bar on each side."
      - "Build the smallest or largest number by deleting digits (greedy with an increasing stack)."
    how: |-
      Next greater element to the right:

      ```python
      answer = [-1] * len(nums)
      stack: list[int] = []                 # indices waiting for a greater value; values decreasing
      for i, x in enumerate(nums):
          while stack and nums[stack[-1]] < x:
              answer[stack.pop()] = x       # x is the first greater value to the right
          stack.append(i)
      # indices left on the stack have no greater value to the right
      ```

      Variants:

      - **Distance instead of value:** store `i - popped_index`.
      - **Circular array:** loop `i` over `range(2 * n)` and use `nums[i % n]`, pushing only during the first pass.
      - **Duplicates:** decide strict (`<`) or non-strict (`<=`) popping on purpose. In "sum of subarray minimums" style counting, use strict on one side and non-strict on the other so equal values are counted once.
      - **Histogram:** with an increasing stack, when bar `j` is popped by bar `i`, its right boundary is `i` and its left boundary is the new top, so its maximal width is `i - top - 1`.
    mental_model: |-
      The stack is a waiting room of unanswered indices. Because a waiting element was not popped by anything after it, everything after it is smaller (for a next-greater stack), so the waiting room is sorted. A new arrival answers everyone in the room it beats, starting from the most recent. Invariant: values on the stack are monotonic, and every index on the stack has not yet seen its answer.
    tradeoffs: |-
      O(n) time and O(n) worst-case stack space (a strictly decreasing input never pops). The brute force uses O(1) space and is fine for tiny inputs. For window-limited queries ("greatest in the last k") a monotonic deque is needed, because elements must also expire from the old end.
    mistakes:
      - Storing values when you need distances or positions; store indices.
      - Choosing the wrong monotonic direction (an increasing stack finds next smaller, not next greater).
      - Mishandling duplicates (strict vs non-strict comparison) and double-counting equal values.
      - Forgetting the elements still on the stack at the end; they need a default answer (-1, 0, or n as a boundary).
      - In histogram problems, forgetting a final sentinel bar of height 0 to flush the stack.
    interview: |-
      The tell is "next", "previous", "nearest greater/smaller", "span" or "days until". State the brute force, then: "a smaller element that is still waiting will be answered by the first larger element after it; I keep waiting indices on a stack, decreasing, so each is pushed and popped once". Expect follow-ups on duplicates, circular arrays and the histogram area.
    explain_it:
      - Say what the stack holds (indices still waiting) and its order.
      - Say when an index is popped and why that moment gives its answer.
      - Say what remains on the stack at the end and what answer it gets.
      - Prove O(n) with one push and at most one pop per index.
    example:
      language: python
      code: |-
        class StockSpanner:
            """span(price) = number of consecutive days up to today with price <= today's."""

            def __init__(self) -> None:
                self.stack: list[tuple[int, int]] = []   # (price, span); prices strictly decreasing

            def next(self, price: int) -> int:
                span = 1
                while self.stack and self.stack[-1][0] <= price:
                    span += self.stack.pop()[1]          # absorb the days that price dominates
                self.stack.append((price, span))
                return span

        s = StockSpanner()
        assert [s.next(p) for p in [100, 80, 60, 70, 60, 75, 85]] == [1, 1, 1, 2, 1, 4, 6]
      explanation: A previous-greater stack that stores each element's span, so a popped element hands over all the days it had already absorbed. Amortised O(1) per call, O(n) space.
    complexity: O(n) time for n elements (each index pushed once, popped at most once); O(n) worst-case space.
    edge_cases:
      - Strictly increasing input (every element pops the previous one).
      - Strictly decreasing input (nothing pops; the stack holds everything).
      - All values equal (the duplicate rule decides the answer).
      - Circular arrays.
    misconceptions:
      - "Nested while inside for means O(n²) — the pops are bounded by the pushes, n in total."
- key: dsa.monotonic_stack.check
  type: concept_check
  title: "Concept check: monotonic stacks"
  skills: [stack.monotonic]
  minutes: 8
  difficulty: MEDIUM
  body:
    intro: Trace the stack contents step by step.
    questions:
      - id: q1
        kind: single
        prompt: What does this return for `[2, 1, 2, 4, 3]`?
        code:
          language: python
          code: |-
            def f(nums):
                answer = [-1] * len(nums)
                stack = []
                for i, x in enumerate(nums):
                    while stack and nums[stack[-1]] < x:
                        answer[stack.pop()] = x
                    stack.append(i)
                return answer
        options: ["[4, 2, 4, -1, -1]", "[2, 2, 4, -1, -1]", "[4, 2, 4, -1, 3]", "[1, 2, 4, 3, -1]"]
        answer: [0]
        explanation: "Next strictly greater to the right. The first 2 is not popped by the second 2 (2 < 2 is false), so its answer is 4. The 1 is popped by the second 2. The 4 and the 3 never find a greater value. The second option would come from popping with <=."
      - id: q2
        kind: single
        prompt: To find the next **greater** element, the stack values (bottom to top) are kept…
        options: ["Decreasing", "Increasing", "Unordered", "Equal"]
        answer: [0]
        explanation: "Any waiting element is larger than or equal to everything pushed after it, otherwise it would have been popped. So values decrease toward the top. An increasing stack is the next-smaller variant."
      - id: q3
        kind: single
        prompt: For "previous smaller element" of each index, which loop is right before pushing i?
        options:
          - "Pop while nums[top] >= nums[i]; then the top (if any) is the previous smaller"
          - "Pop while nums[top] < nums[i]; then the top is the previous smaller"
          - Do not pop; the top is always the previous smaller
          - Pop everything, then push
        answer: [0]
        explanation: "Elements >= nums[i] can never be the previous smaller element of any later index, because nums[i] is closer and not larger, so they go. What remains on top is the nearest strictly smaller value. Popping the smaller ones throws away exactly the answers you need."
      - id: q4
        kind: single
        prompt: How do you find next greater elements in a circular array of length n?
        options:
          - Iterate i over range(2 * n) using nums[i % n], pushing indices only in the first pass
          - Sort the array first
          - Run the linear algorithm twice on separate copies and take the max
          - Append a sentinel of infinity at the end
        answer: [0]
        explanation: "The second pass lets elements near the end find answers that wrap around to the beginning, while pushing only in the first pass keeps each index on the stack once. Sorting destroys positions."
      - id: q5
        kind: multi
        prompt: Which problems are a natural fit for a monotonic stack?
        options:
          - Days until a warmer temperature
          - Largest rectangle in a histogram
          - The k-th largest element in a stream
          - Remove k digits to make the smallest possible number
        answer: [0, 1, 3]
        explanation: "Warmer days is next-greater distance; the histogram needs the nearest smaller bar on both sides; removing digits greedily keeps an increasing stack. The k-th largest in a stream is a size-k min-heap problem."
      - id: q6
        kind: short
        prompt: In the largest-rectangle-in-a-histogram algorithm with an increasing stack of indices, when bar j is popped while processing index i, what is the width of the largest rectangle of height heights[j], and why?
        model_answer: "Width = i - left - 1, where left is the index on top of the stack after popping j (or -1 if the stack is empty). i is the first bar to the right that is lower than heights[j] (that is why j is popped now), and left is the nearest bar to the left that is lower (the stack is increasing), so the rectangle spans exactly the bars strictly between them."
        explanation: Both boundaries come from the stack at the moment of the pop; a final bar of height 0 flushes the remaining indices.
- key: dsa.monotonic_stack.exercise
  type: coding_exercise
  title: "Exercise: next greater element in a circular array"
  skills: [stack.monotonic]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 900}
  body:
    prompt: |-
      The array is circular: after the last element comes the first. For each element return the first strictly greater value found by walking forward (wrapping around), or -1 if there is none.
    examples:
      - "[1, 2, 1] -> [2, -1, 2]"
      - "[5, 4, 3, 2, 1] -> [-1, 5, 5, 5, 5]"
      - "[3, 3] -> [-1, -1]"
    constraints:
      - Up to 10⁴ elements; values may be negative. O(n) time.
    hints:
      - Start from the non-circular next-greater template.
      - Walk the indices twice using i % n.
      - Push each index only during the first pass.
    solution:
      language: python
      code: |-
        def next_greater_circular(nums: list[int]) -> list[int]:
            n = len(nums)
            answer = [-1] * n
            stack: list[int] = []            # indices waiting; values non-increasing
            for i in range(2 * n):
                x = nums[i % n]
                while stack and nums[stack[-1]] < x:
                    answer[stack.pop()] = x
                if i < n:
                    stack.append(i)
            return answer
      explanation: Every index is pushed once and popped at most once across both passes, so O(n) time and O(n) space. The maximum element stays on the stack and keeps -1.
    rubric:
      - {key: correct, label: Returns the right answers for all three examples, points: 4}
      - {key: circular, label: Handles wrap-around with two passes and pushes only in the first, points: 2}
      - {key: strict, label: Uses a strict comparison so equal values are not answers, points: 1}
      - {key: complexity, label: Explains O(n) by counting pushes and pops, points: 3}
    follow_ups:
      - prompt: Return the distance (number of steps forward) instead of the value.
        look_for: Store (i - popped) with i the unwrapped index in the second pass; same complexity.
