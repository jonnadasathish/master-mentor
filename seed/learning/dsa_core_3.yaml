# ---------------------------------------------------------------------------------------------- fast and slow pointers
- key: dsa.fast_slow.lesson
  type: lesson
  title: Fast and slow pointers for middles and cycles
  skills: [linked_list.fast_slow]
  minutes: 20
  difficulty: MEDIUM
  body:
    summary: One pointer moves two steps for every one step of the other; the speed difference finds the middle in one pass and detects cycles with O(1) memory.
    what: |-
      The fast/slow (tortoise and hare) technique runs two references through a sequence at different speeds, usually one and two steps per iteration.

      - **Middle:** when fast reaches the end, slow is halfway.
      - **Cycle detection (Floyd):** if there is a cycle, fast eventually laps slow and they meet; if not, fast reaches `None`.
      - **Cycle start:** after they meet, move one pointer back to the head and advance both one step at a time; they meet at the first node of the cycle.
      - **Gap pointers:** a fixed head start of n nodes finds the n-th node from the end in one pass.
    why: |-
      A visited set detects cycles in O(n) memory. Floyd's algorithm does it in O(1) memory and O(n) time, which matters when the "list" is implicit — for example the sequence `i -> nums[i]` in an array, where finding a duplicate value is the same as finding a cycle entrance.
    when: |-
      - Find the middle of a linked list in one pass (to split it, or to compare halves).
      - Detect a cycle, find where it starts, or its length.
      - A function `f` maps a finite set into itself and you need a repeated value (the sequence x, f(x), f(f(x)) must cycle).
      - Find the k-th node from the end in one pass (gap of k).
    how: |-
      **Middle:**

      ```python
      slow = fast = head
      while fast and fast.next:
          slow = slow.next
          fast = fast.next.next
      # odd length: the middle; even length: the second of the two middles
      ```

      Use `while fast.next and fast.next.next` (with a non-empty list) to stop at the **first** middle instead.

      **Cycle start (Floyd):** let `a` be the distance from the head to the cycle start, `b` from the start to the meeting point, and `c` the cycle length. When they meet, slow walked `a + b` and fast `2(a + b)`, and the difference is a whole number of laps: `a + b = k × c`. So `a = k × c - b`: walking `a` steps from the meeting point lands exactly on the start. Reset one pointer to the head and step both by one until they meet.
    mental_model: |-
      Inside a cycle, measure the gap from slow forward to fast. Every iteration fast gains one node on slow, so the gap shrinks by exactly one and cannot jump over zero: they must meet within one lap. Outside a cycle, fast simply runs off the end.
    tradeoffs: |-
      Floyd uses O(1) memory but is harder to explain than a visited set, which is O(n) memory and also gives the cycle start immediately (the first repeated node). On an interview, mention the set as the brute force, then give Floyd with the proof. Finding the middle with fast/slow is one pass; counting the length first and walking again is two passes with the same O(n) complexity, and equally acceptable unless one pass is required.
    mistakes:
      - "Checking `fast.next.next` without first checking `fast.next`, which raises AttributeError on None."
      - Comparing values instead of node identity when checking whether the pointers met.
      - Starting fast one step ahead and then using the head-reset trick, which breaks the distance argument.
      - Returning the wrong middle for even lengths (decide which one the problem needs).
      - Forgetting to restore a list you reversed in place when the caller still needs it.
    interview: |-
      Expect "detect a cycle", then "where does it start?", then "prove it". Give the a + b = k × c argument briefly. A common transfer question is finding a duplicate in an array of n + 1 values in 1..n without modifying it and with O(1) space: treat index -> value as next pointers.
    explain_it:
      - Explain why fast catches slow (gap shrinks by one per step).
      - "Give the distance argument for the cycle start: a = k × c - b."
      - Say which middle your loop condition returns for even lengths.
      - O(n) time and O(1) space.
    example:
      language: python
      code: |-
        def is_palindrome(head) -> bool:
            slow = fast = head
            while fast and fast.next:          # slow ends at the middle (second middle if even)
                slow = slow.next
                fast = fast.next.next
            prev = None                        # reverse the second half in place
            while slow:
                nxt = slow.next
                slow.next = prev
                prev, slow = slow, nxt
            left, right = head, prev
            while right:                       # the reversed half is never longer
                if left.val != right.val:
                    return False
                left, right = left.next, right.next
            return True
      explanation: Fast/slow finds the middle, reversal makes the second half walkable backwards, and one comparison pass finishes. O(n) time and O(1) extra space; the input is modified, so reverse the second half again if the caller needs it intact.
    complexity: O(n) time and O(1) space for middle, cycle detection and cycle start. A visited set is O(n) time and O(n) space.
    edge_cases:
      - Empty list and a single node.
      - A cycle that includes the head (a = 0).
      - A self-loop (cycle of length 1).
      - Even versus odd length for the middle.
    misconceptions:
      - "Fast could jump over slow inside the cycle — the gap shrinks by exactly one per step, so it hits zero."
- key: dsa.fast_slow.check
  type: concept_check
  title: "Concept check: fast and slow pointers"
  skills: [linked_list.fast_slow]
  minutes: 8
  difficulty: MEDIUM
  body:
    intro: Trace node by node; write slow and fast positions after each iteration.
    questions:
      - id: q1
        kind: single
        prompt: "For 1 -> 2 -> 3 -> 4, where does slow end with `while fast and fast.next:` (both start at the head, steps of one and two)?"
        options: ["Node 2", "Node 3", "Node 4", "None"]
        answer: [1]
        explanation: "Iteration 1: slow 2, fast 3. Iteration 2: slow 3, fast None (4.next). The loop stops with slow on node 3, the second middle. Node 2 is what the `fast.next and fast.next.next` variant returns."
      - id: q2
        kind: single
        prompt: Why are slow and fast guaranteed to meet if the list has a cycle?
        options:
          - Once both are in the cycle, the gap from slow to fast shrinks by one each step, so it reaches zero
          - Fast moves randomly and eventually hits slow
          - Because the cycle length is always even
          - They are not guaranteed to meet; you need a visited set
        answer: [0]
        explanation: "Fast gains exactly one node per iteration, so the gap goes c-1, c-2, …, 0 without skipping. That is also why the speeds 1 and 2 are used; other speed pairs need more care."
      - id: q3
        kind: single
        prompt: After slow and fast meet inside a cycle, how do you find the first node of the cycle?
        options:
          - Move one pointer to the head, then advance both one step at a time until they meet
          - Keep advancing fast by two until it reaches the head
          - The meeting node is always the start
          - Count the cycle length and divide by two
        answer: [0]
        explanation: "From a + b = k × c, the head is a steps from the start and so is the meeting point (going forward around the cycle). The meeting node is generally not the start unless b = 0."
      - id: q4
        kind: multi
        prompt: Which problems can fast/slow pointers solve in O(1) extra space?
        options:
          - Detect whether a linked list has a cycle
          - Find the middle node in one pass
          - Find the duplicate in an array of n + 1 values from 1..n without modifying it
          - Merge two sorted linked lists
        answer: [0, 1, 2]
        explanation: "The duplicate problem treats i -> nums[i] as a linked list whose cycle entrance is the duplicate. Merging is a plain two-list pointer walk, not a speed-difference technique."
      - id: q5
        kind: single
        prompt: Compared with a visited set, Floyd's cycle detection is…
        options:
          - O(n) time and O(1) space, versus O(n) time and O(n) space
          - Faster asymptotically, O(log n) versus O(n)
          - O(n²) time but O(1) space
          - Only correct for cycles of even length
        answer: [0]
        explanation: "Both are linear in time; the gain is memory. Slow meets fast before finishing its first lap of the cycle, so fast takes at most about 2n steps."
      - id: q6
        kind: short
        prompt: Prove that resetting one pointer to the head finds the cycle start.
        model_answer: "Let a = head to cycle start, b = start to meeting point, c = cycle length. At the meeting, slow has walked a + b and fast 2(a + b); fast is ahead by whole laps, so a + b = k × c for some k >= 1. Hence a = k × c - b. A pointer at the meeting point that walks a steps covers (c - b) to reach the start plus (k - 1) full laps, so it is at the start exactly when the pointer from the head arrives there."
        explanation: The algebra is short; saying it cleanly is what turns a memorised trick into a defended answer.
- key: dsa.fast_slow.exercise
  type: coding_exercise
  title: "Exercise: remove the n-th node from the end in one pass"
  skills: [linked_list.fast_slow, linked_list.manipulation]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 900}
  body:
    prompt: |-
      Remove the n-th node from the end of a singly linked list (n = 1 is the last node) in a single pass and return the head. Assume 1 <= n <= length.
    examples:
      - "1 -> 2 -> 3 -> 4 -> 5, n = 2  ->  1 -> 2 -> 3 -> 5"
      - "1, n = 1  ->  empty list"
      - "1 -> 2, n = 2  ->  2"
    constraints:
      - Up to 30 nodes; one pass, O(1) extra space.
    hints:
      - To delete a node you need the node before it.
      - Give one pointer a head start so that when it reaches the end, the other is just before the target.
      - Start both at a dummy node and give fast a head start of n + 1 steps.
    solution:
      language: python
      code: |-
        def remove_nth_from_end(head, n):
            dummy = ListNode(0, head)
            fast = slow = dummy
            for _ in range(n + 1):        # gap of n + 1 nodes
                fast = fast.next
            while fast:
                fast = fast.next
                slow = slow.next
            slow.next = slow.next.next    # slow is just before the target
            return dummy.next
      explanation: When fast is None, slow is n + 1 nodes behind the end, i.e. right before the n-th from the end. The dummy handles deleting the head (second and third examples). O(L) time, O(1) space.
    rubric:
      - {key: correct, label: Handles all three examples including removing the head, points: 4}
      - {key: gap, label: Explains why the gap is n + 1 when starting from a dummy, points: 2}
      - {key: dummy, label: Uses a dummy (or equivalent) instead of a head special case, points: 2}
      - {key: complexity, label: "States one pass, O(L) time and O(1) space", points: 2}
    follow_ups:
      - prompt: How would you find the middle and the n-th from the end at the same time?
        look_for: Separate pointer pairs (speed 1/2 and gap n) in one loop; or explain that two passes are equally O(L).
