# ---------------------------------------------------------------------------------------------- linked lists
- key: dsa.linked_list.lesson
  type: lesson
  title: Linked list pointer surgery with a dummy head
  skills: [linked_list.manipulation]
  minutes: 25
  difficulty: MEDIUM
  body:
    summary: Linked list problems are about rewiring next pointers in the right order; save the next node before you overwrite a pointer, and use a dummy head so the first node is not a special case.
    what: |-
      A singly linked list is a chain of nodes, each with a value and a `next` reference; the last node points to `None`. There is no indexing: reaching the k-th node costs O(k). In exchange, inserting or removing a node **after a node you already hold** is O(1), with no shifting.

      ```python
      class ListNode:
          def __init__(self, val=0, next=None):
              self.val = val
              self.next = next
      ```

      Core operations: reverse (whole list or a sublist), merge two sorted lists, remove nodes, split and reconnect, and find intersections.
    why: |-
      Linked lists test whether you can change a data structure without losing parts of it. A single pointer overwritten too early drops the rest of the list (in Python it is then garbage-collected); a missing `tail.next = None` creates a cycle. These are the same skills used in LRU caches (hash map plus doubly linked list), allocators and kernel lists.
    when: |-
      - The input is a linked list (you cannot index into it).
      - You need O(1) splicing given a node reference (LRU cache, ordered dict internals).
      - You merge or split sequences without copying.
    how: |-
      **Dummy head:** `dummy = ListNode(0, head)`; build or modify after `dummy`, return `dummy.next`. Removing or inserting at the front then needs no special case.

      **Iterative reversal** with three references:

      ```python
      prev, curr = None, head
      while curr:
          nxt = curr.next      # 1. save the rest
          curr.next = prev     # 2. reverse one pointer
          prev = curr          # 3. advance prev
          curr = nxt           # 4. advance curr
      return prev              # new head
      ```

      **Merge two sorted lists:** a dummy and a `tail`; attach the smaller head, advance, and finally attach the leftover list.

      **Intersection of two lists:** walk `a` and `b`; when one reaches the end, restart it at the other list's head. After at most m + n steps they meet at the intersection or both reach `None` together.
    mental_model: |-
      During reversal the list is cut in two: `prev` is the head of the already reversed part and `curr` is the head of the untouched rest. Each step moves one node from the rest to the front of the reversed part. Invariant: no node is reachable from neither `prev` nor `curr` (or `nxt`). Draw boxes and arrows for a three-node list before coding any rewiring.
    tradeoffs: |-
      Iterative solutions use O(1) extra space; recursive ones (reverse, merge) are shorter but use O(n) stack and hit Python's recursion limit (1000 by default) on long lists. Converting to a Python list, operating, and rebuilding is O(n) space and usually not what the interviewer wants, though it is a valid brute force to mention.
    mistakes:
      - Overwriting `curr.next` before saving it, which loses the rest of the list.
      - Returning `head` instead of the new head (`prev` or `dummy.next`).
      - Forgetting to terminate the new tail (`tail.next = None`), creating a cycle.
      - Dereferencing `node.next.next` without checking `node.next`.
      - Special-casing the head instead of using a dummy node.
      - Comparing nodes with `==` when identity (`is`) is what matters for intersections.
    interview: |-
      Narrate the pointer order: "save next, reverse, advance prev, advance curr". Dry-run on a list of length 0, 1 and 2. Interviewers often ask for both iterative and recursive versions and their space costs, or extend reversal to sublists and k-groups.
    explain_it:
      - Name each pointer's role (prev, curr, nxt, dummy, tail).
      - "State the invariant: what prev and curr are the heads of."
      - Show the order of the four assignments and why it cannot change.
      - O(n) time, O(1) extra space iteratively; O(n) stack recursively.
    example:
      language: python
      code: |-
        def reverse_between(head, left, right):
            """Reverse the nodes at 1-based positions left..right."""
            dummy = ListNode(0, head)
            before = dummy
            for _ in range(left - 1):              # node just before the sublist
                before = before.next
            prev, curr = None, before.next
            for _ in range(right - left + 1):      # plain reversal of the sublist
                nxt = curr.next
                curr.next = prev
                prev, curr = curr, nxt
            sub_tail = before.next                 # old sublist head is the new sublist tail
            sub_tail.next = curr                   # reconnect to the rest
            before.next = prev                     # prev is the new sublist head
            return dummy.next

        # 1 -> 2 -> 3 -> 4 -> 5 with left = 2, right = 4 becomes 1 -> 4 -> 3 -> 2 -> 5
      explanation: The dummy makes left = 1 work without a special case. Two reconnections close the gaps on both sides. O(n) time, O(1) extra space.
    complexity: Traversal, reversal and merging are O(n) (or O(m + n)) time and O(1) extra space iteratively. Access by position is O(k).
    edge_cases:
      - Empty list and single node.
      - Operation at the head (left = 1) or the tail.
      - Lists of different lengths when merging.
      - Two lists that do not intersect.
    misconceptions:
      - "Recursion is free for list problems — it uses O(n) stack and Python's default recursion limit is 1000 frames."
- key: dsa.linked_list.check
  type: concept_check
  title: "Concept check: linked list manipulation"
  skills: [linked_list.manipulation]
  minutes: 8
  difficulty: MEDIUM
  body:
    intro: Draw boxes and arrows for every trace.
    questions:
      - id: q1
        kind: single
        prompt: This reversal forgets to save the next node. What does it return for 1 -> 2 -> 3?
        code:
          language: python
          code: |-
            def reverse(head):
                prev, curr = None, head
                while curr:
                    curr.next = prev
                    prev = curr
                    curr = curr.next
                return prev
        options: ["3 -> 2 -> 1", "1 (a single node)", "It loops forever", "None"]
        answer: [1]
        explanation: "After curr.next = prev (None) and prev = curr, curr.next is now None, so the loop ends after one step and returns node 1 alone. Nodes 2 and 3 are lost. That is why nxt is saved first."
      - id: q2
        kind: single
        prompt: Why use a dummy node in front of the head?
        options:
          - So that inserting or removing at the front uses the same code as anywhere else
          - Because Python requires a sentinel for linked lists
          - It makes traversal O(1)
          - It prevents cycles automatically
        answer: [0]
        explanation: "With a dummy, every real node has a predecessor, so 'remove the node after prev' covers the head too. It costs one extra node; it does not change complexity or prevent cycles."
      - id: q3
        kind: single
        prompt: Iterative merge of two sorted lists of lengths m and n uses how much extra space, and the recursive version?
        options:
          - "O(1) iterative, O(m + n) recursive (call stack)"
          - "O(m + n) for both"
          - "O(1) for both"
          - "O(log(m + n)) recursive"
        answer: [0]
        explanation: "Iteration only rewires existing nodes. Recursion adds one frame per attached node, which can reach m + n frames and exceed Python's default recursion limit on long lists."
      - id: q4
        kind: multi
        prompt: Given a reference to a node in a singly linked list, which operations are O(1)?
        options:
          - Insert a new node after it
          - Remove the node after it
          - Find the k-th node from the head
          - Find the node before it
        answer: [0, 1]
        explanation: "Inserting or removing after a node only rewires its next pointer. Reaching the k-th node or the predecessor requires walking from the head, O(n)."
      - id: q5
        kind: single
        prompt: Two pointers walk lists A (length m) and B (length n), each switching to the other list's head at its end. If the lists do not intersect, what happens?
        options:
          - Both become None after m + n steps, and the loop ends
          - They loop forever
          - They meet at the last node
          - The method requires equal lengths
        answer: [0]
        explanation: "Each pointer walks m + n nodes in total, so they reach the end of their second list at the same step; None == None ends the loop. With an intersection they meet there, because both have walked the same distance."
      - id: q6
        kind: short
        prompt: State the invariant of iterative list reversal and the order of the four assignments.
        model_answer: "prev is the head of the reversed part and curr the head of the remaining original part; together they cover every node. Order: nxt = curr.next; curr.next = prev; prev = curr; curr = nxt. Saving nxt must come before overwriting curr.next, and prev must advance before curr."
        explanation: Interviewers listen for the invariant; it is what lets you adapt the loop to sublists and k-groups.
- key: dsa.linked_list.exercise
  type: coding_exercise
  title: "Exercise: partition a linked list around a value"
  skills: [linked_list.manipulation]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 900}
  body:
    prompt: |-
      Rearrange a singly linked list so that all nodes with values less than `x` come before all nodes with values greater than or equal to `x`, keeping the original relative order inside each part. Reuse the existing nodes; O(1) extra space.
    examples:
      - "1 -> 4 -> 3 -> 2 -> 5 -> 2, x = 3  ->  1 -> 2 -> 2 -> 4 -> 3 -> 5"
      - "2 -> 1, x = 2  ->  1 -> 2"
      - "empty list -> empty list"
    constraints:
      - Up to 200 nodes; values and x may be negative.
    hints:
      - Build two lists, each with its own dummy head and tail.
      - Append each node to one of them as you walk.
      - Terminate the second list and join the first list's tail to the second list's first real node.
    solution:
      language: python
      code: |-
        def partition(head, x):
            less_dummy, more_dummy = ListNode(), ListNode()
            less, more = less_dummy, more_dummy
            node = head
            while node:
                if node.val < x:
                    less.next = node
                    less = node
                else:
                    more.next = node
                    more = node
                node = node.next
            more.next = None                  # the old next could point back into the list
            less.next = more_dummy.next
            return less_dummy.next
      explanation: Two dummies remove all head special cases. Without more.next = None, the last node of the second list may still point at a node now in the first list, creating a cycle. O(n) time, O(1) extra space.
    rubric:
      - {key: correct, label: Produces the right order for all three examples, points: 4}
      - {key: stable, label: Keeps the relative order inside both parts, points: 2}
      - {key: terminate, label: Terminates the second list to avoid a cycle and explains why, points: 2}
      - {key: complexity, label: States O(n) time and O(1) extra space, points: 2}
    follow_ups:
      - prompt: What if relative order does not matter? Can you do it in one list without dummies?
        look_for: Yes, e.g. move small nodes to the front, but a dummy-based version is still simpler and less error-prone.
