# ---------------------------------------------------------------------------------------------- minimum spanning tree
- key: dsa.mst.lesson
  type: lesson
  title: Minimum spanning trees with Kruskal and Prim
  skills: [graph.mst, graph.union_find]
  minutes: 20
  difficulty: MEDIUM
  body:
    summary: Connect every node of a weighted undirected graph with the cheapest possible set of edges, by adding cheapest safe edges (Kruskal) or growing one tree (Prim).
    what: |-
      A **spanning tree** of a connected undirected graph is a subset of V - 1 edges that connects all V vertices with no cycle. A **minimum spanning tree** (MST) has the smallest total weight. If the graph is disconnected, the best you can get is a minimum spanning **forest**.

      - **Kruskal**: sort all edges by weight; walk through them and add an edge whenever it joins two different components (checked with union-find). Stop after V - 1 edges.
      - **Prim**: start from any vertex; repeatedly add the cheapest edge that connects the tree to a vertex not yet in it (a min-heap of candidate edges).

      Both rely on the **cut property**: for any split of the vertices into two sides, the cheapest edge crossing the split belongs to some MST.
    why: |-
      Laying cable, pipes or roads to connect every site at minimum total cost is the textbook use. In interviews it shows up as "minimum cost to connect all points", "connect villages with wells or pipes", and as a component of clustering (removing the k - 1 heaviest MST edges gives k clusters). It is also the clearest example of a greedy algorithm with a rigorous proof.
    when: |-
      - Undirected, weighted, "connect everything at minimum total cost": MST.
      - Edge list given, sparse graph: Kruskal with union-find.
      - Complete or dense graph (all pairs of points): Prim, ideally the O(V²) array version.
      - "Build a well at a node for a price, or pipe from a neighbour": add a virtual node connected to every node with the well price as weight, then run MST.

      Not for: shortest paths between two nodes (the MST path between two nodes can be much longer than the shortest path), or directed graphs (the directed version, minimum arborescence, needs a different algorithm).
    how: |-
      ```python
      def kruskal(n: int, edges: list[tuple[int, int, int]]) -> int | None:
          """edges are (weight, u, v). Returns the MST weight, or None if the graph is disconnected."""
          parent = list(range(n))

          def find(x):
              while parent[x] != x:
                  parent[x] = parent[parent[x]]       # path halving
                  x = parent[x]
              return x

          total = used = 0
          for w, u, v in sorted(edges):
              ru, rv = find(u), find(v)
              if ru != rv:                           # safe edge: joins two components
                  parent[ru] = rv
                  total += w
                  used += 1
                  if used == n - 1:
                      break
          return total if used == n - 1 else None
      ```

      Prim with a heap (lazy version):

      ```python
      import heapq

      def prim(n, adj):                              # adj[u] = list of (w, v), undirected
          in_tree = [False] * n
          heap = [(0, 0)]                            # (edge weight into the tree, vertex)
          total = count = 0
          while heap and count < n:
              w, u = heapq.heappop(heap)
              if in_tree[u]:
                  continue                           # stale: u was already added more cheaply
              in_tree[u] = True
              total += w
              count += 1
              for wv, v in adj[u]:
                  if not in_tree[v]:
                      heapq.heappush(heap, (wv, v))  # key is the edge weight, not a path length
          return total if count == n else None
      ```
    mental_model: |-
      Kruskal: buy the cheapest cable in the catalogue that connects two currently separate islands, and repeat; never buy a cable whose ends are already connected. Prim: grow one city outward, always paving the cheapest road from the city to a new town. Both are safe because of the cut property: the cheapest bridge across any divide is never a mistake.
    tradeoffs: |-
      Kruskal costs O(E log E) for the sort plus near-linear union-find work; it is simple and great for sparse edge lists. Prim with a binary heap is O(E log V). On a complete graph of n points, E is about n²/2, so both heap-based versions are O(n² log n), while array-based Prim (scan all vertices for the cheapest key each step) is O(n²) with O(n) extra memory and no edge list at all, which is the best choice for "connect all points". MSTs are unique when all weights are distinct; with ties several MSTs can exist, all with the same total.
    mistakes:
      - "Using Dijkstra's key `dist[u] + w` in Prim; that builds a shortest-path tree, not an MST."
      - Not checking that V - 1 edges were used, so a disconnected graph returns a wrong total.
      - Materialising all n² edges for a points problem and running out of memory or time; use array Prim.
      - Treating a directed graph as undirected.
      - Assuming the MST contains the shortest path between two given nodes.
    interview: |-
      Name the algorithm and justify it with the cut property in one sentence. Expect "Prim or Kruskal, and why?" (density), "what if the graph is disconnected?" (forest; return None or -1), the virtual-node trick for wells or for per-node costs, and the critical-edge follow-up: an edge is critical if removing it increases the MST weight, which you can test by re-running Kruskal without it.
    explain_it:
      - Define spanning tree and MST, and state that it has V - 1 edges.
      - State the cut property.
      - Describe Kruskal or Prim and why each chosen edge is safe.
      - "Complexity: Kruskal O(E log E), heap Prim O(E log V), array Prim O(V²)."
    complexity: Kruskal O(E log E) time and O(V) extra space for union-find (plus the edge list); Prim O(E log V) with a heap or O(V²) with an array.
    internals: |-
      Cut property proof sketch: let e be the cheapest edge crossing some cut, and T an MST that does not contain e. Adding e to T creates a cycle that must cross the cut a second time through some edge f with weight at least w(e). Removing f gives a spanning tree no heavier than T, so a minimum spanning tree containing e exists. Kruskal's chosen edge is the cheapest crossing the cut around one of its endpoint's components; Prim's is the cheapest crossing the cut around the current tree. This is an exchange argument, the standard proof style for greedy algorithms.
    edge_cases:
      - Single vertex (MST weight 0, no edges).
      - Disconnected graph.
      - Equal weights (several valid MSTs).
      - Self-loops (never part of an MST) and parallel edges (keep only the cheapest).
- key: dsa.mst.check
  type: concept_check
  title: "Concept check: minimum spanning trees"
  skills: [graph.mst]
  minutes: 9
  difficulty: MEDIUM
  body:
    intro: "Graph for q1: undirected edges A–B 1, B–C 2, A–C 3, C–D 4, B–D 5."
    questions:
      - id: q1
        kind: single
        prompt: What total weight does Kruskal's algorithm return for the graph above?
        options: ["6", "7", "8", "10"]
        answer: [1]
        explanation: "Sorted: A–B 1 (take), B–C 2 (take), A–C 3 (A and C already connected, skip), C–D 4 (take). Three edges for four vertices: 1 + 2 + 4 = 7. Taking A–C instead of skipping it would create a cycle."
      - id: q2
        kind: single
        prompt: For 2000 points where every pair can be connected (cost = Manhattan distance), which approach is the most efficient?
        options:
          - Kruskal on all pairs, O(n² log n)
          - Array-based Prim, O(n²) time and O(n) extra memory
          - Dijkstra from point 0
          - BFS from point 0
        answer: [1]
        explanation: "With about 2 × 10⁶ implicit edges, sorting them all costs O(n² log n) time and O(n²) memory. Array Prim scans the n current keys per step, O(n²) total, and computes edge costs on the fly. Dijkstra and BFS compute shortest paths, a different problem."
      - id: q3
        kind: multi
        prompt: Which statements are true for a connected undirected weighted graph?
        options:
          - If all weights are distinct, the MST is unique
          - The MST contains the shortest path between any two vertices
          - Every MST has exactly V - 1 edges
          - Some MST contains a minimum-weight edge of the graph
        answer: [0, 2, 3]
        explanation: "Distinct weights make every cut's cheapest edge unique, so the MST is unique. A minimum edge is the cheapest across the cut around either endpoint, so some MST contains it. MSTs minimise total weight, not pairwise distance: in a triangle with weights 2, 2 and 3, the MST uses both 2-edges and its path between the 3-edge's ends costs 4."
      - id: q4
        kind: single
        prompt: "A Prim implementation pushes `(dist[u] + w, v)` instead of `(w, v)`. What does it compute?"
        options:
          - The same MST, just slower
          - A shortest-path tree from the start vertex, which is generally not an MST
          - A maximum spanning tree
          - Nothing; it raises an error
        answer: [1]
        explanation: "That key is Dijkstra's: total path length from the start. It yields the tree of shortest paths, which can be heavier than the MST. Prim's key is the weight of the single edge into the tree."
      - id: q5
        kind: single
        prompt: Kruskal finishes the edge list having added only V - 3 edges. What does that mean?
        options:
          - The graph has 3 components, and no spanning tree exists
          - Three edges were skipped by mistake
          - The MST is not unique
          - The graph has a cycle
        answer: [0]
        explanation: "A forest with V vertices and V - k edges has k components. Kruskal adds every edge that joins components, so ending with V - 3 edges means 3 components remain; report that no spanning tree exists (or return the forest)."
      - id: q6
        kind: short
        prompt: State the cut property and explain how it justifies Kruskal's choice of edge.
        model_answer: "For any partition of the vertices into two sets, a minimum-weight edge crossing the partition belongs to some MST (exchange argument: swap it in for the heavier crossing edge on the cycle it creates). When Kruskal takes edge (u, v), u and v are in different components; consider the cut between u's component and everything else. Every lighter edge was already processed and either used or found inside a component, so (u, v) is the cheapest edge crossing that cut, hence safe."
        explanation: The cut property is the single fact both Prim and Kruskal rely on; naming it is the expected proof.
- key: dsa.mst.interview
  type: interview_question
  title: "Interview question: choosing between Prim and Kruskal"
  skills: [graph.mst, graph.union_find]
  minutes: 12
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 720}
  body:
    prompt: "You must connect a set of sites with fibre at minimum total cost. Sometimes you get a sparse list of feasible links with costs; sometimes every pair of sites can be linked and the cost is their distance. Explain which MST algorithm you would use in each case, why it is correct, and the complexity. Also say how you would handle sites that can instead get a standalone satellite link for a fixed price."
    key_points:
      - Sparse edge list → Kruskal with union-find, O(E log E).
      - "All pairs (complete graph) → array-based Prim, O(V²) time, O(V) memory, no edge materialisation."
      - Justifies correctness with the cut property (cheapest crossing edge is safe).
      - "Satellite option → a virtual node joined to each site with weight equal to the satellite price, then a normal MST on V + 1 nodes."
      - Checks connectivity (V - 1 edges used) and explains the forest case.
    model_answer: |-
      For a sparse list of links I would use Kruskal: sort by cost, add each link that joins two different components using union-find, stop at V - 1 links. O(E log E). For the all-pairs case the graph is complete with about V²/2 edges, so I would not build them; array-based Prim keeps, for every site outside the tree, the cheapest known link into the tree, picks the minimum in O(V), and updates the others in O(V): O(V²) overall and O(V) memory. Both are correct by the cut property: the cheapest link across any division of the sites is part of some optimal network.

      For satellite links I add a virtual node "satellite" connected to every site with cost equal to that site's satellite price. Any spanning tree of the extended graph is a valid plan (sites linked to the virtual node use satellite), so the MST of the extended graph is the cheapest plan. If Kruskal ends with fewer than V - 1 links in the original case, the sites cannot all be connected and I report that.
    pitfalls:
      - Building all V² edges and sorting them for large V.
      - Forgetting the connectivity check.
    follow_ups:
      - prompt: How would you find links that appear in every minimum-cost network?
        look_for: "Critical edges: an edge is critical if removing it increases the MST weight (or disconnects); test by re-running Kruskal without it, O(E · E log E) naive, or use cycle-property reasoning on equal-weight groups."
      - prompt: How do you get two clusters of sites from the MST?
        look_for: Remove the single heaviest MST edge (k - 1 heaviest for k clusters); this maximises the minimum distance between clusters (single-linkage clustering).
- key: dsa.mst.guided
  type: guided_problem
  title: "Guided practice: connecting all points cheaply"
  skills: [graph.mst]
  minutes: 30
  difficulty: MEDIUM
  problems: [107]
  body:
    guidance:
      - Notice the graph is complete and say why that favours array-based Prim.
      - Keep `best[i]` = cheapest edge from the tree to point i, and `in_tree[i]`.
      - Each step, pick the cheapest point not in the tree, add its cost, and update best for the rest.
      - State O(n²) time and O(n) space, and compare with Kruskal on all pairs.
    hints:
      - Start with best[0] = 0 and everything else infinite.
      - The edge cost is computed on the fly; never store all pairs.
- key: dsa.mst.timed
  type: timed_problem
  title: "Timed practice: virtual nodes and critical edges"
  skills: [graph.mst]
  minutes: 70
  difficulty: HARD
  problems: [108, 109]
  body:
    guidance:
      - For the village water problem, introduce a virtual node whose edges cost the well prices, then run Kruskal; explain why this models the choice exactly.
      - For critical and pseudo-critical edges, compute the base MST weight, then for each edge rerun Kruskal once excluding it (critical if the weight rises or the graph disconnects) and once forcing it in (pseudo-critical if the weight stays the same).
      - Give the complexity of the per-edge reruns before coding.
- key: dsa.mst.cards
  type: revision_card
  title: "Recall: minimum spanning trees"
  skills: [graph.mst]
  minutes: 4
  body:
    cards:
      - front: Number of edges in a spanning tree of V vertices?
        back: V - 1.
      - front: The cut property?
        back: The cheapest edge crossing any cut belongs to some MST.
      - front: Kruskal in one line?
        back: Sort edges; add each that joins two different union-find components.
      - front: Best MST algorithm for all pairs of n points?
        back: "Array-based Prim, O(n²) time and O(n) memory."
      - front: Prim's heap key?
        back: The weight of the single edge into the tree, not a path length.
