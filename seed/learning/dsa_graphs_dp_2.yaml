# Learning content: topological sort, union-find, Dijkstra and weighted shortest paths, minimum spanning trees.
seed_version: seed-v2
content:
# ---------------------------------------------------------------------------------------------- topological sort
- key: dsa.topo_sort.lesson
  type: lesson
  title: Topological sort with Kahn's algorithm and DFS finishing order
  skills: [graph.topological_sort, graph.traversal]
  minutes: 22
  difficulty: MEDIUM
  body:
    summary: Order the nodes of a directed acyclic graph so every edge points forward, by repeatedly removing nodes with no remaining prerequisites or by reversing DFS finishing order.
    what: |-
      A **topological order** of a directed graph lists its vertices so that for every edge `u → v`, `u` comes before `v`. It exists exactly when the graph is a **DAG** (directed acyclic graph). It is usually not unique: in a graph with edges `0 → 1`, `0 → 2`, `1 → 3`, `2 → 3`, both `0 1 2 3` and `0 2 1 3` are valid.

      Two standard algorithms:

      - **Kahn's algorithm** (BFS-like): compute every node's **in-degree** (number of incoming edges). Put every in-degree-0 node in a queue. Repeatedly pop a node, append it to the order, and decrement the in-degree of each of its successors; any successor that reaches 0 joins the queue. If the order ends up shorter than V, the leftover nodes are on or behind a cycle.
      - **DFS finishing order**: run a three-colour DFS; append each node to a list when it **finishes** (all its descendants are done). Reversing that list gives a topological order, because a node finishes only after everything it points to has finished. An edge to a grey node means a cycle.
    why: |-
      Anything with dependencies needs it: build systems compile a module after the modules it imports, package managers install dependencies first, course plans put prerequisites first, spreadsheet engines recompute a cell after the cells it reads, and data pipelines run a job after its inputs. It also turns some hard problems on general graphs into easy DP on DAGs: longest path, shortest path with negative weights, and counting paths are all O(V + E) once you have a topological order.
    when: |-
      - The problem mentions prerequisites, dependencies, "must happen before", or an ordering inferred from comparisons (sorted alien words).
      - You must decide whether a set of constraints is satisfiable (it is exactly when there is no cycle).
      - You need DP over a DAG: process nodes in topological order so every predecessor is final before you use it.
      - You need "parallel rounds": Kahn's algorithm processed one queue level at a time gives the minimum number of rounds when independent tasks can run together.
    how: |-
      ```python
      from collections import deque

      def topo_order(n: int, edges: list[tuple[int, int]]) -> list[int]:
          """edges (u, v) mean u must come before v. Returns [] if there is a cycle."""
          adj = [[] for _ in range(n)]
          indegree = [0] * n
          for u, v in edges:
              adj[u].append(v)
              indegree[v] += 1
          queue = deque(u for u in range(n) if indegree[u] == 0)
          order = []
          while queue:
              u = queue.popleft()
              order.append(u)
              for v in adj[u]:
                  indegree[v] -= 1
                  if indegree[v] == 0:          # last prerequisite of v just finished
                      queue.append(v)
          return order if len(order) == n else []
      ```

      Get the **edge direction** right before anything else. If the input says "`[a, b]` means you must take b before a", the edge is `b → a`. Write that down as a comment.

      DFS version: colour nodes white/grey/black; on finishing a node append it to `post`; the answer is `post[::-1]`. It is natural when you already run DFS, but recursion depth is a risk on long chains in CPython (default limit 1000), which Kahn's algorithm does not have.
    mental_model: |-
      Kahn's algorithm is a to-do list where a task becomes "ready" when its last blocker is done. You keep working on ready tasks; if you run out of ready tasks while some remain blocked, those tasks are blocking each other in a circle. The DFS version is the opposite view: a node is "finished" only after everything it points to has finished, so listing finish times backwards puts each node before all of its successors.
    tradeoffs: |-
      Kahn's is iterative (no recursion limit), detects cycles by counting, and naturally yields levels for parallel scheduling; swapping its queue for a min-heap gives the lexicographically smallest order at O(V log V + E). DFS ordering needs no in-degree array and integrates with other DFS work (cycle path reporting, strongly connected components), but in Python it needs an explicit stack for deep graphs. Both are O(V + E).
    mistakes:
      - Reversing the edge direction, which produces an order with every prerequisite after its dependant.
      - Using post-order without reversing it in the DFS version.
      - Forgetting nodes that appear in no edge; they have in-degree 0 and must be in the order.
      - Counting duplicate edges once in the in-degree but twice in the adjacency list (or the reverse), so some node never reaches 0.
      - Not checking `len(order) == n`, and returning a partial order for a cyclic input.
      - Using a single visited set in the DFS version, which cannot detect cycles.
    interview: |-
      State the graph ("courses are nodes, each prerequisite pair is an edge from prerequisite to course"), name Kahn's algorithm, and say how a cycle shows up (fewer than V nodes output). Follow-ups you should be ready for: return any valid order, the lexicographically smallest order (heap), the number of parallel rounds (level-by-level Kahn's), and inferring edges from a sorted list of words (compare adjacent words at their first differing character, and reject a word that comes before its own prefix).
    explain_it:
      - Define the edge direction explicitly.
      - Explain in-degree and why a DAG always has at least one in-degree-0 node.
      - Explain why the leftover nodes after Kahn's prove a cycle.
      - Give O(V + E) time and O(V + E) space.
    example:
      language: python
      code: |-
        def longest_path_in_dag(n, edges):
            """Longest path (in edges) in a DAG: DP over a topological order."""
            order = topo_order(n, edges)
            adj = [[] for _ in range(n)]
            for u, v in edges:
                adj[u].append(v)
            best = [0] * n                      # best[v] = longest path ending at v
            for u in order:                     # every predecessor of u is already final
                for v in adj[u]:
                    best[v] = max(best[v], best[u] + 1)
            return max(best, default=0)
      explanation: "Longest path is NP-hard on general graphs but O(V + E) on a DAG, because the topological order guarantees each node's value is final before it is propagated."
    complexity: O(V + E) time and O(V + E) space for both Kahn's algorithm and DFS ordering; O(V log V + E) for the lexicographically smallest order with a heap.
    internals: |-
      Why a DAG always has an in-degree-0 node: if every node had an incoming edge, you could walk backwards forever, and with finitely many nodes you would revisit one, which is a cycle. Removing such a node keeps the rest a DAG, so Kahn's can always continue until the graph is empty. Conversely, the nodes on a cycle each keep at least one unremoved predecessor (the previous node on the cycle), so none of them ever reaches in-degree 0.
    edge_cases:
      - Nodes with no edges.
      - Self-loop (a one-node cycle).
      - Duplicate dependency pairs.
      - Several independent chains (many valid orders).
- key: dsa.topo_sort.check
  type: concept_check
  title: "Concept check: topological sort"
  skills: [graph.topological_sort]
  minutes: 9
  difficulty: MEDIUM
  body:
    intro: "Graph for tracing: edges 0 → 1, 0 → 2, 1 → 3, 2 → 3, with adjacency lists in that order."
    questions:
      - id: q1
        kind: single
        prompt: What does the Kahn's algorithm in the lesson return for this graph?
        options: ["[0, 1, 2, 3]", "[0, 2, 1, 3]", "[3, 1, 2, 0]", "[0, 1, 3, 2]"]
        answer: [0]
        explanation: "Only 0 starts at in-degree 0. Popping 0 drops 1 and 2 to zero, queued in adjacency order. Popping 1 leaves 3 at in-degree 1; popping 2 drops it to 0. `[0, 2, 1, 3]` is also a valid topological order, just not the one this code produces. `[0, 1, 3, 2]` is invalid because 3 comes before its predecessor 2."
      - id: q2
        kind: single
        prompt: "A DFS appends each node when it finishes, starting from 0 and following adjacency order. What is the post-order list, and what is the topological order?"
        options:
          - "post [3, 1, 2, 0]; order [0, 2, 1, 3]"
          - "post [0, 1, 3, 2]; order [0, 1, 3, 2]"
          - "post [3, 1, 2, 0]; order [3, 1, 2, 0]"
          - "post [3, 2, 1, 0]; order [0, 1, 2, 3]"
        answer: [0]
        explanation: "DFS goes 0 → 1 → 3; 3 finishes first, then 1. From 0 it goes to 2, whose successor 3 is already black, so 2 finishes, then 0. Reversing post-order gives [0, 2, 1, 3]. Using post-order unreversed puts 3 first, which violates every edge."
      - id: q3
        kind: single
        prompt: "Input pairs are `[course, prerequisite]`: `[1, 0]` means 0 must be taken before 1. Which edge do you add?"
        options: ["1 → 0", "0 → 1", "Both directions", "Either; the order is just reversed"]
        answer: [1]
        explanation: "Edges point from what must come first to what comes after, so prerequisite → course: 0 → 1. Building 1 → 0 makes Kahn's output the courses in reverse; \"either\" is tempting because the cycle verdict is the same, but the returned order would be wrong."
      - id: q4
        kind: multi
        prompt: Which problems become O(V + E) once you have a topological order?
        options:
          - Longest path in a DAG
          - Shortest path in a DAG with some negative edge weights
          - Number of distinct paths from s to t in a DAG
          - Shortest path in an undirected graph with cycles and positive weights
        answer: [0, 1, 2]
        explanation: "Relaxing edges in topological order makes each node final before it is used, so longest path, shortest path (even with negative weights) and path counting are linear DP on a DAG. An undirected graph with cycles has no topological order; that needs Dijkstra."
      - id: q5
        kind: single
        prompt: Kahn's algorithm on a 6-node graph stops with only 4 nodes in the order. What can you conclude?
        options:
          - The graph is disconnected
          - The 2 remaining nodes are on a cycle or reachable only through one
          - The algorithm has a bug; Kahn's always outputs every node
          - The graph has two valid orders
        answer: [1]
        explanation: "A remaining node never reached in-degree 0, so some predecessor was never removed; following predecessors back among the leftovers must eventually repeat a node, which is a cycle. Disconnection is harmless: each component contributes its own in-degree-0 starts."
      - id: q6
        kind: short
        prompt: How would you return the lexicographically smallest topological order, and what does it cost?
        model_answer: "Run Kahn's algorithm with a min-heap instead of a FIFO queue: always remove the smallest ready node. Each node is pushed and popped once, so O(V log V + E) time and O(V + E) space. Greedily picking the smallest ready node is safe because picking it never blocks anything else."
        explanation: A common follow-up; the change is one data structure, and the cost is the heap's log factor on V, not on E.
- key: dsa.topo_sort.exercise
  type: coding_exercise
  title: "Exercise: install packages in parallel rounds"
  skills: [graph.topological_sort, queue.deque]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      A package manager knows a list of package names and a list of `(package, dependency)` pairs: the dependency must be installed before the package. Packages whose dependencies are all installed can be installed together in one round. Write `install_rounds(packages, deps)` returning the list of rounds (each round sorted alphabetically for determinism), or `None` if the dependencies contain a cycle. The number of rounds must be the minimum possible.
    examples:
      - "install_rounds(['app', 'db', 'log', 'web'], [('app', 'db'), ('app', 'log'), ('web', 'app')]) == [['db', 'log'], ['app'], ['web']]"
      - "install_rounds(['a', 'b'], [('a', 'b'), ('b', 'a')]) is None"
      - "install_rounds(['x'], []) == [['x']]"
    constraints:
      - Up to 10⁴ packages and 10⁵ pairs; every name in a pair is in the package list.
    hints:
      - Direction first. Which way does the edge point for `(package, dependency)`?
      - Every package with no uninstalled dependency can go in the current round.
      - Process Kahn's queue one whole level at a time; each level is one round.
    solution:
      language: python
      code: |-
        def install_rounds(packages, deps):
            users = {p: [] for p in packages}         # dependency -> packages that need it
            waiting = {p: 0 for p in packages}        # number of uninstalled dependencies
            for pkg, dep in deps:
                users[dep].append(pkg)
                waiting[pkg] += 1
            current = sorted(p for p in packages if waiting[p] == 0)
            rounds, installed = [], 0
            while current:
                rounds.append(current)
                installed += len(current)
                nxt = []
                for dep in current:
                    for pkg in users[dep]:
                        waiting[pkg] -= 1
                        if waiting[pkg] == 0:
                            nxt.append(pkg)
                current = sorted(nxt)
            return rounds if installed == len(packages) else None
      explanation: "Each round installs everything that is ready, so a package lands in round k exactly when its longest dependency chain has k - 1 links; no schedule can do better. O(V + E) plus sorting each round, O(V log V) in total."
    rubric:
      - {key: direction, label: "Builds edges dependency → package and counts waiting dependencies per package", points: 2}
      - {key: levels, label: Processes ready packages level by level so the round count is minimal, points: 3}
      - {key: cycle, label: Returns None when not every package was installed, points: 2}
      - {key: isolated, label: Includes packages with no dependencies in the first round, points: 1}
      - {key: complexity, label: "States O(V + E) plus the sorting cost", points: 2}
    follow_ups:
      - prompt: Why is the number of rounds minimal?
        look_for: "A package cannot be installed before its longest dependency chain is done; level-by-level Kahn's puts each package in exactly the round equal to that chain length plus one."
      - prompt: At most k installs can run per round. Does level-by-level still give the minimum?
        look_for: "No; with a capacity limit, filling rounds arbitrarily can waste slots, and precedence-constrained scheduling with an arbitrary slot count is NP-hard in general; a practical heuristic is to prioritise ready packages on the longest remaining dependant chain."
- key: dsa.topo_sort.interview
  type: interview_question
  title: "Interview question: Kahn's algorithm or DFS?"
  skills: [graph.topological_sort, graph.cycles_bipartite]
  minutes: 10
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 600}
  body:
    prompt: "You need to order build targets so each one is built after the targets it depends on, and report an error when the dependencies are cyclic. Compare Kahn's algorithm with DFS-based topological sort for this job, and say which you would use in Python and why."
    key_points:
      - "Kahn's: in-degrees, a queue of in-degree-0 nodes, decrement successors; a cycle exists when fewer than V nodes are output."
      - "DFS: three colours, append on finish, reverse; a cycle is an edge to a grey node."
      - "Both O(V + E) time and O(V + E) space."
      - Prefers Kahn's in Python for deep dependency chains because it is iterative (recursive DFS hits the default limit of 1000 frames), or writes DFS with an explicit stack.
      - Mentions that DFS makes it easy to report the cycle's members, while Kahn's tells you which targets are stuck.
    model_answer: |-
      Both produce a valid order in O(V + E). Kahn's counts in-degrees, repeatedly removes ready targets, and detects a cycle when some targets never become ready. DFS colours nodes, appends each target when its dependencies are finished, and detects a cycle when it meets a grey node. In Python I would use Kahn's for a build tool: it has no recursion-depth risk on long chains, it naturally gives build levels that can run in parallel, and with a heap it can give a deterministic order. If the error message must name the cycle, I would run a colour DFS on the leftover nodes, or keep parent pointers, to print the loop.
    pitfalls:
      - Claiming DFS is faster or uses less memory; both are linear.
      - Forgetting to reverse the DFS finishing order.
    follow_ups:
      - prompt: How do you print the actual cycle with Kahn's algorithm?
        look_for: "All leftover nodes have a leftover predecessor; start from any leftover node and walk predecessors (or run colour DFS restricted to leftovers) until a node repeats; the repeated segment is the cycle."
      - prompt: Only one target changed. How do you rebuild the minimum set?
        look_for: "Find everything reachable from the changed target along dependant edges (BFS on the reversed graph), then topologically order that subset."
- key: dsa.topo_sort.guided
  type: guided_problem
  title: "Guided practice: can every course be finished?"
  skills: [graph.topological_sort]
  minutes: 25
  difficulty: MEDIUM
  problems: [32]
  body:
    guidance:
      - Write the edge direction as a comment before building anything.
      - Build the adjacency list and the in-degree array in the same loop.
      - Run Kahn's algorithm and compare the number of removed courses with the total.
      - Test a two-course cycle and a course with no prerequisites.
    hints:
      - Courses that appear in no pair start with in-degree 0.
      - You do not need the order itself, only how many courses were removed.
- key: dsa.topo_sort.timed
  type: timed_problem
  title: "Timed practice: course order and an inferred alphabet"
  skills: [graph.topological_sort]
  minutes: 60
  difficulty: HARD
  problems: [98, 99]
  body:
    guidance:
      - For the course order, reuse Kahn's and return an empty result on a cycle; finish this one quickly.
      - For the alphabet, say how edges come from the first differing letter of each adjacent pair of words, and name the invalid case where a longer word precedes its own prefix.
      - Include letters that appear in no edge, then run Kahn's; give O(total characters + alphabet) time before coding.
- key: dsa.topo_sort.cards
  type: revision_card
  title: "Recall: topological sort"
  skills: [graph.topological_sort]
  minutes: 4
  body:
    cards:
      - front: When does a topological order exist?
        back: Exactly when the directed graph has no cycle (it is a DAG).
      - front: "Kahn's algorithm in one line?"
        back: Repeatedly remove an in-degree-0 node and decrement its successors.
      - front: "How does Kahn's detect a cycle?"
        back: Fewer than V nodes are output.
      - front: DFS-based topological order?
        back: Reverse of the order in which nodes finish.
      - front: Lexicographically smallest topological order?
        back: "Kahn's with a min-heap instead of a queue, O(V log V + E)."
      - front: Minimum number of parallel rounds?
        back: "Kahn's processed one whole level at a time; one level is one round."

# ---------------------------------------------------------------------------------------------- union-find
- key: dsa.union_find.lesson
  type: lesson
  title: Union-find with path compression and union by rank
  skills: [graph.union_find]
  minutes: 20
  difficulty: MEDIUM
  body:
    summary: A forest of parent pointers that answers "are these two in the same group?" and merges groups in near-constant amortised time.
    what: |-
      **Union-find** (disjoint set union, DSU) maintains a partition of elements into disjoint sets with two operations:

      - `find(x)`: return the **representative** (root) of x's set.
      - `union(a, b)`: merge the sets containing a and b.

      Each set is a tree stored as a `parent` array; a root is its own parent. Two elements are connected exactly when `find` returns the same root. Two optimisations make it fast:

      - **Path compression**: during `find`, point every visited node directly at the root, so the next lookup is one step.
      - **Union by rank** (or by size): attach the shorter (or smaller) tree under the taller (larger) one, so trees stay shallow.
    why: |-
      Many problems add connections over time and ask about connectivity: merging accounts that share an email, counting provinces, detecting the edge that creates a cycle, and Kruskal's MST, which asks "would this edge join two different trees?" for every edge. Re-running BFS after each new edge costs O(V + E) per query; union-find answers each query in effectively constant time.
    when: |-
      - Edges or "same group" facts arrive one at a time and you query connectivity in between (online connectivity).
      - You need the number of components while edges are being added.
      - Undirected cycle detection while reading an edge list.
      - Kruskal's MST, or grouping items by an equivalence relation (same email, same root word).

      It does **not** support splitting a set or deleting an edge, and it does not give you a path between two nodes; use BFS/DFS for paths.
    how: |-
      ```python
      class DSU:
          def __init__(self, n: int) -> None:
              self.parent = list(range(n))
              self.rank = [0] * n                 # upper bound on tree height
              self.components = n

          def find(self, x: int) -> int:
              root = x
              while self.parent[root] != root:
                  root = self.parent[root]
              while self.parent[x] != root:       # path compression, iterative (no recursion limit)
                  nxt = self.parent[x]
                  self.parent[x] = root
                  x = nxt
              return root

          def union(self, a: int, b: int) -> bool:
              ra, rb = self.find(a), self.find(b)
              if ra == rb:
                  return False                    # already connected: this edge would close a cycle
              if self.rank[ra] < self.rank[rb]:
                  ra, rb = rb, ra
              self.parent[rb] = ra                # shorter tree goes under the taller one
              if self.rank[ra] == self.rank[rb]:
                  self.rank[ra] += 1
              self.components -= 1
              return True
      ```

      For elements that are not 0..n-1 (emails, strings), either map them to integers first or use dicts for `parent` and `rank`, adding an element the first time it is seen.
    mental_model: |-
      Every group has a leader, and every member knows someone who knows the leader. `find` follows the chain to the leader, and path compression makes everyone on the chain remember the leader directly. `union` makes one leader report to the other, always making the smaller team's leader report to the bigger team's leader so chains stay short.
    tradeoffs: |-
      With both optimisations a sequence of m operations on n elements costs O(m · α(n)), where α is the inverse Ackermann function, at most 4 for any input that fits in memory. With only union by rank, each operation is O(log n) worst case; with only path compression, amortised O(log n). Against BFS/DFS: union-find is better for incremental edges and repeated queries; BFS/DFS is simpler for a one-off component count on a fixed graph and can return paths. Union-find cannot undo a union (rollback variants exist but drop path compression).
    mistakes:
      - "Linking non-roots: `parent[a] = b` moves a away from its old set instead of merging the two sets. Always link `find(a)` and `find(b)`."
      - "Comparing `parent[a] == parent[b]` instead of `find(a) == find(b)`; parents are not necessarily roots."
      - Decrementing the component count even when the union found the same root.
      - Recursive `find` without union by rank, which can recurse O(n) deep on adversarial input in CPython.
      - Forgetting to initialise elements that are only discovered while reading the input.
    interview: |-
      Write the DSU class from memory in about three minutes, then use it. Say "path compression plus union by rank gives near-constant amortised time, inverse Ackermann" and be ready to say what each optimisation does alone. Typical follow-ups: count components as edges arrive, return the first redundant edge, merge records that share any key (map each key to the first record that had it), and why deletions are hard.
    explain_it:
      - What find and union do and what a root represents.
      - What path compression does and what union by rank does.
      - "Complexity: amortised O(α(n)) per operation with both, O(n) space."
      - What it cannot do (split, delete edges, report paths).
    example:
      language: python
      code: |-
        def first_redundant_edge(n, edges):
            dsu = DSU(n + 1)                       # nodes labelled 1..n
            for u, v in edges:
                if not dsu.union(u, v):
                    return [u, v]                  # u and v were already connected
            return []
      explanation: "The first edge whose endpoints already share a root closes a cycle. O(E · α(V)) time, O(V) space."
    complexity: Amortised O(α(n)) per find or union with both optimisations (α(n) ≤ 4 in practice); O(n) space.
    internals: |-
      Why union by rank bounds height: a root's rank increases only when two trees of equal rank merge, so a tree whose root has rank r contains at least 2^r nodes. With n nodes, rank and therefore height is at most log₂ n. Path compression then flattens the paths that are actually used; the combined analysis (Tarjan) gives the inverse Ackermann bound.
    edge_cases:
      - union(x, x) should return False and change nothing.
      - Elements that never appear in any union are their own singleton set.
      - Labels starting at 1 instead of 0 (allocate n + 1 slots).
    misconceptions:
      - "Union-find is not O(1) per operation in the strict worst case; individual finds can be slow, but the amortised cost is effectively constant."
- key: dsa.union_find.check
  type: concept_check
  title: "Concept check: union-find"
  skills: [graph.union_find]
  minutes: 9
  difficulty: MEDIUM
  body:
    intro: Assume the DSU class from the lesson unless the question shows other code.
    questions:
      - id: q1
        kind: single
        prompt: "This union is used instead of the lesson's. Starting from five singletons, it runs union(0, 1), union(2, 1), then union(0, 3). Which statement is true afterwards?"
        code:
          language: python
          code: |-
            def bad_union(a, b):
                parent[a] = b
        options:
          - 0, 1, 2 and 3 are all in one set
          - 0 is linked to 3, but 1 and 2 are no longer connected to 0
          - It is correct but slower
          - It raises an error because 0 is not a root
        answer: [1]
        explanation: "After the first two calls, parent[0] = 1 and parent[2] = 1. union(0, 3) overwrites parent[0] = 3, detaching 0 from 1's tree instead of merging the two sets. The fix is parent[find(a)] = find(b). No error is raised, which is why this bug is easy to miss."
      - id: q2
        kind: single
        prompt: With both path compression and union by rank, what is the amortised cost per operation?
        options: ["O(1) worst case", "O(log n)", "O(α(n)), effectively constant", "O(n)"]
        answer: [2]
        explanation: "The bound is the inverse Ackermann function, at most 4 for any realistic n. It is not a strict O(1) worst case: a single find can be longer, but it pays for later finds by flattening the path. O(log n) is the bound with only one of the two optimisations."
      - id: q3
        kind: multi
        prompt: Which tasks does a plain union-find support efficiently?
        options:
          - Count components while edges are added one by one
          - Detect the first edge that closes a cycle in an undirected graph
          - Remove an edge and report whether the graph splits
          - Return the shortest path between two connected nodes
        answer: [0, 1]
        explanation: "Union-find only merges. Removing an edge would require splitting a set, which the structure cannot do, and it stores no edges, so it cannot produce a path; use BFS for that."
      - id: q4
        kind: single
        prompt: "A solution checks connectivity with `parent[a] == parent[b]`. When does it give a wrong answer?"
        options:
          - Never, after path compression
          - When a and b are in the same set but at different depths, so their parents differ
          - Only when a == b
          - Only for disconnected nodes
        answer: [1]
        explanation: "Parents are roots only for nodes directly under the root. Path compression flattens only paths that find has walked, so deeper nodes can still have a non-root parent. Always compare find(a) and find(b)."
      - id: q5
        kind: single
        prompt: "n = 5. Calls: union(0, 1), union(1, 2), union(0, 2), union(3, 4). What is `components`?"
        options: ["1", "2", "3", "4"]
        answer: [1]
        explanation: "Three successful unions reduce 5 to 2; union(0, 2) finds the same root and returns False without decrementing. Decrementing unconditionally would give 1."
      - id: q6
        kind: short
        prompt: Why does union by rank keep every tree's height at most log₂ n?
        model_answer: "A root's rank grows only when two trees of equal rank are merged. By induction, a tree whose root has rank r has at least 2^r nodes: merging two trees of rank r - 1, each with at least 2^(r-1) nodes, gives at least 2^r. So with n nodes the rank, which bounds the height, is at most log₂ n."
        explanation: This is the classic doubling argument; union by size gives the same bound with the same reasoning.
- key: dsa.union_find.exercise
  type: coding_exercise
  title: "Exercise: answer connectivity queries as cables are added"
  skills: [graph.union_find]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 900}
  body:
    prompt: |-
      A data centre has `n` servers (0..n-1) and receives a stream of operations: `("link", a, b)` adds a cable between two servers, and `("ask", a, b)` asks whether they can currently reach each other. Write `process(n, ops)` returning a list with one entry per operation: for `ask`, a bool; for `link`, the number of separate networks after the link. Implement union-find yourself with path compression and union by rank.
    examples:
      - "process(4, [('ask', 0, 1), ('link', 0, 1), ('ask', 0, 1), ('link', 1, 0), ('link', 2, 3)]) == [False, 3, True, 3, 2]"
    constraints:
      - Up to 10⁵ servers and 2 × 10⁵ operations.
    hints:
      - Re-running BFS for each ask would be O(ops × (V + E)).
      - Keep a component counter in the DSU and decrement it only on a successful union.
      - Write find iteratively so deep trees cannot hit the recursion limit.
    solution:
      language: python
      code: |-
        def process(n, ops):
            parent = list(range(n))
            rank = [0] * n
            components = n

            def find(x):
                root = x
                while parent[root] != root:
                    root = parent[root]
                while parent[x] != root:
                    parent[x], x = root, parent[x]
                return root

            out = []
            for op, a, b in ops:
                ra, rb = find(a), find(b)
                if op == "ask":
                    out.append(ra == rb)
                    continue
                if ra != rb:
                    if rank[ra] < rank[rb]:
                        ra, rb = rb, ra
                    parent[rb] = ra
                    if rank[ra] == rank[rb]:
                        rank[ra] += 1
                    components -= 1
                out.append(components)
            return out
      explanation: "`parent[x], x = root, parent[x]` evaluates the right side first, then assigns parent[x] (with the old x) and moves x up. O((n + ops) · α(n)) time, O(n) space."
    rubric:
      - {key: dsu_correct, label: find returns the root and union links roots (not raw elements), points: 3}
      - {key: optimisations, label: Implements both path compression and union by rank or size, points: 2}
      - {key: counter, label: "Component count changes only on a successful union; repeated links leave it unchanged", points: 2}
      - {key: iterative, label: find is iterative or depth is otherwise bounded, points: 1}
      - {key: complexity, label: "States amortised O(α(n)) per operation", points: 2}
    follow_ups:
      - prompt: Cables can also be removed. What changes?
        look_for: "Plain union-find cannot split sets. Options: process offline in reverse (removals become additions), a rollback DSU without path compression for undo in stack order, or a dynamic connectivity structure; mention the cost."
      - prompt: Also report the size of the largest network after each link.
        look_for: Union by size with a size array, and track a running maximum updated on each successful union.
