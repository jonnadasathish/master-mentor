# ---------------------------------------------------------------------------------------------- weighted shortest path
- key: dsa.dijkstra.lesson
  type: lesson
  title: Dijkstra's algorithm with a heap, and when it breaks
  skills: [graph.shortest_path, heap.top_k]
  minutes: 25
  difficulty: MEDIUM
  body:
    summary: Repeatedly finalise the closest unfinalised node using a min-heap; correct for non-negative weights in O((V + E) log V), wrong once a negative edge exists.
    what: |-
      **Dijkstra's algorithm** computes the cheapest distance from one source to every node in a graph with **non-negative** edge weights. It keeps a tentative distance for every node, starts with 0 at the source, and repeatedly takes the unfinished node with the smallest tentative distance, declares that distance final, and **relaxes** its outgoing edges: if `dist[u] + w < dist[v]`, update `dist[v]`.

      Related algorithms you should be able to name and place:

      - **BFS**: all weights equal; O(V + E).
      - **0-1 BFS**: weights only 0 or 1; a deque where 0-edges go to the front; O(V + E).
      - **Bellman-Ford**: any weights, detects negative cycles; relax every edge V - 1 times, O(V · E).
      - **DAG relaxation**: any weights on a DAG; relax in topological order, O(V + E).
    why: |-
      Routing (latency, cost, distance), "minimum time for a signal to reach every node", "cheapest path where the cost is the maximum edge on the path", and many grid problems with varying costs are weighted shortest-path problems. BFS is wrong as soon as weights differ, because a path with more edges can be cheaper.
    when: |-
      - Weighted graph, non-negative weights, single source: Dijkstra.
      - Path cost defined by a monotone combination such as "the maximum edge along the path" (swim-in-water style): Dijkstra still works, with `max(d, w)` instead of `d + w`.
      - A limit on the number of edges (at most k stops): Bellman-Ford limited to k + 1 rounds, or BFS over (node, stops) states, because plain Dijkstra may discard a costlier path that uses fewer stops.
      - Negative edges: Bellman-Ford (or DAG relaxation if acyclic).
    how: |-
      Python's `heapq` has no decrease-key, so push a new entry on every improvement and skip **stale** entries when popped (lazy deletion):

      ```python
      import heapq

      def dijkstra(n, adj, src):
          """adj[u] = list of (v, w) with w >= 0. Returns the distance list; unreachable = None."""
          dist = [None] * n
          dist[src] = 0
          heap = [(0, src)]
          while heap:
              d, u = heapq.heappop(heap)
              if d > dist[u]:
                  continue                      # stale entry: u was already finalised cheaper
              for v, w in adj[u]:
                  nd = d + w
                  if dist[v] is None or nd < dist[v]:
                      dist[v] = nd
                      heapq.heappush(heap, (nd, v))
          return dist
      ```

      To return the path, store `parent[v] = u` whenever `dist[v]` improves, then walk back from the target. To stop early for a single target, return when the target is popped (not when it is first pushed).
    mental_model: |-
      Water spreading through pipes at constant speed from the source, where an edge's weight is the pipe length. The node the water reaches next is always the closest unreached one, and nothing can reach it sooner later, because every other route has to go through a node that is already at least as far away and pipes have non-negative length. A negative-length pipe breaks that promise: a far node could later "shortcut back" to a node you already declared done.
    tradeoffs: |-
      Binary-heap Dijkstra is O((V + E) log V); with lazy deletion the heap can hold up to E entries, which is still O(E log V) because log E ≤ 2 log V. On dense graphs (E close to V²) a simple O(V²) array version without a heap is faster. Bellman-Ford is far slower, O(V · E), but handles negative weights and reports negative cycles. A* adds a heuristic to Dijkstra for single-target search on maps; it is optimal only with an admissible heuristic.
    mistakes:
      - Using BFS on a weighted graph.
      - Forgetting the stale-entry check, which keeps the answer correct but re-scans adjacency lists and slows the algorithm down.
      - Marking a node visited when it is pushed instead of when it is popped, which can finalise a non-optimal distance.
      - Returning as soon as the target is pushed rather than popped.
      - "Running Dijkstra with negative edges. In the version that finalises nodes on pop, with edges A → B (2), A → C (5), C → B (-4), B is finalised at 2 although A → C → B costs 1."
      - "Pushing `(node, dist)` instead of `(dist, node)`, so the heap orders by node id."
    interview: |-
      State the precondition ("all weights are non-negative") before you write anything; interviewers often ask what happens with a negative edge. Give O((V + E) log V) and explain stale entries. Common follow-ups: path reconstruction, at most k stops (Bellman-Ford rounds or state expansion), minimising the maximum edge (bottleneck path), and why A* can be faster.
    explain_it:
      - Precondition (non-negative weights) and why it matters.
      - The invariant (a popped node's distance is final).
      - Lazy deletion and the stale-entry check.
      - "Complexity O((V + E) log V) time, O(V + E) space."
    complexity: O((V + E) log V) with a binary heap; O(V²) with an array (better for dense graphs); Bellman-Ford O(V · E); BFS and 0-1 BFS O(V + E).
    internals: |-
      Proof sketch: suppose u is popped with distance d but a cheaper path P exists. P leaves the set of finalised nodes at some edge x → y with y not finalised; y's tentative distance is at most cost(P up to y) ≤ cost(P) < d because the remaining edges of P are non-negative. Then y would have been popped before u, a contradiction. The step "remaining edges are non-negative" is exactly what a negative edge breaks.
    edge_cases:
      - Unreachable nodes (keep None or infinity, and report -1 if asked).
      - Zero-weight edges (fine for Dijkstra).
      - Parallel edges with different weights (keep all; relaxation picks the best).
      - Source equals target.
    misconceptions:
      - Adding a constant to every edge to remove negatives does not work; it penalises paths with more edges.
      - Dijkstra does not need a visited set if you use the stale-entry check; the check plays the same role.
- key: dsa.dijkstra.worked
  type: worked_example
  title: "Worked example: tracing Dijkstra with stale heap entries"
  skills: [graph.shortest_path]
  minutes: 12
  difficulty: MEDIUM
  body:
    problem: "Directed edges with weights: A → B 4, A → C 1, C → B 2, B → D 1, C → D 5, D → E 3. Find the cheapest distance from A to every node, tracking the heap."
    steps:
      - title: Start at the source
        text: "dist = {A: 0}, heap = [(0, A)]. Pop (0, A) and relax: B becomes 4, C becomes 1. heap = [(1, C), (4, B)]."
      - title: Pop the closest node, C
        text: "Pop (1, C). Relax C → B: 1 + 2 = 3 < 4, so B improves to 3 and (3, B) is pushed. Relax C → D: 1 + 5 = 6, D becomes 6. The old (4, B) entry stays in the heap: heap = [(3, B), (4, B), (6, D)]."
      - title: Pop B at its improved distance
        text: "Pop (3, B); B is final at 3. Relax B → D: 3 + 1 = 4 < 6, D improves to 4. heap = [(4, B), (4, D), (6, D)]."
      - title: Skip a stale entry
        text: "Pop (4, B). dist[B] is 3 and 4 > 3, so this entry is stale: skip it without scanning B's edges again. This is lazy deletion."
      - title: Finish
        text: "Pop (4, D); relax D → E: E = 7. Pop (6, D): stale, skip. Pop (7, E). Heap empty. Final: A 0, B 3, C 1, D 4, E 7."
        code:
          language: python
          code: |-
            adj = {"A": [("B", 4), ("C", 1)], "B": [("D", 1)], "C": [("B", 2), ("D", 5)],
                   "D": [("E", 3)], "E": []}
            # dijkstra over dict labels returns {'A': 0, 'C': 1, 'B': 3, 'D': 4, 'E': 7}
    takeaways:
      - The heap can hold several entries for one node; only the smallest is used.
      - A node's distance is final when it is popped, not when it is pushed.
      - The direct edge A → B (4) lost to the two-edge path A → C → B (3); BFS would have picked the direct edge.
    complexity: 5 nodes, 6 edges, 7 pushes and 7 pops; in general O((V + E) log V).
- key: dsa.dijkstra.check
  type: concept_check
  title: "Concept check: weighted shortest paths"
  skills: [graph.shortest_path]
  minutes: 10
  difficulty: MEDIUM
  body:
    intro: Assume the lesson's heap-based Dijkstra with the stale-entry check unless told otherwise.
    questions:
      - id: q1
        kind: single
        prompt: "Edges A → B (2), A → C (5), C → B (-4). A Dijkstra variant marks a node done when popped and never updates done nodes. What does it report for B?"
        options: ["1", "2", "-4", "It loops forever"]
        answer: [1]
        explanation: "B is popped at distance 2 before C (5) and is declared done. When C is processed, 5 + (-4) = 1 would be better, but B is already finalised, so 2 is reported. The correct answer is 1; with negative edges use Bellman-Ford."
      - id: q2
        kind: single
        prompt: "What happens if you delete the line `if d > dist[u]: continue`?"
        options:
          - Distances become wrong
          - Distances stay correct, but stale entries re-scan their adjacency lists, adding wasted work
          - The heap stops working
          - It becomes Bellman-Ford
        answer: [1]
        explanation: "A stale entry has d larger than the final dist[u], so every relaxation it tries is no better than one already made, and nothing changes. The answer is still correct, but each stale pop costs a full adjacency scan, which can push the running time well above O((V + E) log V) on dense graphs."
      - id: q3
        kind: multi
        prompt: Which statements are true?
        options:
          - "Bellman-Ford handles negative edges and detects negative cycles in O(V · E)"
          - Dijkstra is correct with negative edges as long as there is no negative cycle
          - "In a DAG, relaxing edges in topological order gives shortest paths even with negative weights, in O(V + E)"
          - "With weights of only 0 and 1, a deque-based BFS gives shortest paths in O(V + E)"
        answer: [0, 2, 3]
        explanation: "Dijkstra's proof needs every remaining edge to be non-negative; a single negative edge can break it even without a negative cycle (see q1). The other three are the standard alternatives."
      - id: q4
        kind: single
        prompt: "For \"cheapest flight with at most k stops\", Bellman-Ford runs k + 1 rounds. Why must each round relax edges from a copy of the previous round's distances?"
        options:
          - To save memory
          - Without the copy, one round can chain several edges, so a path with more than k stops can be counted
          - The copy makes it O(V + E)
          - Python lists cannot be updated while iterating
        answer: [1]
        explanation: "If round i reads values updated earlier in the same round, a path can extend by several edges in one round, breaking the \"round i = at most i edges\" invariant. Reading from the previous round's copy keeps exactly one extra edge per round."
      - id: q5
        kind: single
        prompt: Time complexity of the lesson's Dijkstra with lazy deletion on a graph with V nodes and E edges?
        options: ["O(V + E)", "O((V + E) log V)", "O(V · E)", "O(V² log V)"]
        answer: [1]
        explanation: "Each successful relaxation pushes once (at most E pushes) and each push is popped once, each costing O(log E) = O(log V). O(V + E) is BFS; O(V · E) is Bellman-Ford."
      - id: q6
        kind: short
        prompt: In your own words, why is a node's distance final at the moment it is popped from the heap?
        model_answer: "It has the smallest tentative distance among unfinished nodes. Any other route to it must leave the finished set through some unfinished node, which already costs at least as much, and the rest of that route adds non-negative weights, so it cannot be cheaper. Hence the popped distance is optimal; this is exactly the step that negative edges break."
        explanation: Being able to say this argument is what separates knowing Dijkstra from reciting it.
- key: dsa.dijkstra.interview
  type: interview_question
  title: "Interview question: why do negative edges break Dijkstra?"
  skills: [graph.shortest_path]
  minutes: 12
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 720}
  body:
    prompt: "A teammate wants to model refunds as negative edge weights in a route-cost graph and keep using Dijkstra. Explain whether that works, show a small counter-example, and recommend what to use instead, with complexities."
    key_points:
      - Explains that Dijkstra finalises the closest node on the assumption that later edges cannot reduce its distance, which requires non-negative weights.
      - "Gives a concrete counter-example (for example A → B 2, A → C 5, C → B -4: B is finalised at 2 but the true distance is 1)."
      - "Recommends Bellman-Ford, O(V · E), which also detects negative cycles (a further improvement after V - 1 rounds)."
      - "Mentions DAG relaxation in O(V + E) if the graph is acyclic, and that adding a constant to all edges does not fix it."
      - Asks whether a negative cycle is possible and what the business meaning would be (unbounded profit).
    model_answer: |-
      It does not work in general. Dijkstra pops the closest unfinished node and declares it final, which is valid only because any other route must continue along non-negative edges and cannot become cheaper. With A → B (2), A → C (5), C → B (-4), B is finalised at 2 while A → C → B costs 1. Lazy-deletion implementations sometimes recover by reprocessing nodes, but then the running-time guarantee is lost.

      I would use Bellman-Ford: relax every edge V - 1 times, O(V · E), and run one more round; if anything still improves there is a negative cycle, which here would mean a route that earns unlimited refunds, a modelling bug worth surfacing. If routes form a DAG, relaxing in topological order is O(V + E). Shifting all weights by a constant is not a fix, because it penalises paths with more edges. For many queries on the same graph, Johnson's algorithm reweights edges with Bellman-Ford potentials so Dijkstra can run afterwards.
    pitfalls:
      - "\"It works if there is no negative cycle\" — false for standard Dijkstra."
      - Proposing to add a constant to every weight.
    follow_ups:
      - prompt: How does Bellman-Ford detect a negative cycle, and how would you find one of its nodes?
        look_for: "After V - 1 rounds, any edge that still relaxes lies on or leads from a negative cycle; record the relaxed node, follow parent pointers V times to land inside the cycle, then walk until it repeats."
      - prompt: The graph has a million nodes and only a few negative edges. Anything better than plain Bellman-Ford?
        look_for: "SPFA (queue-based Bellman-Ford) is often fast in practice but has the same worst case; Johnson's reweighting then Dijkstra for many sources; or restructure the model so costs are non-negative."
