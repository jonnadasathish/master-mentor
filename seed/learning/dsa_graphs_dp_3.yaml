- key: dsa.dp_knapsack.cards
  type: revision_card
  title: "Recall: knapsack and subset sum"
  skills: [dp.knapsack_subset]
  minutes: 5
  body:
    cards:
      - front: 0/1 knapsack in one row — capacity loop direction?
        back: Downward, so each item builds only on sums without it.
      - front: Unbounded knapsack in one row — capacity loop direction?
        back: Upward, so an item can build on itself.
      - front: Count coin combinations vs ordered sequences?
        back: Coins outer counts combinations; amounts outer counts sequences.
      - front: Why is O(n × W) called pseudo-polynomial?
        back: It is polynomial in the value W, exponential in the bits needed to write W.
      - front: Target sum with + and - signs reduces to?
        back: Count subsets with sum (total + target) / 2, after parity and range checks.
