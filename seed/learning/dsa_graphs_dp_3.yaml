      - For decoding, say the state and both transitions (one digit, two digits) and how zeros are handled before coding.
      - For the best subarray, state Kadane's DP ("best sum ending here is either this element alone or this element plus the best ending at the previous index").
      - Code both under the timer and give O(n) time, O(1) space.
- key: dsa.dp_basics.cards
  type: revision_card
  title: "Recall: DP fundamentals"
  skills: [dp.fundamentals]
  minutes: 5
  body:
    cards:
      - front: The four decisions of every DP?
        back: State, transition, base cases, fill order (plus where the answer is).
      - front: Two signs a problem is DP?
        back: Optimal substructure and overlapping subproblems.
      - front: Cost of a DP?
        back: Number of states × work per transition.
      - front: Memoisation risk in CPython?
        back: RecursionError beyond about 1000 frames by default, plus call overhead.
      - front: When can a DP table shrink to a few variables?
        back: When each state looks back a fixed number of steps.
      - front: Why can a module-level lru_cache give wrong answers between test cases?
        back: Its key ignores globals the function reads, so old results are reused.

# ---------------------------------------------------------------------------------------------- knapsack and subset sum
- key: dsa.dp_knapsack.lesson
  type: lesson
  title: "Knapsack and subset sum: 0/1, unbounded and counting"
  skills: [dp.knapsack_subset, dp.fundamentals]
  minutes: 25
  difficulty: MEDIUM
  body:
    summary: "Index the DP by capacity (or target sum); the direction of the capacity loop decides whether each item can be used once (downward) or many times (upward)."
    what: |-
      The **knapsack family** asks you to choose items, each with a weight (or value contributing to a sum), subject to a capacity or target:

      - **0/1 knapsack**: each item at most once; maximise value within capacity W.
      - **Unbounded knapsack**: each item any number of times (coin change).
      - **Subset sum**: can some subset reach exactly target T? (boolean)
      - **Counting**: how many subsets or combinations reach T?

      The 2-D state is `dp[i][c]` = best (or possible, or count) using the first i items with capacity c. Transition for 0/1: `dp[i][c] = max(dp[i-1][c], dp[i-1][c - w] + v)` when `w ≤ c`.
    why: |-
      "Choose a subset under a budget" hides in many problems: splitting an array into two equal halves (subset sum to total/2), assigning + and - signs to hit a target (subset sum after algebra), fewest coins for an amount (unbounded min), number of ways to make change (unbounded count). Recognising the family turns each into a few lines.
    when: |-
      - A target sum or capacity is given and its value is small enough to index an array (up to about 10⁴ to 10⁵).
      - Items are chosen or not chosen, and order does not matter.
      - The brute force is "try all 2ⁿ subsets".

      If the capacity is huge (10⁹) but n is small (≤ 40), the DP's O(n × W) is too large; consider meet-in-the-middle instead.
    how: |-
      Collapse to one row and choose the loop direction:

      ```python
      def knapsack_01(weights, values, capacity):
          best = [0] * (capacity + 1)                    # best[c] = max value with capacity c
          for w, v in zip(weights, values):
              for c in range(capacity, w - 1, -1):       # DOWNWARD: best[c - w] is still the old row
                  best[c] = max(best[c], best[c - w] + v)
          return best[capacity]

      def can_reach(nums, target):                       # subset sum, 0/1
          ok = [True] + [False] * target
          for x in nums:
              for s in range(target, x - 1, -1):
                  ok[s] = ok[s] or ok[s - x]
          return ok[target]

      def min_coins(coins, amount):                      # unbounded, minimise count
          INF = amount + 1                               # larger than any real answer
          dp = [0] + [INF] * amount
          for a in range(1, amount + 1):
              for c in coins:
                  if c <= a and dp[a - c] + 1 < dp[a]:
                      dp[a] = dp[a - c] + 1
          return dp[amount] if dp[amount] < INF else -1

      def count_combinations(coins, amount):             # unbounded, order does not matter
          ways = [1] + [0] * amount
          for c in coins:                                # coins OUTER: each multiset counted once
              for a in range(c, amount + 1):             # UPWARD: coin c may be reused
                  ways[a] += ways[a - c]
          return ways[amount]
      ```

      Rules of thumb: **0/1 → capacity downward; unbounded → upward. Counting combinations → items outer; counting ordered sequences → amount outer.**
    mental_model: |-
      Picture the 2-D table with one row per item. A 0/1 item may only build on the **previous** row, i.e. on sums made without it. When you compress to one row and walk capacities downward, the cells you read (to the left) have not been overwritten yet, so they still hold the previous row. Walking upward, you read cells you just updated in this row, which means "this item again": exactly what the unbounded version wants and exactly the bug in the 0/1 version.
    tradeoffs: |-
      O(n × W) time is **pseudo-polynomial**: polynomial in the numeric value W, exponential in the number of bits needed to write W. It is excellent when W is up to about 10⁵ and hopeless at 10⁹. The 1-D form saves memory but loses the ability to reconstruct which items were chosen; keep the 2-D table (or a per-item decision record) when you must list them. For boolean subset sum in Python, a big-integer bitset (`bits |= bits << x`) runs the same DP far faster in practice.
    mistakes:
      - "Iterating capacity upward in a 0/1 problem, which silently reuses items (subset sum of [3] wrongly reaches 6)."
      - "Initialising min-coin DP with 0 instead of a large sentinel, so unreachable amounts look free."
      - Swapping loop order in counting problems and counting permutations instead of combinations (or the reverse).
      - "Target-sum reduction without checks: (total + target) must be even and |target| ≤ total, or the answer is 0."
      - Using float('inf') and returning it instead of -1 for impossible amounts.
      - Forgetting that `dp[0] = 1` (the empty subset) in counting problems.
    interview: |-
      Classify out loud: "each number used at most once and we need an exact sum, so 0/1 subset sum over sums up to total/2; downward loop." Give O(n × T) time and O(T) space and mention pseudo-polynomial. Common follow-ups: count the subsets instead of deciding, reconstruct the subset, the target-sum algebra, and what to do when T is huge.
    explain_it:
      - Name the variant (0/1, unbounded, boolean, count, min/max).
      - State the 1-D state and the transition.
      - Justify the loop direction and the loop nesting.
      - "Complexity O(n × W) time, O(W) space; pseudo-polynomial."
    example:
      language: python
      code: |-
        def can_partition(nums: list[int]) -> bool:
            total = sum(nums)
            if total % 2:
                return False
            bits = 1                                  # bit s set means "sum s reachable"
            for x in nums:
                bits |= bits << x                     # every reachable sum, plus x
            return (bits >> (total // 2)) & 1 == 1
      explanation: "A Python int acts as a bitset of reachable sums; each shift-or is the whole downward-loop row update at once. Same O(n × T) bit operations, but word-parallel, so much faster in CPython."
    complexity: O(n × W) time and O(W) space for the 1-D forms; O(n × W) space if you keep the table to reconstruct the choice.
    internals: |-
      Target sum with + and - signs: let P be the sum of the numbers given +, N those given -. Then P - N = target and P + N = total, so P = (total + target) / 2. Counting sign assignments equals counting subsets with sum P, a 0/1 counting knapsack. If total + target is odd or negative, there is no assignment.
    edge_cases:
      - Target 0 (the empty subset counts; with zeros in the input, each zero doubles the count).
      - Items heavier than the capacity (the inner loop never runs for them).
      - Amount 0 for coin change (0 coins).
- key: dsa.dp_knapsack.visual
  type: visual_explanation
  title: "Visual: why 0/1 knapsack loops capacity downward"
  skills: [dp.knapsack_subset]
  minutes: 5
  body:
    summary: "One item of weight 2, capacities 0..4, boolean \"reachable\" row. Walking upward reuses the item; walking downward does not."
    frames:
      - caption: "Start: only sum 0 is reachable. The item has weight 2 and may be used once."
        diagram: |-
          capacity:  0  1  2  3  4
          ok:        T  F  F  F  F
      - caption: "Upward (wrong for 0/1): ok[2] = ok[0] = T, then ok[4] = ok[2] reads the cell just set in this pass, so the item is used twice."
        diagram: |-
          c = 2:  ok[2] = ok[2] or ok[0] → T
          c = 3:  ok[3] = ok[3] or ok[1] → F
          c = 4:  ok[4] = ok[4] or ok[2] → T   ← ok[2] was set by THIS item
          ok:        T  F  T  F  T             sum 4 = 2 + 2 is wrong
      - caption: "Downward (correct): ok[4] reads ok[2] before it is updated, so it still describes sums without this item."
        diagram: |-
          c = 4:  ok[4] = ok[4] or ok[2] → F   ← old value
          c = 3:  ok[3] = ok[3] or ok[1] → F
          c = 2:  ok[2] = ok[2] or ok[0] → T
          ok:        T  F  T  F  F             only sums 0 and 2
      - caption: Same idea with the 2-D table in mind. 0/1 reads the row above; unbounded reads its own row.
        diagram: |-
          capacity:      c-w      c
          row i-1:  ...  [A]  ... [B]        0/1:        new[c] = B or A   (A from the row above)
          row i:    ...  [A'] ... [?]        unbounded:  new[c] = B or A'  (A' already includes item i)

          one-row version:  downward keeps A available,  upward exposes A'
- key: dsa.dp_knapsack.check
  type: concept_check
  title: "Concept check: knapsack and subset sum"
  skills: [dp.knapsack_subset]
  minutes: 10
  difficulty: MEDIUM
  body:
    intro: Pay attention to loop direction and loop nesting in the code.
    questions:
      - id: q1
        kind: single
        prompt: "What does this return for `nums = [3]` and `target = 6`?"
        code:
          language: python
          code: |-
            def can_reach(nums, target):
                ok = [True] + [False] * target
                for x in nums:
                    for s in range(x, target + 1):
                        ok[s] = ok[s] or ok[s - x]
                return ok[target]
        options: ["False, which is correct", "True, which is wrong", "True, which is correct", "IndexError"]
        answer: [1]
        explanation: "The upward loop sets ok[3] from ok[0], then ok[6] from the just-updated ok[3], using the single 3 twice. With 0/1 items the capacity loop must go downward. Upward is right only when items are unlimited."
      - id: q2
        kind: single
        prompt: "Coins [1, 2], amount 3. Version A loops coins outer and amounts inner; version B loops amounts outer and coins inner, both with `ways[a] += ways[a - c]`. What do they return?"
        options: ["A 2, B 3", "A 3, B 2", "Both 2", "Both 3"]
        answer: [0]
        explanation: "A counts multisets: {1, 1, 1} and {1, 2}. B counts ordered sequences: 1+1+1, 1+2 and 2+1. With coins outer, coin 2 is only ever added after all uses of coin 1, so each multiset appears once."
      - id: q3
        kind: single
        prompt: "n = 30 items, capacity W = 10⁹. Why is the O(n × W) knapsack DP a poor choice?"
        options:
          - It is exponential in n
          - "It is pseudo-polynomial: 3 × 10¹⁰ steps and a 10⁹-cell array are far too large"
          - It cannot handle 0/1 items
          - It gives wrong answers for large W
        answer: [1]
        explanation: "The DP is polynomial in the value W, not in the input size. With n = 30 and huge W, meet-in-the-middle (enumerate 2¹⁵ subsets per half and combine with sorting and binary search) is the usual approach."
      - id: q4
        kind: multi
        prompt: Which problems reduce to 0/1 subset sum or 0/1 counting knapsack?
        options:
          - Split an array into two parts with equal sums
          - Assign + or - to each number to reach a target
          - Fewest coins to make an amount with unlimited coins
          - Split stones into two groups minimising the difference of their sums
        answer: [0, 1, 3]
        explanation: "Equal split is subset sum to total/2; signs reduce to subsets summing to (total + target)/2; minimum difference is the largest reachable sum not exceeding total/2. Fewest coins with unlimited supply is unbounded knapsack (upward loop), not 0/1."
      - id: q5
        kind: single
        prompt: "Using the lesson's `min_coins`, what is `min_coins([1, 3, 4], 6)`?"
        options: ["2", "3", "4", "-1"]
        answer: [0]
        explanation: "dp = 0, 1, 2, 1, 1, 2, 2 for amounts 0..6; dp[6] = dp[3] + 1 = 2 (3 + 3). Greedy would give 3 (4 + 1 + 1)."
      - id: q6
        kind: short
        prompt: Turn "assign + or - to every number so the total equals target" into a subset-counting problem, including the checks.
        model_answer: "Let P be the sum of numbers with +, N with -. P - N = target and P + N = total, so P = (total + target) / 2. If total + target is odd, or |target| > total, the answer is 0. Otherwise count subsets summing to P with a 0/1 counting DP: ways[0] = 1, for each x loop s from P down to x and add ways[s - x]. O(n × P) time, O(P) space."
        explanation: The algebra removes the minus signs; the checks are where most wrong submissions fail.
- key: dsa.dp_knapsack.exercise
  type: coding_exercise
  title: "Exercise: pack the most valuable carry-on"
  skills: [dp.knapsack_subset]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      You have items with integer weights and values, and a bag that holds at most `capacity`. Each item can be packed at most once. Write `best_value(weights, values, capacity)` returning the maximum total value, then extend it to also return the indices of one optimal set of items. State time and space for both versions.
    examples:
      - "best_value([1, 3, 4, 5], [1, 4, 5, 7], 7) == 9   (items of weight 3 and 4)"
      - "best_value([2, 3, 4], [3, 4, 6], 5) == 7   (weights 2 and 3)"
      - "best_value([5], [10], 4) == 0"
    constraints:
      - n ≤ 200, capacity ≤ 10⁴.
    hints:
      - "best[c] = maximum value using the items seen so far within capacity c."
      - Each item once means the capacity loop runs downward.
      - To recover the items, keep the 2-D table and walk back from (n, capacity), checking whether the value changed when item i was added.
    solution:
      language: python
      code: |-
        def best_value(weights, values, capacity):
            best = [0] * (capacity + 1)
            for w, v in zip(weights, values):
                for c in range(capacity, w - 1, -1):
                    best[c] = max(best[c], best[c - w] + v)
            return best[capacity]

        def best_items(weights, values, capacity):
            n = len(weights)
            table = [[0] * (capacity + 1) for _ in range(n + 1)]
            for i in range(1, n + 1):
                w, v = weights[i - 1], values[i - 1]
                for c in range(capacity + 1):
                    table[i][c] = table[i - 1][c]
                    if w <= c:
                        table[i][c] = max(table[i][c], table[i - 1][c - w] + v)
            chosen, c = [], capacity
            for i in range(n, 0, -1):
                if table[i][c] != table[i - 1][c]:   # item i-1 must have been taken
                    chosen.append(i - 1)
                    c -= weights[i - 1]
            return table[n][capacity], chosen[::-1]
      explanation: "Value only: O(n × W) time, O(W) space. With reconstruction: O(n × W) time and space, because the one-row form forgets which items were used."
    rubric:
      - {key: state, label: States the DP state and transition before coding, points: 2}
      - {key: direction, label: Uses a downward capacity loop (or a 2-D table) so each item is used once, points: 3}
      - {key: reconstruct, label: Reconstructs a correct item set by walking the 2-D table back, points: 3}
      - {key: complexity, label: "States O(n × W) time and the space of both versions, and calls it pseudo-polynomial", points: 2}
    follow_ups:
      - prompt: Each item now has a quantity limit q[i]. How do you avoid O(n × W × q)?
        look_for: "Binary splitting: represent q copies as items of 1, 2, 4, ... copies plus a remainder, giving O(n × W × log q); then run 0/1 knapsack."
      - prompt: The capacity is 10⁹ but values are small (≤ 100 each, n ≤ 100). Any other DP?
        look_for: "Swap the roles: minWeight[v] = least weight achieving value v, over total value ≤ 10⁴; answer is the largest v with minWeight[v] ≤ capacity."
- key: dsa.dp_knapsack.interview
  type: interview_question
  title: "Interview question: loop order in knapsack DPs"
  skills: [dp.knapsack_subset]
  minutes: 10
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 600}
  body:
    prompt: "Explain to an interviewer why, in a one-dimensional knapsack DP, the capacity loop runs downward for 0/1 items and upward for unlimited items, and why swapping the outer and inner loops in a coin-counting DP changes the answer. Use a tiny example for each."
    key_points:
      - "One-row DP: downward reads values from the previous item's row, so each item is used once."
      - "Upward reads values already updated by the same item, which means reuse; correct for unbounded, a bug for 0/1."
      - "Gives a tiny example, such as one item of weight 2 reaching sum 4 when looped upward."
      - "Coins outer counts combinations (each multiset once); amounts outer counts ordered sequences; example coins [1, 2], amount 3 gives 2 vs 3."
    model_answer: |-
      The 2-D table has row i depending on row i-1 for 0/1 items. When I keep one row and go downward through capacities, the cell c - w that I read is to the left and has not been overwritten yet, so it still describes sums without the current item. Going upward, c - w was already updated in this pass, so it may already include the current item; that is reuse, which is what unbounded knapsack wants. With one item of weight 2, upward iteration marks 2 and then 4 as reachable, which is wrong for a single item.

      For counting coin combinations, putting coins in the outer loop processes all uses of coin 1 before any use of coin 2, so each multiset is built in one canonical order and counted once: coins [1, 2] and amount 3 give 2. Putting amounts outer lets each amount end with any coin, so 1 + 2 and 2 + 1 are different: 3. Which one is right depends on whether order matters in the problem.
    pitfalls:
      - Saying "it is just a convention".
      - Mixing up which nesting counts permutations.
    follow_ups:
      - prompt: Would loop direction matter if you kept the full 2-D table?
        look_for: "No; with separate rows you always read row i-1 (0/1) or row i (unbounded) explicitly, and inner-loop direction no longer matters."
      - prompt: How would you count ordered sequences that use each item at most once?
        look_for: That is no longer a knapsack over sums alone; you need to track which items were used (bitmask DP for small n) or count subsets and multiply by permutation counts per subset size.
- key: dsa.dp_knapsack.guided
  type: guided_problem
  title: "Guided practice: equal-sum split"
  skills: [dp.knapsack_subset]
  minutes: 25
  difficulty: MEDIUM
  problems: [118]
  body:
    guidance:
      - "Reduce the problem first: an odd total is impossible; otherwise find a subset summing to total / 2."
      - Write the boolean row and loop sums downward for each number.
      - Stop early once the half sum becomes reachable.
      - State O(n × total) time and O(total) space; mention the big-integer bitset as an alternative.
    hints:
      - "ok[0] is True: the empty subset."
      - The largest number exceeding half the total means the answer is False immediately.
