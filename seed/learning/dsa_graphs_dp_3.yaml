      - For take-or-skip, the two candidates are best(i-1) and best(i-2) + value.
- key: dsa.dp_basics.timed
  type: timed_problem
  title: "Timed practice: decoding digits and best subarray"
  skills: [dp.fundamentals]
  minutes: 50
