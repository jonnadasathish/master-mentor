- key: dsa.graph_cycles.cards
  type: revision_card
  title: "Recall: cycles and bipartite checks"
  skills: [graph.cycles_bipartite]
  minutes: 4
  body:
    cards:
      - front: Undirected cycle with DFS?
        back: A visited neighbour that is not the parent closes a cycle.
      - front: Undirected cycle with union-find?
        back: An edge whose endpoints already share a root closes a cycle.
      - front: Directed cycle with DFS?
        back: An edge to a GREY node (still on the current path); BLACK targets are fine.
      - front: Why is a single visited set wrong for directed graphs?
        back: A node reached by two different paths (a diamond) looks like a cycle.
      - front: Bipartite exactly when?
        back: The graph has no odd-length cycle; BFS two-colouring finds no same-colour edge.
