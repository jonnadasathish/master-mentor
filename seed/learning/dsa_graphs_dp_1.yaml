- key: dsa.grid_bfs.cards
  type: revision_card
  title: "Recall: grids and multi-source BFS"
  skills: [graph.grid_multisource]
  minutes: 4
  body:
    cards:
      - front: Vertices and edges of an R × C grid with 4-directional moves?
        back: R × C vertices, up to 4 × R × C directed edges; traversal is O(R × C).
      - front: Distance from every cell to the nearest source, efficiently?
        back: Multi-source BFS — enqueue all sources at distance 0, then run one BFS.
      - front: Why is multi-source BFS correct?
        back: It is BFS from a virtual super-source joined to every source by a zero-length edge.
      - front: How do you count minutes in a spreading simulation?
        back: Process one queue level per minute and stop when nothing remains to reach.
      - front: When should a grid search start from the border instead?
        back: When the question is "which cells can reach the edge"; one reverse search beats one search per cell.

# ---------------------------------------------------------------------------------------------- cycles and bipartite
- key: dsa.graph_cycles.lesson
  type: lesson
  title: Detecting cycles and two-colouring graphs
  skills: [graph.cycles_bipartite, graph.traversal]
  minutes: 22
  difficulty: MEDIUM
  body:
    summary: Undirected cycles are found with a parent check or union-find, directed cycles need three colours, and a graph is bipartite exactly when BFS two-colouring never finds a same-coloured edge.
    what: |-
      A **cycle** is a path that returns to its start without reusing an edge. How you detect one depends on direction:

      - **Undirected graph**: during DFS, reaching an already-visited neighbour that is **not the node you came from** means a cycle. Equivalently with union-find: an edge whose two ends are already in the same set closes a cycle.
      - **Directed graph**: a cycle exists exactly when DFS finds a **back edge**, an edge to a node that is still on the current recursion path. Track three states: **white** (unvisited), **grey** (on the current path), **black** (fully finished). An edge to a grey node is a cycle; an edge to a black node is not.

      A graph is **bipartite** if its vertices can be split into two groups so that every edge goes between the groups. Equivalently, it can be coloured with two colours so that no edge joins two nodes of the same colour, and equivalently it has **no odd-length cycle**.
    why: |-
      Cycle detection answers "can these tasks be scheduled?" (a dependency cycle makes it impossible), "is this graph a tree?" (connected with V - 1 edges and no cycle), "is there a deadlock?" (a cycle in the wait-for graph) and "which nodes are safe?" (not able to reach a cycle). Bipartite checks answer "can these people be split into two teams with no conflicts?" and underlie matching problems.
    when: |-
      - Undirected, need "has a cycle?" or "is it a tree?": DFS with parent, or union-find while reading edges.
      - Directed, need "has a cycle?", "can all courses be finished?", "eventual safe nodes": three-colour DFS, or Kahn's algorithm (if not every node gets removed, there is a cycle).
      - "Split into two groups", "two-colour", "no edge inside a group": BFS or DFS colouring.
    how: |-
      Directed cycle detection with colours (iterative DFS avoids recursion limits, but the recursive form shows the idea most clearly):

      ```python
      WHITE, GREY, BLACK = 0, 1, 2

      def has_directed_cycle(n, adj):
          color = [WHITE] * n

          def visit(u):
              color[u] = GREY                  # u is on the current path
              for v in adj[u]:
                  if color[v] == GREY:
                      return True              # back edge: v is an ancestor of u
                  if color[v] == WHITE and visit(v):
                      return True
              color[u] = BLACK                 # every path from u is explored and cycle-free
              return False

          return any(color[u] == WHITE and visit(u) for u in range(n))
      ```

      Undirected cycle detection with union-find (no recursion at all):

      ```python
      def has_undirected_cycle(n, edges):
          parent = list(range(n))
          def find(x):
              while parent[x] != x:
                  parent[x] = parent[parent[x]]   # path halving
                  x = parent[x]
              return x
          for u, v in edges:
              ru, rv = find(u), find(v)
              if ru == rv:
                  return True                     # u and v were already connected
              parent[ru] = rv
          return False
      ```

      Bipartite check with BFS, run from every uncoloured node because the graph may be disconnected:

      ```python
      from collections import deque

      def is_bipartite(n, adj):
          color = [-1] * n
          for start in range(n):
              if color[start] != -1:
                  continue
              color[start] = 0
              queue = deque([start])
              while queue:
                  u = queue.popleft()
                  for v in adj[u]:
                      if color[v] == -1:
                          color[v] = 1 - color[u]
                          queue.append(v)
                      elif color[v] == color[u]:
                          return False           # edge inside one group: odd cycle
          return True
      ```
    mental_model: |-
      Directed: grey nodes are the breadcrumbs of the walk you are on right now. Stepping onto your own breadcrumb means you walked in a circle. A black node is a corridor someone already fully explored and proved dead-end free, so entering it again is harmless. Undirected: every edge is a two-way street, so seeing your parent again is just the street you came in on; any other visited neighbour is a second route to the same place. Bipartite: alternate colours along every path; a contradiction can only happen when a cycle has odd length, because going around an odd cycle flips the colour an odd number of times.
    tradeoffs: |-
      Three-colour DFS finds a cycle and can also produce a topological order (reverse of finishing order) in the same pass; Kahn's algorithm gives the order and the cycle verdict iteratively with no recursion-depth risk, but it does not directly name the cycle's nodes. For undirected graphs union-find is the simplest when edges arrive as a list (and works online, edge by edge), while DFS with parent also gives you the cycle path. BFS and DFS colouring are both O(V + E); BFS avoids recursion depth.
    mistakes:
      - Using a single visited set for directed graphs. In the diamond A → B, A → C, B → D, C → D, the second visit to D is reported as a cycle, but there is none.
      - In undirected DFS, treating the parent as a cycle, which flags every edge.
      - "Parent check by node with parallel edges: two separate edges between u and v do form a cycle, and a node-based parent check misses it. Track the edge id instead when multi-edges are possible."
      - Running the bipartite check only from node 0, so other components are never checked.
      - Forgetting to set a node back from grey to black, so later traversals that reach it report false cycles.
      - "Self-loop u → u: it is a cycle (directed) and makes a graph non-bipartite; make sure your code sees it."
    interview: |-
      Say which kind of graph you have before choosing a method: "directed, so I need three states, not just visited". Expect follow-ups such as returning the actual cycle (keep a parent array and walk back from the back edge), finding all nodes not on or leading to a cycle (black after a full colour DFS, or Kahn's on the reversed graph), and proving why the odd-cycle condition is equivalent to bipartiteness.
    explain_it:
      - State whether the graph is directed or undirected and why that changes the method.
      - Explain grey vs black (on the current path vs finished) for directed graphs.
      - Explain the parent exception (or the union-find same-root test) for undirected graphs.
      - "For bipartite: colour alternately from every uncoloured node; a same-colour edge means an odd cycle."
      - Give O(V + E) time and O(V) extra space for all three.
    example:
      language: python
      code: |-
        def is_tree(n: int, edges: list[tuple[int, int]]) -> bool:
            # A tree on n nodes has exactly n - 1 edges, is connected and has no cycle.
            # With exactly n - 1 edges, "no cycle" already implies "connected".
            if len(edges) != n - 1:
                return False
            return not has_undirected_cycle(n, edges)
      explanation: "The edge count rules out most non-trees in O(1); union-find then detects any cycle in near-linear time. With n - 1 edges and no cycle the graph cannot be disconnected, because a forest with k components has n - k edges."
    complexity: O(V + E) time for colour DFS, BFS colouring and Kahn's; union-find cycle detection is O(E · α(V)), effectively linear. O(V) extra space.
    edge_cases:
      - Self-loops.
      - Parallel edges between the same two nodes.
      - Disconnected graphs (cycle or conflict in a component you did not start from).
      - A graph with zero edges (acyclic and bipartite).
    misconceptions:
      - "\"Visited twice means cycle\" is true only for undirected graphs, and only when the neighbour is not the parent."
      - A graph with an even cycle can still be bipartite; only odd cycles break it.
- key: dsa.graph_cycles.check
  type: concept_check
  title: "Concept check: cycles and bipartite graphs"
  skills: [graph.cycles_bipartite]
  minutes: 9
  difficulty: MEDIUM
  body:
    intro: Watch whether each graph is directed or undirected; it changes the right answer.
    questions:
      - id: q1
        kind: single
        prompt: "Directed edges: A → B, A → C, B → D, C → D. This code is run from A. What does it return, and is it right?"
        code:
          language: python
          code: |-
            def has_cycle(u, seen):
                if u in seen:
                    return True
                seen.add(u)
                return any(has_cycle(v, seen) for v in adj[u])
        options:
          - False, which is correct
          - True, which is wrong; D is reached twice through two paths, not through a cycle
          - True, which is correct
          - It raises RecursionError
        answer: [1]
        explanation: "The second path A → C → D finds D in `seen` and reports a cycle, but the graph is a DAG. A single visited set cannot tell \"on the current path\" (grey) from \"finished earlier\" (black). Only an edge to a grey node is a cycle."
      - id: q2
        kind: single
        prompt: In three-colour DFS on a directed graph, you are at u and see an edge u → v where v is BLACK. What does that mean?
        options:
          - A cycle through u and v
          - No cycle through this edge; v and everything reachable from it is already explored and cycle-free
          - u must be re-coloured white
          - The graph is not a DAG
        answer: [1]
        explanation: "Black means v's DFS finished, so v is not an ancestor of u and the edge is a forward or cross edge. A cycle needs a path back to u, and v's finished search would have found u grey if one existed. Only grey targets signal a cycle."
      - id: q3
        kind: multi
        prompt: Which graphs are bipartite?
        options:
          - A cycle of 4 nodes
          - A cycle of 5 nodes
          - Any tree
          - A triangle with one extra pendant node attached
        answer: [0, 2]
        explanation: "A graph is bipartite exactly when it has no odd cycle. A 4-cycle is even; trees have no cycles at all (colour by depth parity). The 5-cycle and the triangle are odd cycles, and attaching a pendant node does not remove the triangle."
      - id: q4
        kind: single
        prompt: "Undirected edges are processed in order with union-find: (0, 1), (1, 2), (3, 4), (2, 0). Which edge is reported as closing a cycle?"
        options: ["(1, 2)", "(3, 4)", "(2, 0)", "None"]
        answer: [2]
        explanation: "After the first two edges, 0, 1 and 2 share a root. (3, 4) joins a new pair. (2, 0) finds both ends with the same root, so it closes the cycle 0 – 1 – 2 – 0."
      - id: q5
        kind: single
        prompt: A graph has two components; component 1 is bipartite and component 2 is a triangle. Your BFS colouring starts only from node 0, which is in component 1. What does it return?
        options: ["False", "True, which is wrong", "True, which is right", "It raises an error on the triangle"]
        answer: [1]
        explanation: "The triangle is never visited, so no conflict is found and the function wrongly returns True. The outer loop over every uncoloured node is part of the algorithm, not an optimisation."
      - id: q6
        kind: short
        prompt: Explain why a graph that contains an odd cycle cannot be two-coloured.
        model_answer: "Walking along a cycle, adjacent nodes must have different colours, so the colour flips at every edge. After k edges you are back at the start, and the colour has flipped k times. If k is odd, the start node would need the opposite of its own colour, a contradiction. Conversely, BFS colouring only fails on an edge between two nodes at the same BFS depth parity, which closes an odd cycle."
        explanation: Interviewers like this short proof because it explains why the algorithm's single check is sufficient.
- key: dsa.graph_cycles.debug
  type: debugging_exercise
  title: "Debugging: the scheduler that rejects valid pipelines"
  skills: [graph.cycles_bipartite, graph.topological_sort]
  minutes: 18
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1080}
  body:
    scenario: |-
      A build tool rejects pipelines that contain a dependency cycle. Users report that several valid pipelines are rejected, while pipelines with real cycles are rejected correctly. Each step's dependencies are stored as a directed adjacency list `deps[step] = [steps it depends on]`.
    symptoms:
      - "A pipeline where both `test` and `lint` depend on `compile`, and `package` depends on both, is rejected as cyclic."
      - "Whether a valid pipeline is rejected depends on declaration order: the two-step chain where `a` depends on `b` passes when `a` is declared first and fails when `b` is declared first."
      - "A real cycle (`a` depends on `b`, `b` depends on `a`) is rejected, as it should be."
    artifacts:
      language: python
      code: |-
        def has_cycle(deps):
            visited = set()

            def visit(step):
                if step in visited:
                    return True
                visited.add(step)
                for d in deps.get(step, []):
                    if visit(d):
                        return True
                return False

            return any(visit(s) for s in deps if s not in visited)
    tasks:
      - Explain exactly why the diamond-shaped pipeline is reported as cyclic.
      - Fix the function so it reports a cycle only when one exists.
      - Name a second bug that appears on a pipeline with 5000 steps in a chain, and how you would avoid it.
    hints:
      - "Which step is reached twice in the diamond, and is it on the current path when it is reached the second time?"
      - You need to tell "currently being explored" apart from "already finished".
    reference: |-
      `compile` is reached once via `test` and again via `lint`. The second time it is already in `visited`, but it is finished, not on the current path, so it is not a cycle. The fix is three states: mark a step grey when its visit starts and black when it ends, and report a cycle only when an edge reaches a grey step; skip black steps. The declaration-order symptom has the same cause: when `b` is visited first and finished, visiting `a` later reaches the finished `b` and reports a cycle. With colours, a visit starts only from white steps and a black step is simply skipped. A 5000-step chain recurses 5000 deep and exceeds CPython's default recursion limit of 1000, so use an iterative DFS with an explicit stack, or Kahn's algorithm (count steps with zero remaining dependencies; if fewer than all steps are removed, there is a cycle).
    solution:
      language: python
      code: |-
        from collections import deque

        def has_cycle(deps):
            steps = set(deps) | {d for ds in deps.values() for d in ds}
            remaining = {s: 0 for s in steps}          # dependencies not yet satisfied
            users = {s: [] for s in steps}             # who depends on s
            for s, ds in deps.items():
                for d in ds:
                    remaining[s] += 1
                    users[d].append(s)
            ready = deque(s for s in steps if remaining[s] == 0)
            done = 0
            while ready:
                d = ready.popleft()
                done += 1
                for s in users[d]:
                    remaining[s] -= 1
                    if remaining[s] == 0:
                        ready.append(s)
            return done < len(steps)                   # something never became ready: a cycle
      explanation: Kahn's algorithm is iterative, so the chain length does not matter, and it is O(V + E). A three-colour DFS is an equally valid fix if written iteratively.
    rubric:
      - {key: diagnosis, label: Explains that a finished node reached by a second path is not a cycle, points: 3}
      - {key: fix, label: "Fixes with three states (grey/black) or Kahn's algorithm, and the fix passes the diamond and the two-node cycle", points: 4}
      - {key: depth, label: Identifies the recursion-depth limit on long chains and avoids it, points: 2}
      - {key: complexity, label: "States O(V + E) for the fixed version", points: 1}
    follow_ups:
      - prompt: Users want the error message to name the steps in the cycle. How?
        look_for: Keep a parent pointer (or the explicit DFS stack); when an edge reaches a grey step, walk the stack back to that step to list the cycle.
      - prompt: Which steps can still run if part of the pipeline is cyclic?
        look_for: Exactly the steps Kahn's algorithm removed; steps on a cycle or depending on one never become ready.
