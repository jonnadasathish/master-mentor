- key: dsa.math.modpow_exercise
  type: coding_exercise
  title: "Exercise: modular power and modular inverse"
  skills: [math.number_basics, bit_manipulation.core]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      Without using the built-in three-argument `pow`, write:

      - `power_mod(base, exp, mod)` returning baseᵉˣᵖ mod `mod` for `exp >= 0`, in O(log exp) multiplications.
      - `inverse_mod(b, p)` for a prime `p` and `b` not divisible by `p`, using Fermat's little theorem (b^(p-2) is the inverse of b modulo p).

      Then use them to compute `n choose k` modulo 10⁹ + 7 for n up to 10⁵ with precomputed factorials.
    examples:
      - "power_mod(2, 10, 1000) == 24"
      - "inverse_mod(3, 7) == 5   (3 * 5 = 15 = 2 * 7 + 1)"
      - "n_choose_k(5, 2) == 10"
    constraints:
      - 0 <= exp <= 10¹⁸; 2 <= mod <= 2³¹.
      - 0 <= k <= n <= 10⁵.
    hints:
      - Look at the exponent in binary; each bit decides whether the current square is multiplied in.
      - Reduce after every multiplication.
      - "n! / (k! (n-k)!) becomes fact[n] * inv(fact[k]) * inv(fact[n - k]) mod p."
    solution:
      language: python
      code: |-
        MOD = 10**9 + 7

        def power_mod(base: int, exp: int, mod: int) -> int:
            result = 1 % mod
            base %= mod
            while exp:
                if exp & 1:
                    result = result * base % mod
                base = base * base % mod
                exp >>= 1
            return result

        def inverse_mod(b: int, p: int) -> int:
            return power_mod(b, p - 2, p)        # valid only for prime p, b % p != 0

        def make_n_choose_k(limit: int):
            fact = [1] * (limit + 1)
            for i in range(1, limit + 1):
                fact[i] = fact[i - 1] * i % MOD
            def n_choose_k(n: int, k: int) -> int:
                if k < 0 or k > n:
                    return 0
                return fact[n] * inverse_mod(fact[k], MOD) % MOD * inverse_mod(fact[n - k], MOD) % MOD
            return n_choose_k
      explanation: "power_mod is O(log exp). Factorials take O(limit); each query costs two inverses, O(log MOD) each. Precomputing inverse factorials makes each query O(1)."
    rubric:
      - {key: fast_power, label: Uses square-and-multiply with O(log exp) steps and reduces after each multiplication, points: 4}
      - {key: inverse, label: "Uses b^(p-2) mod p and states the preconditions (p prime, b not a multiple of p)", points: 3}
      - {key: binomial, label: Computes n choose k from factorials and inverses and returns 0 for k > n, points: 2}
      - {key: edge_cases, label: "Handles exp = 0 and mod = 1 (result 0)", points: 1}
    follow_ups:
      - prompt: The modulus is now 10⁹ (not prime). Does inverse_mod still work?
        look_for: No; Fermat needs a prime and many values are not coprime with 10⁹. Use the extended Euclidean algorithm when gcd(b, m) = 1, otherwise no inverse exists.
      - prompt: You must answer 10⁵ queries. How do you avoid two inverses per query?
        look_for: "Precompute inv_fact[limit] once with one inverse, then inv_fact[i - 1] = inv_fact[i] * i mod p going down; each query is O(1)."
- key: dsa.math.interview
  type: interview_question
  title: "Interview question: primes at scale"
  skills: [math.number_basics]
  minutes: 12
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 720}
  body:
    prompt: "You need the number of primes below n for n up to 5 × 10⁶, and separately a yes/no answer for whether one 12-digit number is prime. Compare trial division and the sieve for each case, with complexity and memory."
    key_points:
      - "Trial division tests one number in O(√n): for a 12-digit number that is about 10⁶ divisions, acceptable for a single query."
      - "Counting primes below n by trial division costs O(n √n), too slow at 5 × 10⁶; the sieve is O(n log log n)."
      - "The sieve needs O(n) memory; a bytearray of 5 × 10⁶ bytes is about 5 MB."
      - "Starts crossing out at i * i and only iterates i up to √n."
    model_answer: For the count, sieve once with a bytearray of n bytes, iterating i up to √n and crossing out from i * i; O(n log log n) time, about 5 MB. For a single 12-digit number, a sieve to 10¹² is impossible; trial division by 2 and odd numbers up to √n ≈ 10⁶ is fine. For many large queries, sieve primes up to 10⁶ once and trial-divide only by those, or use a primality test such as Miller-Rabin.
    pitfalls:
      - Proposing a sieve up to 10¹² for the single-number question.
      - Iterating trial division up to n instead of √n.
    follow_ups:
      - prompt: n is now 10¹⁰ and you only need primes in a window [L, L + 10⁶). How?
        look_for: "Segmented sieve: sieve base primes up to √(L + 10⁶) and cross out their multiples inside the window only; memory proportional to the window."
      - prompt: Why is checking divisors only up to √n enough?
        look_for: If n = a × b with both factors above √n, the product would exceed n; so a composite always has a factor at most √n.
- key: dsa.math.cards
  type: revision_card
  title: "Recall: number basics"
  skills: [math.number_basics]
  minutes: 5
  body:
    cards:
      - front: Euclid's recurrence and cost?
        back: "gcd(a, b) = gcd(b, a % b); O(log min(a, b)) steps."
      - front: "-7 // 2 and -7 % 3 in Python?"
        back: "-4 and 2 (floor division; remainder takes the divisor's sign)."
      - front: Modular division by b modulo a prime p?
        back: "Multiply by pow(b, p - 2, p), or pow(b, -1, p) in Python 3.8+."
      - front: Sieve of Eratosthenes cost?
        back: O(n log log n) time, O(n) space; start each prime at i * i.
      - front: Fast exponentiation cost?
        back: O(log n) multiplications by repeated squaring.
      - front: Safe integer square root in Python?
        back: "math.isqrt(n), never int(math.sqrt(n)) for large n."
