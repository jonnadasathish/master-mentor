- key: dsa.dp_grid.cards
  type: revision_card
  title: "Recall: grid DP"
  skills: [dp.grid_paths]
  minutes: 4
  body:
    cards:
      - front: Unique right/down paths in an R × C grid?
        back: C(R + C - 2, R - 1).
      - front: Why is right/down grid DP valid?
        back: No cycles; each cell depends only on the cell above and the cell to the left.
      - front: One-row grid DP — what do dp[c] and dp[c - 1] hold at update time?
        back: dp[c] is the cell above (old row); dp[c - 1] is the cell to the left (new row).
      - front: Four-directional moves with positive costs?
        back: Not a fixed-order DP; use Dijkstra.
      - front: When do you fill a grid DP backwards?
        back: When a cell's requirement depends on the path after it (minimum starting health).

# ---------------------------------------------------------------------------------------------- interval and state-machine DP
- key: dsa.dp_interval.lesson
  type: lesson
  title: Interval DP and state-machine DP
  skills: [dp.interval_state_machine, dp.fundamentals]
  minutes: 30
  difficulty: HARD
  body:
    summary: "Interval DP solves dp[i][j] for a range from shorter ranges, filled by increasing length; state-machine DP tracks a small set of modes per step (holding, sold, cooling) and the legal transitions between them."
    what: |-
      Two DP shapes that look different from prefix DPs:

      **Interval DP**: the state is a contiguous range, `dp[i][j]` = the answer for `a[i..j]`. It combines smaller ranges inside it, either by shrinking the ends (palindromes) or by choosing a split point `k` (merging, cutting, bursting). Typical costs: O(n²) states with O(1) transitions (longest palindromic subsequence) or O(n) transitions (matrix-chain order, burst balloons, minimum cost to cut a stick): O(n³).

      **State-machine DP**: process the input left to right, and at each step keep one value per **state** of a small automaton. For stock trading with a one-day cooldown the states are **hold** (own a share), **sold** (sold today) and **rest** (no share, free to buy). Each day's values are computed from the previous day's values along the allowed arrows.
    why: |-
      Interval DP is the tool when the order of operations inside a range matters and the problem splits cleanly into a left part, a chosen element or split, and a right part. State-machine DP turns rules like "cooldown after selling", "at most two transactions" or "pay a fee per trade" into a handful of variables updated in O(1) per step, where a brute force would branch over every buy and sell day.
    when: |-
      - Interval DP signals: answer for a whole range built from sub-ranges; "merge adjacent", "burst", "cut", "remove and neighbours change", palindromic structure; n up to a few hundred (O(n³)) or a few thousand (O(n²)).
      - State-machine signals: a sequence processed in order, with a small set of modes and rules about switching between them (buy/sell/cooldown, at most k transactions, last action, parity).
    how: |-
      Longest palindromic subsequence, filled so shorter ranges are ready first (i from right to left, j from left to right):

      ```python
      def longest_palindromic_subsequence(s: str) -> int:
          n = len(s)
          dp = [[0] * n for _ in range(n)]           # dp[i][j] for s[i..j]
          for i in range(n - 1, -1, -1):
              dp[i][i] = 1
              for j in range(i + 1, n):
                  if s[i] == s[j]:
                      dp[i][j] = dp[i + 1][j - 1] + 2    # inner range is shorter: already done
                  else:
                      dp[i][j] = max(dp[i + 1][j], dp[i][j - 1])
          return dp[0][n - 1] if n else 0
      ```

      Split-point interval DP (bursting balloons): pad the array with 1 at both ends and let `dp[i][j]` be the best score for bursting everything strictly between `i` and `j`. Choose `k` as the **last** balloon burst in that open interval: when it bursts, its neighbours are exactly `i` and `j`, and the left and right sides were independent.

      ```python
      def max_burst_score(nums: list[int]) -> int:
          a = [1] + nums + [1]
          n = len(a)
          dp = [[0] * n for _ in range(n)]
          for length in range(2, n):                 # distance between the two open ends
              for i in range(n - length):
                  j = i + length
                  dp[i][j] = max(dp[i][k] + a[i] * a[k] * a[j] + dp[k][j] for k in range(i + 1, j))
          return dp[0][n - 1]                       # [3, 1, 5, 8] gives 167
      ```

      State machine for trading with a one-day cooldown after each sale:

      ```python
      import math

      def max_profit_with_cooldown(prices: list[int]) -> int:
          hold, sold, rest = -math.inf, -math.inf, 0   # best profit in each state after the previous day
          for p in prices:
              prev_sold = sold
              sold = hold + p                           # sell today: must have held yesterday
              hold = max(hold, rest - p)                # keep holding, or buy from a rested state
              rest = max(rest, prev_sold)               # yesterday's sale ends its cooldown today
          return max(sold, rest)                        # [1, 2, 3, 0, 2] gives 3
      ```

      Order inside the loop matters: each new value must be computed from the **previous day's** values, so save any value you overwrite before it is read (here `prev_sold`; `hold` reads the old `rest` because `rest` is updated last).
    mental_model: |-
      Interval DP: think of the last action inside a range, not the first. The last balloon burst, the last cut made, the last matrix multiplication: fixing the last step splits the range into independent sub-ranges whose answers are already known. State machine: draw the circles (states) and arrows (actions with their profit or cost) on paper; the code is one line per arrow, run once per day.
    tradeoffs: |-
      Interval DP is expensive: O(n³) limits n to a few hundred in Python, and the 2-D table is O(n²) memory. Memoised recursion on `(i, j)` is often easier to get right than the fill order, at the price of recursion overhead. State-machine DP is O(n × states) time and O(states) memory, and it generalises cleanly (k transactions become 2k states), but an incorrect update order silently lets an action happen twice in one day.
    mistakes:
      - Filling an interval table row by row from the top, so `dp[i + 1][j - 1]` is not ready yet; fill by increasing length or with i descending.
      - Choosing the first balloon to burst instead of the last, which leaves the two sides dependent on each other.
      - Forgetting the padding 1s at the ends in bursting problems.
      - In state machines, updating a state in place and then reading the new value for another state on the same day.
      - Initialising impossible states with 0 instead of negative infinity, which lets you "sell" a share you never bought.
    interview: |-
      For interval problems, say the state as a range and the choice as "the last operation inside the range", then give O(n³) and the fill order. For trading problems, draw the state diagram first and name each arrow; interviewers reward the diagram because it makes the cooldown, fee and transaction limits obvious. Expect follow-ups such as at most k transactions (2k states, O(n × k)), adding a fee (subtract it on sell), or reconstructing the actions.
    explain_it:
      - "Interval: the range state, the last-operation choice, and the fill order by length."
      - "State machine: the states, the arrows and their gains, and the initial values (negative infinity for impossible)."
      - Why each update uses the previous step's values.
      - "Complexity: O(n²) or O(n³) for interval DP; O(n × states) and O(states) space for state machines."
    example:
      language: python
      code: |-
        import math

        def max_profit_with_fee(prices: list[int], fee: int) -> int:
            hold, cash = -math.inf, 0
            for p in prices:
                hold, cash = max(hold, cash - p), max(cash, hold + p - fee)
            return cash
      explanation: "Two states, updated simultaneously from the previous day's values by tuple assignment. prices [1, 3, 2, 8, 4, 9] with fee 2 gives 8 (buy 1 sell 8, buy 4 sell 9). O(n) time, O(1) space."
    complexity: Longest palindromic subsequence O(n²) time and space; split-point interval DP O(n³) time, O(n²) space; state-machine DP O(n × states) time, O(states) space.
    edge_cases:
      - Empty input or a single element.
      - Prices that only fall (best profit 0, never trade).
      - Ranges of length 1 and 2, where the inner range is empty.
- key: dsa.dp_interval.check
  type: concept_check
  title: "Concept check: interval and state-machine DP"
  skills: [dp.interval_state_machine]
  minutes: 10
  difficulty: HARD
  body:
    intro: Use the lesson's functions for the traces.
    questions:
      - id: q1
        kind: single
        prompt: "What does `max_profit_with_cooldown([1, 2, 3, 0, 2])` return?"
        options: ["2", "3", "4", "5"]
        answer: [1]
        explanation: "Buy at 1, sell at 2, cool down on the day priced 3, buy at 0, sell at 2: 1 + 2 = 3. Ignoring the cooldown would allow buy 1, sell 3, buy 0, sell 2 = 4, which is the tempting wrong answer."
      - id: q2
        kind: single
        prompt: "In the cooldown machine, why is `hold` initialised to negative infinity rather than 0?"
        options:
          - To save memory
          - Holding a share before any purchase is impossible; 0 would let the first sell earn money from nothing
          - Because prices can be negative
          - It makes no difference
        answer: [1]
        explanation: "With hold = 0, the first day's sold = 0 + p is a profit from a share never bought. Impossible states must be unreachable, which negative infinity guarantees under max()."
      - id: q3
        kind: single
        prompt: Why does the bursting DP choose the LAST balloon to burst in an interval instead of the first?
        options:
          - It is faster
          - When k is last, its neighbours are the fixed ends i and j, and the two sides are independent subproblems
          - Choosing the first gives the same recurrence
          - Bursting order does not affect the score
        answer: [1]
        explanation: "If k bursts first, the balloons left and right of it become neighbours of each other, so the two sides interact and are not independent. Fixing the last one keeps both boundaries known: score a[i] × a[k] × a[j]."
      - id: q4
        kind: single
        prompt: "In `longest_palindromic_subsequence`, why does i run from n - 1 down to 0?"
        options:
          - It is an arbitrary choice
          - dp[i][j] reads dp[i + 1][...], a row below, which must already be filled
          - To handle empty strings
          - It makes the algorithm O(n)
        answer: [1]
        explanation: "dp[i][j] needs dp[i + 1][j - 1], dp[i + 1][j] and dp[i][j - 1]. Descending i fills row i + 1 first, and ascending j fills dp[i][j - 1] first. Filling by increasing length is an equally valid order."
      - id: q5
        kind: multi
        prompt: Which complexities are right?
        options:
          - Longest palindromic subsequence, O(n²) time
          - Bursting balloons, O(n³) time
          - Stock trading with at most k transactions as a state machine, O(n × k) time
          - Stock trading with cooldown, O(n²) time
        answer: [0, 1, 2]
        explanation: "The cooldown machine has three states updated in O(1) per day: O(n). With k transactions there are 2k states per day: O(n × k)."
      - id: q6
        kind: short
        prompt: Define the states and transitions for "at most two buy-sell transactions, no overlap".
        model_answer: "Four states after each day: buy1 (bought the first share), sell1 (completed one transaction), buy2 (holding the second share), sell2 (completed two). Per price p: buy1 = max(buy1, -p); sell1 = max(sell1, buy1 + p); buy2 = max(buy2, sell1 - p); sell2 = max(sell2, buy2 + p). Initialise buys to negative infinity and sells to 0; answer sell2. Updating in this order on the same day is safe because buying and selling at the same price adds zero profit. O(n) time, O(1) space."
        explanation: Each transaction adds two states; the same pattern gives O(n × k) for k transactions.
- key: dsa.dp_interval.exercise
  type: coding_exercise
  title: "Exercise: longest palindromic subsequence with its fill order explained"
  skills: [dp.interval_state_machine]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      Write `longest_pal_subseq(s)` returning the length of the longest subsequence of `s` that reads the same forwards and backwards. Explain the range state, the two transitions, and a fill order that guarantees every dependency is ready. Then answer: how many characters must be deleted at minimum to make `s` a palindrome?
    examples:
      - "longest_pal_subseq('bbbab') == 4   ('bbbb')"
      - "longest_pal_subseq('cbbd') == 2"
      - "longest_pal_subseq('a') == 1"
    constraints:
      - Up to 1000 characters.
    hints:
      - "dp[i][j] = answer for s[i..j]; a single character is a palindrome of length 1."
      - If the ends match, they wrap the best answer for the inside.
      - Otherwise drop one end or the other.
    solution:
      language: python
      code: |-
        def longest_pal_subseq(s):
            n = len(s)
            if n == 0:
                return 0
            dp = [[0] * n for _ in range(n)]
            for i in range(n - 1, -1, -1):
                dp[i][i] = 1
                for j in range(i + 1, n):
                    if s[i] == s[j]:
                        dp[i][j] = dp[i + 1][j - 1] + 2      # inner empty when j == i + 1: dp is 0
                    else:
                        dp[i][j] = max(dp[i + 1][j], dp[i][j - 1])
            return dp[0][n - 1]
      explanation: "O(n²) time and space; a one-row version uses O(n) space. The minimum deletions to make s a palindrome is n minus this length. It also equals the LCS of s and its reverse."
    rubric:
      - {key: state, label: "Defines dp[i][j] over the range s[i..j] with the length-1 base case", points: 2}
      - {key: transitions, label: Correct match and mismatch transitions including the length-2 case, points: 3}
      - {key: order, label: Justifies a fill order (i descending or by length) that has every dependency ready, points: 3}
      - {key: deletions, label: "Answers minimum deletions = n - LPS and states O(n²)", points: 2}
    follow_ups:
      - prompt: How does this relate to longest common subsequence?
        look_for: "LPS(s) = LCS(s, reversed s); same O(n²) complexity, a useful cross-check."
      - prompt: What changes for the longest palindromic substring (contiguous)?
        look_for: "Boolean dp[i][j] = s[i] == s[j] and dp[i+1][j-1], or expand around each of the 2n - 1 centres in O(n²) time and O(1) space."
- key: dsa.dp_interval.interview
  type: interview_question
  title: "Interview question: design a trading-rules DP from a state diagram"
  skills: [dp.interval_state_machine]
  minutes: 15
  difficulty: HARD
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 900}
  body:
    prompt: "Given daily prices, you may hold at most one share at a time, must wait one full day after selling before buying again, and pay a fixed fee on every sale. Explain how you would model this as a DP: draw the states, the transitions, the initial values, the update order and the complexity. No full code is needed."
    key_points:
      - "Names three states: holding, just sold (cooling down), and resting (free to buy)."
      - "Transitions: hold = max(hold, rest - p); sold = hold + p - fee; rest = max(rest, previous sold)."
      - Initialises impossible states (hold, sold) to negative infinity and rest to 0.
      - Explains that every update must use the previous day's values and saves the overwritten value or uses simultaneous assignment.
      - "States O(n) time and O(1) space and that the answer is max(sold, rest)."
    model_answer: |-
      I would draw three circles. Rest means no share and free to buy; hold means owning one share; sold means I sold today and must cool down tomorrow. Arrows: rest → rest (do nothing), rest → hold (buy, minus p), hold → hold (keep), hold → sold (sell, plus p minus the fee), sold → rest (the cooldown day passes). So for each price p, from the previous day's values: new_hold = max(hold, rest - p), new_sold = hold + p - fee, new_rest = max(rest, sold). Before the first day, rest = 0 and the other two are negative infinity, because I cannot hold or have just sold anything yet. I compute all three from the old values (simultaneous assignment) so no action happens twice in one day. The answer is max(sold, rest) after the last day; ending while holding is never better. That is O(n) time and O(1) space.
    pitfalls:
      - Writing the transitions without a diagram and losing the cooldown.
      - Charging the fee on both buy and sell.
    follow_ups:
      - prompt: Now allow at most k transactions. How do the states change?
        look_for: "Add the transaction count to the state: hold[t] and free[t] for t = 0..k; O(n × k) time and O(k) space; if k ≥ n/2 the limit does not bind and the unlimited version applies."
      - prompt: How would you reconstruct which days to buy and sell?
        look_for: "Store each day's state values (O(n) space) and walk backwards, choosing at each day the arrow that produced the current state's value."
