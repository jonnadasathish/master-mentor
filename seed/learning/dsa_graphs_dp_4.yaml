# ---------------------------------------------------------------------------------------------- tree DP
- key: dsa.dp_tree.lesson
  type: lesson
  title: DP on trees with post-order returns
  skills: [dp.tree, trees.path_depth]
  minutes: 25
  difficulty: HARD
  body:
    summary: Each node computes its answer from its children's answers, so a post-order traversal that returns a small tuple per node solves tree DPs in O(n).
    what: |-
      In **tree DP** the state lives on nodes: `f(node)` describes the best answer for the subtree rooted at that node, often split into a few cases (node taken / not taken, has camera / covered / needs cover). Because a subtree's answer depends only on its children's answers, a **post-order** traversal (children first, then the node) computes everything in one pass.

      Two recurring patterns:

      - **Return a tuple of cases**: e.g. `(best if node is taken, best if node is skipped)` for "no two adjacent nodes" problems.
      - **Return one thing, record another**: for path problems (diameter, maximum path sum), a node **returns** the best path going **down** into one child (so the parent can extend it) and **records** in an outer variable the best path that **bends** through the node (left + node + right), which cannot be extended upwards.
    why: |-
      Many tree questions are exponential if you try all subsets of nodes, but each node's decision only interacts with its parent and children. Tree DP captures that locality and gives O(n). It is also the clearest test of whether you understand "what a recursive call returns" versus "what the overall answer is", which is the most common source of wrong answers in tree problems.
    when: |-
      - "Choose nodes subject to a parent/child constraint" (independent set, vertex cover, cameras): return per-case values.
      - "Longest or best path anywhere in the tree" (diameter, max path sum): return the downward best, record the bending best globally.
      - "Answer for every node as the root" (sum of distances to all nodes): two passes, post-order then pre-order (rerooting).
      - General trees given as edge lists: same idea with an adjacency list and a `parent` argument to avoid walking back up.
    how: |-
      Maximum sum with no parent-child pair both taken (binary tree):

      ```python
      def rob_tree(root) -> int:
          def solve(node) -> tuple[int, int]:
              if node is None:
                  return 0, 0                               # (taken, skipped)
              lt, ls = solve(node.left)
              rt, rs = solve(node.right)
              taken = node.val + ls + rs                    # children must be skipped
              skipped = max(lt, ls) + max(rt, rs)           # children are free
              return taken, skipped
          return max(solve(root))
      ```

      Maximum path sum (any path, at least one node, values may be negative):

      ```python
      def max_path_sum(root) -> int:
          best = root.val
          def gain(node) -> int:
              nonlocal best
              if node is None:
                  return 0
              left = max(gain(node.left), 0)                # drop a negative branch
              right = max(gain(node.right), 0)
              best = max(best, node.val + left + right)     # path bending here: record, do not return
              return node.val + max(left, right)            # the parent can extend only one branch
          gain(root)
          return best
      ```
    mental_model: |-
      Each node is a manager who asks their direct reports for a short summary ("best if I am in, best if I am out"), combines the summaries in O(children) work, and hands one summary up. Nobody needs the whole org chart. For path problems, a manager also notes on a shared whiteboard "the best path through me", but can only hand up a path through one report, because a path cannot fork.
    tradeoffs: |-
      Recursive post-order is the clearest code but in CPython a skewed tree of 10⁴ nodes already exceeds the default recursion limit of 1000. Options: `sys.setrecursionlimit` (risky: the C stack can still overflow; running in a thread with a larger stack size is the usual workaround), or an iterative post-order (BFS or DFS order reversed, then process children before parents with arrays). Memoising on nodes with a dict also works for the "grandchildren" formulation of robbing but costs more memory and time than returning tuples.
    mistakes:
      - Returning the bending path (left + node + right) to the parent, which counts a forked path.
      - Not clamping negative branch gains to 0 in max path sum, or clamping the node's own value (the path must contain at least one node).
      - Initialising the global best to 0 when all values can be negative.
      - Recomputing children by calling the recursive function twice per child (exponential time).
      - In general trees, forgetting the parent check and recursing back up the edge you came from.
      - Recursion depth on degenerate trees.
    interview: |-
      Before coding, say exactly what the recursive function returns and what it records, and why they differ. Then give O(n) time and O(h) stack space (h up to n for a skewed tree). Follow-ups: return the chosen nodes, general trees from an edge list, iterative versions for deep trees, and rerooting for per-node answers.
    explain_it:
      - What each call returns (and why it is a tuple or a downward value).
      - What is recorded globally and why it cannot be returned.
      - The base case for an empty child.
      - "Complexity: O(n) time, O(h) recursion stack."
    example:
      language: python
      code: |-
        def diameter(root) -> int:
            """Number of edges on the longest path between any two nodes."""
            best = 0
            def height(node) -> int:                      # nodes on the longest downward path
                nonlocal best
                if node is None:
                    return 0
                left, right = height(node.left), height(node.right)
                best = max(best, left + right)            # edges on the path bending here
                return 1 + max(left, right)
            height(root)
            return best
      explanation: "For root 1 with children 2 and 3, where 2 has children 4 and 5, the diameter is 3 (4 → 2 → 1 → 3). O(n) time, O(h) stack."
    complexity: O(n) time (each node does work proportional to its number of children), O(h) recursion stack or O(n) for iterative arrays.
    internals: |-
      Rerooting in one sentence: a first post-order pass computes subtree answers; a second pre-order pass pushes "the answer from everything outside my subtree" down from parent to child, so every node's whole-tree answer is available in O(n) total instead of O(n²) for n separate traversals.
    edge_cases:
      - Empty tree (decide the return value explicitly).
      - Single node.
      - All negative values (max path sum is the largest single value).
      - Skewed trees (recursion depth).
- key: dsa.dp_tree.check
  type: concept_check
  title: "Concept check: tree DP"
  skills: [dp.tree]
  minutes: 9
  difficulty: HARD
  body:
    intro: "Trees are written as level-order lists with None for missing children, e.g. [3, 2, 3, None, 3, None, 1]."
    questions:
      - id: q1
        kind: single
        prompt: "What does `rob_tree` return for [3, 2, 3, None, 3, None, 1] (root 3; left child 2 with right child 3; right child 3 with right child 1)?"
        options: ["6", "7", "8", "9"]
        answer: [1]
        explanation: "Leaves give (3, 0) and (1, 0). Node 2 → (2, 3); node 3 → (3, 1). Root: taken = 3 + 3 + 1 = 7, skipped = max(2, 3) + max(3, 1) = 6. Answer 7 (root plus both grandchildren). 6 comes from forgetting the root-taken case."
      - id: q2
        kind: single
        prompt: "What does `max_path_sum` return for [-10, 9, 20, None, None, 15, 7]?"
        options: ["34", "42", "35", "52"]
        answer: [1]
        explanation: "At node 20 the bending path 15 + 20 + 7 = 42 is recorded. The root would bend 9 + (-10) + 35 = 34, which is worse. 52 is what you get if the bending value were returned upward and extended again, counting a forked path."
      - id: q3
        kind: single
        prompt: Why does `gain` return `node.val + max(left, right)` instead of `node.val + left + right`?
        options:
          - It is faster
          - A path continuing to the parent can include only one child branch; using both would make it fork
          - Because right is always smaller
          - To avoid negative numbers
        answer: [1]
        explanation: "A path passes through a node at most once, so a path that continues upward enters from one child only. left + node + right is a complete path that ends there, so it is recorded globally, not returned."
      - id: q4
        kind: single
        prompt: A binary tree is a single chain of 20000 nodes. What happens to the recursive solutions in CPython with default settings?
        options:
          - They run fine in O(n)
          - RecursionError, because the depth exceeds the default limit of 1000
          - They run in O(n²)
          - They return wrong answers silently
        answer: [1]
        explanation: "Depth equals the tree height, here 20000. Use an iterative post-order (process nodes in reversed BFS order with arrays) or raise the limit and run in a thread with a larger stack."
      - id: q5
        kind: multi
        prompt: "In the diameter function, which statements are true?"
        options:
          - "height returns the number of nodes on the longest downward path from the node"
          - best records left + right, the number of edges on the path bending at the node
          - The answer is the height of the root
          - Each node is visited once, so the time is O(n)
        answer: [0, 1, 3]
        explanation: "The root's height only covers paths through the root going down one side; the longest path may bend at a deeper node and never touch the root. That is why best is tracked separately."
      - id: q6
        kind: short
        prompt: Explain the difference between what a tree-DP function returns and what it records globally, using maximum path sum as the example.
        model_answer: "It returns the best downward path starting at the node and going into at most one child (node.val + max(left, right), with negative branches clamped to 0), because only that can be extended by the parent. It records globally the best path that bends at the node (node.val + left + right), which is a complete path and cannot be extended. The answer is the global best, not the root's return value."
        explanation: Separating "extendable" from "complete" answers is the core idea of every path-in-tree DP.
- key: dsa.dp_tree.exercise
  type: coding_exercise
  title: "Exercise: plan the team party without recursion"
  skills: [dp.tree]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      A company hierarchy is a tree: `boss[e]` is employee e's direct manager, or -1 for the head. Each employee has a fun score `fun[e]` (non-negative). Invite a set of employees with the maximum total fun such that no employee is invited together with their direct manager. Write `best_party(boss, fun)` without recursion (the hierarchy can be 10⁵ levels deep) and state the complexity.
    examples:
      - "best_party([-1, 0, 0, 1, 1, 2], [3, 2, 1, 10, 1, 1]) == 15   (invite 0, 3, 4 and 5)"
      - "best_party([-1], [5]) == 5"
      - "best_party([-1, 0, 1, 2], [1, 5, 1, 5]) == 10   (a chain: invite 1 and 3)"
    constraints:
      - Up to 10⁵ employees.
    hints:
      - Each employee needs two numbers - best for their subtree if they are invited, and if they are not.
      - Build the children lists, then a BFS order from the head; processing that order in reverse handles every child before its manager.
      - "invited = fun + sum of children's not-invited; not invited = sum of each child's better option."
    solution:
      language: python
      code: |-
        def best_party(boss, fun):
            n = len(boss)
            children = [[] for _ in range(n)]
            head = -1
            for e, b in enumerate(boss):
                if b == -1:
                    head = e
                else:
                    children[b].append(e)
            order = [head]
            i = 0
            while i < len(order):                        # BFS: managers before their reports
                order.extend(children[order[i]])
                i += 1
            invited = [0] * n
            not_invited = [0] * n
            for u in reversed(order):                    # reports before their managers
                invited[u] = fun[u] + sum(not_invited[c] for c in children[u])
                not_invited[u] = sum(max(invited[c], not_invited[c]) for c in children[u])
            return max(invited[head], not_invited[head])
      explanation: "Reversed BFS order is a valid post-order for this purpose: every child appears after its parent in BFS, so before it in the reversal. O(n) time and O(n) space, with no recursion."
    rubric:
      - {key: states, label: Two states per employee (invited / not invited) with correct transitions, points: 3}
      - {key: order, label: Processes children before managers without recursion, points: 3}
      - {key: answer, label: Returns the better of the head's two states, points: 1}
      - {key: complexity, label: "States O(n) time and space and why recursion was avoided", points: 2}
      - {key: tests, label: Checks the single-employee and chain cases, points: 1}
    follow_ups:
      - prompt: Return the guest list, not just the total.
        look_for: "Walk from the head in BFS order with a flag: if the parent was invited, the child is not; otherwise invite the child when invited[c] > not_invited[c]."
      - prompt: Fun scores can be negative. What changes?
        look_for: "Nothing structural: not inviting anyone is still allowed, so the not-invited state already handles it; invited[u] may be negative and simply loses the max."
