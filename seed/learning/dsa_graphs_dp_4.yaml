# Learning content: string and subsequence DP (LCS, edit distance, LIS), grid DP, interval and state-machine DP, DP on trees.
seed_version: seed-v2
content:
# ---------------------------------------------------------------------------------------------- string and subsequence DP
- key: dsa.dp_strings.lesson
  type: lesson
  title: "String DP: LCS, edit distance and LIS"
  skills: [dp.strings_subsequence, dp.fundamentals]
  minutes: 30
  difficulty: MEDIUM
  body:
    summary: "For two sequences, let dp[i][j] describe the first i items of one and the first j of the other; the last characters either match or force a choice. For one sequence, let dp[i] describe the best answer ending at i."
    what: |-
      Three classic sequence DPs cover most interview questions:

      - **Longest common subsequence (LCS)** of strings `a` and `b`: `dp[i][j]` = LCS length of `a[:i]` and `b[:j]`. If `a[i-1] == b[j-1]`, `dp[i][j] = dp[i-1][j-1] + 1`; otherwise `max(dp[i-1][j], dp[i][j-1])`.
      - **Edit distance** (Levenshtein): `dp[i][j]` = fewest insertions, deletions and replacements turning `a[:i]` into `b[:j]`. Base: `dp[i][0] = i`, `dp[0][j] = j`. If the last characters match, `dp[i-1][j-1]`; else `1 + min(dp[i-1][j] (delete), dp[i][j-1] (insert), dp[i-1][j-1] (replace))`.
      - **Longest increasing subsequence (LIS)**: `dp[i]` = length of the longest increasing subsequence ending at `i` = `1 + max(dp[k])` over `k < i` with `a[k] < a[i]`; O(n²). The **patience** method keeps `tails[L]` = smallest possible tail of an increasing subsequence of length L + 1 and updates it with binary search: O(n log n).

      A **subsequence** keeps order but may skip elements; a **substring** must be contiguous. That single word changes the transition.
    why: |-
      Diffs (`diff`, version control), spell correction, DNA alignment and fuzzy search are LCS and edit-distance problems; LIS appears in scheduling and in nested-envelope style problems. In interviews these are the canonical "2-D DP over prefixes", and once the prefix state is clear, many unfamiliar string problems (word break, interleaving strings, distinct subsequences) follow the same pattern.
    when: |-
      - Two strings or arrays and a question about matching, aligning, transforming or a common part: 2-D DP over prefix pairs, O(m × n).
      - One sequence, "longest/shortest subsequence with property P": `dp[i]` ending at `i`, or a 1-D DP over prefixes (word break: `dp[i]` = can `s[:i]` be segmented).
      - LIS with n up to 10⁵: O(n²) is too slow, use the tails array with `bisect`.
    how: |-
      ```python
      def lcs(a: str, b: str) -> int:
          m, n = len(a), len(b)
          dp = [[0] * (n + 1) for _ in range(m + 1)]       # row 0 and column 0: empty prefix
          for i in range(1, m + 1):
              for j in range(1, n + 1):
                  if a[i - 1] == b[j - 1]:
                      dp[i][j] = dp[i - 1][j - 1] + 1          # use the match
                  else:
                      dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])  # drop one last character
          return dp[m][n]

      def edit_distance(a: str, b: str) -> int:
          prev = list(range(len(b) + 1))                   # row for the empty prefix of a
          for i in range(1, len(a) + 1):
              cur = [i] + [0] * len(b)
              for j in range(1, len(b) + 1):
                  if a[i - 1] == b[j - 1]:
                      cur[j] = prev[j - 1]
                  else:
                      cur[j] = 1 + min(prev[j],             # delete a[i-1]
                                       cur[j - 1],          # insert b[j-1]
                                       prev[j - 1])         # replace
              prev = cur
          return prev[-1]

      from bisect import bisect_left

      def lis_length(nums: list[int]) -> int:
          tails: list[int] = []                            # tails[L] = smallest tail of a length L+1 run
          for x in nums:
              i = bisect_left(tails, x)                    # strictly increasing: replace first tail >= x
              if i == len(tails):
                  tails.append(x)
              else:
                  tails[i] = x
          return len(tails)
      ```
    mental_model: |-
      Put one string along the top and the other down the side. Each cell answers the question for "these two prefixes", and it only looks up, left, or diagonally up-left. A match is a diagonal step (both strings consume a character together); a mismatch means one string must give up its last character, which is a step up or left. The answer is in the bottom-right corner, and the path back from it spells out the alignment.
    tradeoffs: |-
      Full tables cost O(m × n) memory; two rows reduce it to O(min(m, n)) but lose the information needed to reconstruct the subsequence or the edit script (Hirschberg's algorithm recovers it in linear space at about twice the time, rarely needed in interviews). LIS: O(n²) DP is easy to reconstruct and to adapt (longest chain under any compatibility rule); the O(n log n) tails method is fast but `tails` is not itself a valid subsequence, and reconstruction needs extra parent bookkeeping.
    mistakes:
      - "Off-by-one between dp indices and string indices: dp[i][j] covers a[:i], so compare a[i-1] and b[j-1]."
      - Treating "substring" as "subsequence" or the reverse; longest common substring resets to 0 on a mismatch and takes the maximum over all cells.
      - "In edit distance, forgetting the base row and column (`dp[i][0] = i`), which makes deletions free."
      - "Using `bisect_right` for a strictly increasing LIS; it allows equal values (non-decreasing)."
      - Returning `tails` as the LIS itself.
      - In word break, testing every substring in O(n) and every split point, giving O(n³) without noticing; bound the inner loop by the longest dictionary word.
    interview: |-
      Draw the table for a three-letter example before coding; it makes the transition obvious to you and the interviewer. State the state precisely ("dp[i][j] is the edit distance between the first i letters of a and the first j of b"), explain each of the three edit operations as a move in the table, and give O(m × n) time with the two-row space optimisation. Expect: reconstruct the LCS or the edits, the O(n log n) LIS, and variants with weighted operations.
    explain_it:
      - State the prefix-pair state and the base row and column.
      - Explain the match case (diagonal) and the mismatch case (up, left, or diagonal + 1).
      - Say where the answer is and how to reconstruct the path.
      - "Complexity: O(m × n) time, O(m × n) or O(min(m, n)) space."
    example:
      language: python
      code: |-
        def word_break(s: str, words: list[str]) -> bool:
            vocab = set(words)
            longest = max(map(len, vocab), default=0)
            ok = [True] + [False] * len(s)          # ok[i]: s[:i] can be segmented
            for i in range(1, len(s) + 1):
                for k in range(max(0, i - longest), i):
                    if ok[k] and s[k:i] in vocab:
                        ok[i] = True
                        break
            return ok[len(s)]
      explanation: "A 1-D prefix DP. Bounding k by the longest word keeps it O(n × L) slices of length up to L, i.e. O(n × L²) time, instead of O(n³)."
    complexity: LCS and edit distance O(m × n) time, O(m × n) or O(min(m, n)) space; LIS O(n²) DP or O(n log n) with the tails array.
    internals: |-
      Why the tails method works: tails is always strictly increasing, and tails[L] is the smallest value that can end an increasing subsequence of length L + 1 among the elements seen so far. A new x either extends the longest run (append) or lowers the tail of the shortest run it can end (bisect_left position). Lowering a tail never hurts, because a smaller tail can be extended by at least as many future values. The length of tails is the LIS length even though its contents may mix different subsequences.
    edge_cases:
      - One or both strings empty (answer 0 for LCS; the other string's length for edit distance).
      - Identical strings (LCS = length, distance 0).
      - All-equal arrays for LIS (strict LIS is 1).
- key: dsa.dp_strings.visual
  type: visual_explanation
  title: "Visual: filling the LCS table for abcde and ace"
  skills: [dp.strings_subsequence]
  minutes: 7
  body:
    summary: "Rows are prefixes of ace, columns are prefixes of abcde. A match copies the up-left diagonal plus one; a mismatch takes the larger of up and left."
    frames:
      - caption: Row 0 and column 0 are the empty prefix, so they are all 0.
        diagram: |2-
                  ""   a   b   c   d   e
            ""     0   0   0   0   0   0
            a      0   .   .   .   .   .
            c      0   .   .   .   .   .
            e      0   .   .   .   .   .
      - caption: "Row a: a matches a (diagonal 0 + 1 = 1); every later cell takes max(up, left) = 1."
        diagram: |2-
                  ""   a   b   c   d   e
            ""     0   0   0   0   0   0
            a      0  [1]  1   1   1   1      a == a → dp[0][0] + 1
            c      0   .   .   .   .   .
            e      0   .   .   .   .   .
      - caption: "Row c: c matches c in column 3, so it takes the diagonal (row a, column b) = 1, plus 1 = 2."
        diagram: |2-
                  ""   a   b   c   d   e
            ""     0   0   0   0   0   0
            a      0   1  (1)  1   1   1
            c      0   1   1  [2]  2   2      c == c → diagonal 1 + 1
            e      0   .   .   .   .   .
      - caption: "Row e: only the last column matches; its diagonal (row c, column d) is 2, so the answer is 3."
        diagram: |2-
                  ""   a   b   c   d   e
            ""     0   0   0   0   0   0
            a      0   1   1   1   1   1
            c      0   1   1   2  (2)  2
            e      0   1   1   2   2  [3]     e == e → diagonal 2 + 1

            answer dp[3][5] = 3
      - caption: "Walk back from the corner: a diagonal step on each match spells the subsequence in reverse: e, c, a → ace."
        diagram: |2-
                  ""   a   b   c   d   e
            ""    [0]  0   0   0   0   0
            a      0  [1]←[1]  1   1   1
            c      0   1   1  [2]←[2]  2
            e      0   1   1   2   2  [3]

            match → go diagonal and emit;  mismatch → go to the larger of up/left
            15 cells, each O(1): O(m × n)
- key: dsa.dp_strings.check
  type: concept_check
  title: "Concept check: LCS, edit distance and LIS"
  skills: [dp.strings_subsequence]
  minutes: 10
  difficulty: MEDIUM
  body:
    intro: Sketch a small table for the tracing questions.
    questions:
      - id: q1
        kind: single
        prompt: What is the edit distance between "horse" and "ros"?
        options: ["2", "3", "4", "5"]
        answer: [1]
        explanation: "Replace h with r (rorse), delete r (rose), delete e (ros): 3. Fewer is impossible because only one letter of \"ros\" lines up and the lengths differ by two. 4 is what you get if you forget that replace is a single operation."
      - id: q2
        kind: single
        prompt: "In the edit-distance table, which neighbouring cell corresponds to inserting b[j-1] into a?"
        options: ["dp[i-1][j]", "dp[i][j-1]", "dp[i-1][j-1]", "dp[i+1][j]"]
        answer: [1]
        explanation: "After inserting b[j-1] at the end, it matches, so what remains is turning a[:i] into b[:j-1]: dp[i][j-1]. dp[i-1][j] is deletion of a[i-1], and the diagonal is replacement (or a free match)."
      - id: q3
        kind: single
        prompt: "Running `lis_length([3, 4, 1])` from the lesson, what is `tails` at the end, and is it a real subsequence?"
        options:
          - "[3, 4], a real subsequence"
          - "[1, 4], not a real subsequence (1 comes after 4)"
          - "[1], because 1 resets the run"
          - "[3, 4, 1]"
        answer: [1]
        explanation: "3 → [3]; 4 → [3, 4]; 1 replaces the first tail ≥ 1 → [1, 4]. The length 2 is correct, but [1, 4] is not in the array's order. Reconstruction needs parent indices."
      - id: q4
        kind: multi
        prompt: Which statements are true?
        options:
          - Longest common substring uses dp[i][j] = dp[i-1][j-1] + 1 on a match and 0 on a mismatch, taking the maximum over all cells
          - LCS can be computed in O(min(m, n)) extra space if only its length is needed
          - "The O(n log n) LIS uses bisect_right for strictly increasing subsequences"
          - Edit distance needs base cases dp[i][0] = i and dp[0][j] = j
        answer: [0, 1, 3]
        explanation: "For strictly increasing runs, an equal value must replace the existing tail rather than extend, which is bisect_left. bisect_right gives the longest non-decreasing subsequence."
      - id: q5
        kind: single
        prompt: Two strings of length 10⁴ each. What do the LCS table's time and memory look like in Python?
        options:
          - "10⁸ cell updates and a 10⁸-cell table: too much memory for a list of lists; use two rows"
          - "10⁴ updates, trivial"
          - "O(m + n), trivial"
          - "10⁸ updates but negligible memory"
        answer: [0]
        explanation: "m × n = 10⁸ cells. In CPython a list of lists that size needs about 800 MB for the 8-byte element pointers alone (64-bit build), before counting the int objects, and 10⁸ interpreted updates take far longer than a typical interview time limit. Two rows fix the memory; the time is the real limit at this size."
      - id: q6
        kind: short
        prompt: Explain how you reconstruct one LCS string from the full table.
        model_answer: "Start at dp[m][n]. If a[i-1] == b[j-1], that character is in the LCS: record it and move to (i-1, j-1). Otherwise move to whichever of dp[i-1][j] and dp[i][j-1] is larger (either on ties). Stop when i or j is 0, then reverse the recorded characters. O(m + n) extra time after the O(m × n) fill."
        explanation: The walk back only works with the full table; the two-row version does not keep the information.
- key: dsa.dp_strings.exercise
  type: coding_exercise
  title: "Exercise: return a longest common subsequence, not just its length"
  skills: [dp.strings_subsequence]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      Write `lcs_string(a, b)` that returns one longest common subsequence of two strings (any one is accepted if several exist). Explain the table, the reconstruction, and the time and space. Then say what would change if the question asked for the longest common contiguous substring.
    examples:
      - "lcs_string('abcde', 'ace') == 'ace'"
      - "lcs_string('AGGTAB', 'GXTXAYB') has length 4, for example 'GTAB'"
      - "lcs_string('abc', 'def') == ''"
    constraints:
      - Both strings up to 2000 characters.
    hints:
      - Fill the usual LCS length table first.
      - Walk back from the bottom-right corner; a match is a diagonal step that emits a character.
      - Collect characters in reverse and reverse once at the end, instead of prepending to a string.
    solution:
      language: python
      code: |-
        def lcs_string(a, b):
            m, n = len(a), len(b)
            dp = [[0] * (n + 1) for _ in range(m + 1)]
            for i in range(1, m + 1):
                for j in range(1, n + 1):
                    if a[i - 1] == b[j - 1]:
                        dp[i][j] = dp[i - 1][j - 1] + 1
                    else:
                        dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])
            out, i, j = [], m, n
            while i and j:
                if a[i - 1] == b[j - 1]:
                    out.append(a[i - 1])
                    i, j = i - 1, j - 1
                elif dp[i - 1][j] >= dp[i][j - 1]:
                    i -= 1
                else:
                    j -= 1
            return "".join(reversed(out))
      explanation: "O(m × n) time and space for the table, O(m + n) for the walk back. Longest common substring would instead set dp[i][j] = 0 on a mismatch and remember the cell with the maximum value; the substring ends there."
    rubric:
      - {key: table, label: Correct prefix-pair table with the empty-prefix row and column, points: 3}
      - {key: walk_back, label: Correct reconstruction that emits characters only on matches, points: 3}
      - {key: efficient_build, label: Builds the result in reverse and joins once (no quadratic string building), points: 1}
      - {key: complexity, label: "States O(m × n) time and space and why two rows are not enough here", points: 2}
      - {key: substring, label: Explains the substring variant correctly, points: 1}
    follow_ups:
      - prompt: How would you produce a line-by-line diff of two files with this?
        look_for: "Treat each line as a character (hash the lines), compute the LCS of the line sequences, and output lines not in the LCS as deletions or insertions while walking back."
      - prompt: The strings are 10⁵ characters long. What now?
        look_for: "O(m × n) is 10¹⁰, too slow. Mention that general LCS has no known strongly subquadratic algorithm; practical tools use Myers' O((m + n) × D) diff, fast when the difference D is small, or problem-specific structure."
- key: dsa.dp_strings.interview
  type: interview_question
  title: "Interview question: explain edit distance from scratch"
  skills: [dp.strings_subsequence]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 900}
  body:
    prompt: "A search feature should suggest the dictionary word closest to a misspelled query, where closeness is the minimum number of single-character insertions, deletions and replacements. Explain how you compute that distance between two words, including the state, the transitions, the base cases and the complexity, and how you would make suggestions fast enough over a large dictionary."
    key_points:
      - "State: dp[i][j] = distance between the first i characters of the query and the first j of the word."
      - "Base cases: dp[i][0] = i and dp[0][j] = j (delete or insert everything)."
      - "Transition: if the last characters match, dp[i-1][j-1]; else 1 + min of delete (dp[i-1][j]), insert (dp[i][j-1]) and replace (dp[i-1][j-1])."
      - "O(m × n) time per pair, O(min(m, n)) space with two rows."
      - Speeds up the dictionary search, for example by filtering candidates by length difference, stopping a row early once its minimum exceeds the current best, or using a BK-tree or trie traversal with the DP row.
    model_answer: |-
      I define dp[i][j] as the minimum edits to turn the first i letters of the query into the first j letters of the candidate. Turning a prefix into the empty string takes i deletions, and building a prefix from nothing takes j insertions, so row 0 and column 0 are 0..n and 0..m. For a cell, if the last letters are equal they cost nothing and I take the diagonal; otherwise I pay one for the cheapest of deleting the query's last letter (up), inserting the candidate's last letter (left) or replacing one with the other (diagonal). The answer is the bottom-right cell; each word pair costs O(m × n) with two rows of memory.

      For a large dictionary, comparing against every word is too slow, so I would prune: skip words whose length differs from the query by more than the best distance so far, abandon a row once its minimum exceeds the best (distances never decrease further down), and, if this is a hot path, walk a trie of the dictionary carrying one DP row per trie node so shared prefixes are computed once, or index words in a BK-tree, which uses the triangle inequality of the metric.
    pitfalls:
      - Mixing up which neighbour is insert and which is delete without being able to justify it.
      - Forgetting the base row and column.
    follow_ups:
      - prompt: Swapping two adjacent letters should count as one edit. How does the DP change?
        look_for: "Damerau (optimal string alignment) variant: add dp[i-2][j-2] + 1 when a[i-1] == b[j-2] and a[i-2] == b[j-1]."
      - prompt: Replacements cost 2 and insertions or deletions cost 1. What changes?
        look_for: "Only the weights in the transition; the structure is the same. With replace cost 2, replacing is never better than delete plus insert, so the distance becomes m + n - 2 × LCS."
      - prompt: Return the sequence of edits.
        look_for: Keep the full table and walk back from the corner, choosing a neighbour that produced the cell's value and recording the operation.
- key: dsa.dp_strings.guided
  type: guided_problem
  title: "Guided practice: longest common subsequence"
  skills: [dp.strings_subsequence]
  minutes: 30
  difficulty: MEDIUM
  problems: [40]
  body:
    guidance:
      - Draw the table for two three-letter strings before coding and fill it by hand.
      - Write the state as a comment, including the meaning of row 0 and column 0.
      - Code the full table, then reduce it to two rows and say what you lose.
      - Give O(m × n) time and the space of both versions.
    hints:
      - dp has (m + 1) × (n + 1) cells so the empty prefix has a row and a column.
      - Compare a[i-1] with b[j-1], not a[i] with b[j].
- key: dsa.dp_strings.timed
  type: timed_problem
  title: "Timed practice: edit distance, LIS and word segmentation"
  skills: [dp.strings_subsequence]
  minutes: 75
  difficulty: MEDIUM
  problems: [121, 120, 122]
  body:
    guidance:
      - For edit distance, state the three operations as table moves before coding.
      - For LIS, code the O(n²) version only if you are short on time; otherwise go straight to the tails array and explain bisect_left.
      - For word segmentation, define ok[i] over prefixes and bound the inner loop by the longest word.
      - Give the complexity of each first; aim for about 25 minutes per problem.
- key: dsa.dp_strings.cards
  type: revision_card
  title: "Recall: string and subsequence DP"
  skills: [dp.strings_subsequence]
  minutes: 5
  body:
    cards:
      - front: LCS transition?
        back: "Match → dp[i-1][j-1] + 1; else max(dp[i-1][j], dp[i][j-1])."
      - front: Edit distance base cases?
        back: "dp[i][0] = i and dp[0][j] = j."
      - front: Edit distance — which neighbour is insert, delete, replace?
        back: Left is insert, up is delete, diagonal is replace.
      - front: Longest common substring vs subsequence?
        back: Substring resets to 0 on a mismatch and takes the max over all cells.
      - front: O(n log n) LIS?
        back: "tails array; bisect_left for strict, replace or append; answer len(tails)."
      - front: Is the tails array an actual LIS?
        back: No — only its length is meaningful.

# ---------------------------------------------------------------------------------------------- grid DP
- key: dsa.dp_grid.lesson
  type: lesson
  title: "Grid DP: paths when moves only go right and down"
  skills: [dp.grid_paths, dp.fundamentals]
  minutes: 20
  difficulty: MEDIUM
  body:
    summary: "When every move goes right or down, the grid is a DAG; each cell's answer combines the cell above and the cell to the left, filled row by row."
    what: |-
      In a grid DP, `dp[r][c]` is the answer for paths from the start (usually the top-left) to cell `(r, c)`. If moves only go **right or down**, a cell can only be entered from above or from the left, so:

      - **Count paths**: `dp[r][c] = dp[r-1][c] + dp[r][c-1]` (0 for blocked cells).
      - **Minimum path sum**: `dp[r][c] = grid[r][c] + min(dp[r-1][c], dp[r][c-1])`.
      - **Maximum collected**: the same with `max`, treating unreachable cells specially.

      The first row and first column have only one way in, so initialise them separately (or pad the table with a sentinel row and column).
    why: |-
      Grid path problems are the most visual DP family and a common interview warm-up: robot paths, minimum cost through a matrix, maximum square of ones, dungeon health. They also teach the key question for any grid problem: **can paths go back?** If moves are restricted to right and down, there are no cycles and DP works; if moves go in all four directions with costs, cycles exist and you need a shortest-path algorithm instead.
    when: |-
      - Moves restricted to a fixed set of "forward" directions (right/down, or down/down-left/down-right): grid DP.
      - Four-directional moves but a **strictly increasing** constraint (longest increasing path): still a DAG, so memoised DFS works in O(R × C).
      - Four-directional moves with costs and no monotone constraint: Dijkstra or BFS, not DP.
      - The constraint depends on the future (minimum starting health so you never drop to zero): fill **backwards** from the target.
    how: |-
      ```python
      def min_path_sum(grid: list[list[int]]) -> int:
          rows, cols = len(grid), len(grid[0])
          dp = [0] * cols                       # dp[c] = best sum to (current row, c)
          for r in range(rows):
              for c in range(cols):
                  if r == 0 and c == 0:
                      dp[c] = grid[0][0]
                  elif r == 0:
                      dp[c] = dp[c - 1] + grid[r][c]            # only from the left
                  elif c == 0:
                      dp[c] = dp[c] + grid[r][c]                # only from above (old dp[c])
                  else:
                      dp[c] = min(dp[c], dp[c - 1]) + grid[r][c]  # above vs left
          return dp[-1]
      ```

      The one-row trick: before `dp[c]` is overwritten it still holds the value for the cell **above**, and `dp[c - 1]` has already been updated to the cell on the **left** in the current row. That is exactly the two neighbours the transition needs.

      Counting paths in an empty R × C grid has a closed form: the path is R - 1 downs and C - 1 rights in some order, so `math.comb(R + C - 2, R - 1)`; for a 3 × 7 grid that is C(8, 2) = 28. With obstacles, use the DP.
    mental_model: |-
      Water poured into the top-left corner that can only flow right or down. Each cell receives from at most two pipes (above and left) and passes its result on. Filling row by row, left to right, is pouring in the only order where both pipes into a cell are already full.
    tradeoffs: |-
      A full table makes reconstruction (which path?) easy; the one-row version uses O(C) memory (choose the shorter dimension as the row) but cannot reconstruct the path. Mutating the input grid in place saves memory but destroys it; ask first. For the empty grid count, the closed form is O(R + C) with exact Python integers, but it breaks as soon as obstacles appear.
    mistakes:
      - Initialising the whole first row or column as reachable when an obstacle sits in it; everything after the obstacle in that row or column is unreachable.
      - Forgetting that the start cell itself may be blocked (answer 0 paths or -1).
      - "Using 0 for \"unreachable\" in a max-collect DP where 0 is also a valid total; use None or a large negative sentinel."
      - Applying grid DP to a problem that allows moving up or left, where cycles make the fill order invalid.
      - "Mixing up `dp[r-1][c]` (above) and `dp[r][c-1]` (left) when converting to one row."
    interview: |-
      Say "moves only go right and down, so there are no cycles and each cell depends on the cell above and the cell to the left". Write the transition and the first row and column, give O(R × C) time, then offer the O(C)-space version. Follow-ups: obstacles, path reconstruction, two robots collecting at once (a 3-D DP over the step number and both columns), and what changes with four-directional moves.
    explain_it:
      - Why right/down moves make the grid a DAG.
      - The transition and the first row and column.
      - The fill order and the one-row space optimisation.
      - "Complexity: O(R × C) time, O(C) space."
    example:
      language: python
      code: |-
        def count_paths(blocked: list[list[bool]]) -> int:
            cols = len(blocked[0])
            ways = [0] * cols
            ways[0] = 1                                   # one way to stand on the start
            for row in blocked:
                for c in range(cols):
                    if row[c]:
                        ways[c] = 0                       # no path ends on a blocked cell
                    elif c > 0:
                        ways[c] += ways[c - 1]            # above (old ways[c]) + left
            return ways[-1]
      explanation: "With a block in the middle of a 3 × 3 grid the answer is 2. A blocked start gives 0 because ways[0] is reset on the first row. O(R × C) time, O(C) space."
    complexity: O(R × C) time; O(R × C) space with the full table, O(min(R, C)) with one row.
    edge_cases:
      - 1 × 1 grid (the start is the end).
      - Single row or single column (exactly one path unless blocked).
      - Blocked start or blocked end.
      - Negative cell values in min-sum (still fine for DP because there are no cycles).
- key: dsa.dp_grid.check
  type: concept_check
  title: "Concept check: grid DP"
  skills: [dp.grid_paths]
  minutes: 8
  difficulty: MEDIUM
  body:
    intro: Assume moves go right or down unless the question says otherwise.
    questions:
      - id: q1
        kind: single
        prompt: How many right/down paths cross an empty grid with 3 rows and 7 columns?
        options: ["21", "28", "35", "10"]
        answer: [1]
        explanation: "Every path is 2 downs and 6 rights in some order: C(8, 2) = 28. 21 is C(7, 2), what you get by forgetting one move."
      - id: q2
        kind: single
        prompt: "What does `min_path_sum([[1, 3, 1], [1, 5, 1], [4, 2, 1]])` return?"
        options: ["7", "8", "6", "12"]
        answer: [0]
        explanation: "The path 1 → 3 → 1 → 1 → 1 sums to 7. The greedy choice of the smaller neighbour at each step (down to 1, then right to 5 or down to 4) gives a worse total, which is why every cell must compare both incoming paths."
      - id: q3
        kind: single
        prompt: "In the one-row version, at the moment `dp[c] = min(dp[c], dp[c - 1]) + grid[r][c]` runs, what do `dp[c]` and `dp[c - 1]` hold?"
        options:
          - Both hold values from the previous row
          - "dp[c] holds the cell above (previous row); dp[c - 1] holds the cell to the left (current row)"
          - "dp[c] holds the cell to the left; dp[c - 1] the cell above"
          - Both hold values from the current row
        answer: [1]
        explanation: "Left-to-right filling has already overwritten dp[c - 1] in this row, while dp[c] has not been touched yet in this row. That is why the compression works without a second array."
      - id: q4
        kind: multi
        prompt: Which problems can be solved with a DP that fills cells in a fixed order?
        options:
          - Cheapest path moving only right or down
          - Cheapest path moving in all four directions with positive costs
          - Longest path that moves in four directions but must strictly increase in value
          - Minimum starting health to cross a dungeon moving right or down
        answer: [0, 2, 3]
        explanation: "Strictly increasing values rule out cycles, so memoised DFS (a DP over the DAG) works. The dungeon is DP filled backwards from the exit. Free four-directional movement with costs has cycles, so the dependency order is unknown in advance: use Dijkstra."
      - id: q5
        kind: single
        prompt: "In the `count_paths` example, the first row is [False, True, False] (a block in the middle). What is `ways` after the first row?"
        options: ["[1, 0, 0]", "[1, 0, 1]", "[1, 1, 1]", "[0, 0, 0]"]
        answer: [0]
        explanation: "ways[0] = 1; ways[1] is blocked → 0; ways[2] = 0 + ways[1] = 0. Cells after a block in the first row are unreachable. Initialising the whole first row to 1 is the classic bug, giving [1, 0, 1]."
      - id: q6
        kind: short
        prompt: Why does the minimum-starting-health dungeon problem fill the table from the bottom-right instead of the top-left?
        model_answer: "The quantity you need at a cell depends on what happens after it, not before it: the health required on entering (r, c) is max(1, min(need[r+1][c], need[r][c+1]) - grid[r][c]). Going forwards you would have to track two things at once (current health and the lowest point so far), which is not a single optimal value per cell. Going backwards, each cell has one well-defined optimum."
        explanation: Choosing the direction so that each cell's state is a single number is a recurring DP design decision.
- key: dsa.dp_grid.exercise
  type: coding_exercise
  title: "Exercise: collect the most coins on a blocked floor"
  skills: [dp.grid_paths]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      A robot starts at the top-left cell of a grid and must reach the bottom-right, moving only right or down. Each cell holds a non-negative number of coins, or -1 for a blocked cell. Write `max_coins(grid)` returning the most coins the robot can collect, or -1 if the bottom-right cannot be reached (or the start is blocked). Use O(cols) extra space and state the complexity.
    examples:
      - "max_coins([[0, 3, 1], [2, -1, 4], [1, 6, 0]]) == 9   (down, down, right, right)"
      - "max_coins([[1, -1], [-1, 2]]) == -1"
      - "max_coins([[5]]) == 5"
    constraints:
      - Up to 1000 × 1000 cells.
    hints:
      - Zero coins is a valid total, so you need a separate marker for "unreachable".
      - Each cell takes the better of the reachable cells above and to the left.
      - One row is enough if you fill left to right.
    solution:
      language: python
      code: |-
        def max_coins(grid):
            cols = len(grid[0])
            NONE = -1                                    # unreachable marker (totals are >= 0)
            best = [NONE] * cols
            for r, row in enumerate(grid):
                for c, coins in enumerate(row):
                    if coins == -1:
                        best[c] = NONE
                        continue
                    if r == 0 and c == 0:
                        best[c] = coins
                        continue
                    above = best[c]                      # previous row's value, not yet overwritten
                    left = best[c - 1] if c > 0 else NONE
                    prev = max(above, left)
                    best[c] = prev + coins if prev != NONE else NONE
            return best[-1]
      explanation: "Totals are never negative, so -1 is a safe unreachable marker and max() ignores it whenever a real neighbour exists. O(R × C) time, O(C) space."
    rubric:
      - {key: transition, label: "Takes the max of above and left and adds the cell's coins", points: 3}
      - {key: unreachable, label: Distinguishes unreachable from zero coins and propagates blocks correctly, points: 3}
      - {key: start_end, label: Handles a blocked start and an unreachable end, points: 2}
      - {key: space, label: "Uses one row and states O(R × C) time, O(C) space", points: 2}
    follow_ups:
      - prompt: Return the path as a string of R and D moves.
        look_for: Keep the full table (or a parent choice per cell) and walk back from the end, choosing the neighbour that produced the value; reverse the moves.
      - prompt: Two robots start at the top-left at the same time and both go to the bottom-right; a coin can be collected once. What state do you need?
        look_for: "DP over step number t and the two robots' columns (rows follow from t): dp[t][c1][c2], adding the coins of both cells once if they coincide; O((R + C) × C²)."
- key: dsa.dp_grid.guided
  type: guided_problem
  title: "Guided practice: counting paths and cheapest path"
  skills: [dp.grid_paths]
