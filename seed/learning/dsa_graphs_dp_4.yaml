- key: dsa.dp_grid.timed
  type: timed_problem
  title: "Timed practice: longest increasing path in a matrix"
  skills: [dp.grid_paths]
  minutes: 40
  difficulty: HARD
  problems: [124]
  body:
    guidance:
      - In the first two minutes, explain why four-directional moves are fine here (strictly increasing values mean no cycles, so the cells form a DAG).
      - Use memoised DFS where each cell returns the longest increasing path starting from it.
      - Mention the recursion depth risk and the iterative alternative (topological order by value, or Kahn's on the increasing-edge DAG).
