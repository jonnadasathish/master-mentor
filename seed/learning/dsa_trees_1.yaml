- key: dsa.bs_answer.interview
  type: interview_question
  title: "Interview question: is binary search on the answer valid here?"
  skills: [binary_search.answer_space]
  minutes: 12
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 720}
  body:
    prompt: |-
      For each task, say whether binary search on the answer applies, and if so give the range, the check and the complexity:

      - (a) the minimum number of identical workers so that n independent jobs with given durations all finish within T hours, when each job runs on one worker;
      - (b) the largest integer x such that x² ≤ N, for N up to 10¹⁸;
      - (c) the length of the longest subarray whose sum equals exactly S, values possibly negative.
    key_points:
      - "(a) monotonic (more workers never hurts), range 1..n, but the check is bin packing, which is NP-hard in general; a greedy check is only a heuristic."
      - "(b) applies; x² <= N is true-then-false, range 0..10⁹ (or N), last-true template, about 30 to 60 iterations of O(1)."
      - "(c) does not apply: a length L working says nothing about L + 1 or L - 1; use prefix sums with a hash map instead."
      - Gives the general rule that the check must be both correct and monotonic before the template is useful.
    model_answer: "(a) Feasibility is monotonic in the number of workers, but checking whether jobs fit into k bins of size T is bin packing, so binary search only helps if the check is solved exactly (backtracking for small n) or approximated knowingly. (b) Classic last-true search for an integer square root with O(1) checks; Python also offers math.isqrt. (c) Not monotonic, so binary search can skip the answer; a prefix-sum hash map gives O(n)."
    pitfalls:
      - Applying the template because the answer is numeric, without checking monotonicity.
      - Missing that a correct check can itself be the hard part of the problem.
    follow_ups:
      - prompt: For (b), why is hi = N a poor but still correct bound?
        look_for: It costs about log₂(10¹⁸) ≈ 60 iterations instead of 30, which is negligible; correctness only needs the answer inside the range.
      - prompt: If the jobs in (a) had to run in the given order on consecutive workers, what changes?
        look_for: Then a greedy contiguous packing is an exact check, as in split array largest sum.
