# ---------------------------------------------------------------------------------------------- sorting algorithms
- key: dsa.sorting.lesson
  type: lesson
  title: Merge sort, quicksort, quickselect and counting sort
  skills: [sorting.algorithms, dsa.complexity_analysis]
  minutes: 30
  difficulty: MEDIUM
  body:
    summary: Know three sorts well — merge sort (stable, guaranteed n log n), quicksort and its quickselect cousin (in place, expected linear selection), and counting sort (linear for small value ranges).
    what: |-
      - **Merge sort** splits the array in half, sorts each half recursively and merges two sorted halves in linear time. Stable, O(n log n) always, O(n) extra memory.
      - **Quicksort** partitions around a pivot (smaller left, larger right) and recurses on both sides. In place, O(n log n) expected with a random pivot, O(n²) worst case, not stable.
      - **Quickselect** partitions once and recurses into **one** side only, to find the k-th smallest element in O(n) expected time.
      - **Counting sort** counts occurrences of each value in a small range `[0, k)` and rebuilds the output in O(n + k). It does not compare elements.
      - **Heap sort** builds a heap and pops n times: O(n log n) worst case, O(1) extra, not stable.

      CPython's `list.sort` and `sorted` use a stable, adaptive merge-based algorithm (Timsort family): O(n log n) worst case and close to O(n) on input that is already mostly sorted.
    why: |-
      You will rarely hand-write a sort in production, but the ideas reappear constantly: merging is how you combine sorted runs, sorted files and K sorted lists; partitioning is how you select the k-th element or split by a condition in place; counting is how you beat n log n when values are small integers. Interviews test these as "sort without the built-in", "k-th largest", "sort three colours in one pass" and "count inversions".
    when: |-
      - Need stability, linked lists or external (on-disk) data: merge sort.
      - Need in-place sorting with low memory: quicksort or heap sort.
      - Need only the k-th element or the k smallest, unordered: quickselect.
      - Values are integers in a small range (ages, grades, three colours): counting sort.
      - Everything else in Python: `sorted(data, key=...)`.
    how: |-
      **Merge** two sorted lists by repeatedly taking the smaller head; on ties take from the left list to stay stable:

      ```python
      def merge_sort(a: list[int]) -> list[int]:
          if len(a) <= 1:
              return a
          mid = len(a) // 2
          left, right = merge_sort(a[:mid]), merge_sort(a[mid:])
          out, i, j = [], 0, 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:        # <= keeps equal elements in original order
                  out.append(left[i]); i += 1
              else:
                  out.append(right[j]); j += 1
          out.extend(left[i:]); out.extend(right[j:])
          return out
      ```

      **Partition** (Lomuto): walk `j` across the range, keeping everything left of `i` smaller than the pivot; finally put the pivot at `i`. Quicksort recurses on `[lo, i - 1]` and `[i + 1, hi]`; quickselect recurses only into the side that contains index k.

      **Counting sort**: `count[v] += 1` for each value, then emit each value `count[v]` times (or, for records, turn counts into prefix-sum positions and place items from the end to keep it stable).
    mental_model: |-
      Merge sort does its work on the way **up** (merging), quicksort does it on the way **down** (partitioning). Merge sort's recursion tree is always balanced; quicksort's is balanced only if pivots land near the middle, which a random pivot makes very likely.
    tradeoffs: |-
      Merge sort is predictable but allocates O(n). Quicksort is in place and cache-friendly but has an O(n²) worst case on sorted input with a fixed first/last pivot and is not stable. Quickselect is O(n) expected but O(n²) worst; the median-of-medians pivot gives a guaranteed O(n) at a large constant factor. Counting sort is O(n + k), which is only a win when k is not much larger than n. Any comparison sort needs Ω(n log n) comparisons in the worst case.
    mistakes:
      - Using `<` instead of `<=` in the merge, which makes merge sort unstable.
      - Always picking the first or last element as pivot, giving O(n²) and O(n) recursion depth on sorted input.
      - Slicing inside quicksort recursion (`a[:p]`), which silently costs O(n) memory per level and loses the in-place property.
      - Recursing into both sides in quickselect, which turns it back into quicksort (O(n log n)).
      - Using counting sort when values range up to 10⁹; the count array alone is too large.
    interview: |-
      Expect "implement merge sort or quicksort", "find the k-th largest without sorting everything", "sort an array of 0s, 1s and 2s in one pass" and "count pairs i < j with a[i] > a[j]" (merge sort counting). Always state stability, extra space and the worst case, including the recursion stack: merge sort O(log n) stack plus O(n) buffers; quicksort O(log n) expected stack, O(n) worst unless you recurse into the smaller side first and loop on the larger.
    explain_it:
      - Which sort you chose and the property that decided it (stability, memory, value range).
      - Best, expected and worst time, and what input triggers the worst case.
      - Extra space including the recursion stack.
      - Why comparison sorting cannot beat n log n and how counting sort avoids that bound.
    example:
      language: python
      code: |-
        import random

        def kth_smallest(a: list[int], k: int) -> int:
            """k is 0-based. Rearranges a in place. Expected O(n)."""
            lo, hi = 0, len(a) - 1
            while True:
                p = random.randint(lo, hi)            # random pivot defeats sorted inputs
                a[p], a[hi] = a[hi], a[p]
                pivot, i = a[hi], lo
                for j in range(lo, hi):               # Lomuto partition
                    if a[j] < pivot:
                        a[i], a[j] = a[j], a[i]
                        i += 1
                a[i], a[hi] = a[hi], a[i]             # pivot now at its final index i
                if i == k:
                    return a[i]
                if i < k:
                    lo = i + 1                        # only one side survives
                else:
                    hi = i - 1
      explanation: "Each round discards one side; expected work is n + n/2 + n/4 + … ≈ 2n, so O(n) expected, O(n²) worst. Iterative, so O(1) extra space. With many equal values, a three-way partition avoids degenerate rounds."
    complexity: "Merge sort O(n log n) time, O(n) space; quicksort O(n log n) expected, O(n²) worst, O(log n) expected stack; quickselect O(n) expected; counting sort O(n + k) time and space; heap sort O(n log n) time, O(1) space."
    internals: |-
      The Ω(n log n) lower bound: a comparison sort is a binary decision tree whose leaves are the n! possible orderings, so its height is at least log₂(n!), which is Θ(n log n). Counting sort and radix sort escape the bound because they inspect values directly instead of comparing pairs.
    edge_cases:
      - Empty and one-element arrays.
      - All elements equal, which makes a two-way Lomuto partition degrade to O(n²); use a three-way partition.
      - Already sorted or reverse-sorted input with a fixed pivot.
      - Negative values in counting sort; offset them by the minimum.
- key: dsa.sorting.check
  type: concept_check
  title: "Concept check: sorting algorithms"
  skills: [sorting.algorithms]
  minutes: 10
  difficulty: MEDIUM
  body:
    intro: Trace the partition by hand; the other questions are about the properties you must state in an interview.
    questions:
      - id: q1
        kind: single
        prompt: "After `partition(a, 0, 4)` on `a = [9, 3, 7, 1, 5]`, what are `a` and the returned index?"
        code:
          language: python
          code: |-
            def partition(a, lo, hi):
                pivot = a[hi]
                i = lo
                for j in range(lo, hi):
                    if a[j] < pivot:
                        a[i], a[j] = a[j], a[i]
                        i += 1
                a[i], a[hi] = a[hi], a[i]
                return i
        options: ["[3, 1, 5, 9, 7] and 2", "[1, 3, 5, 7, 9] and 2", "[3, 1, 5, 7, 9] and 2", "[3, 1, 7, 9, 5] and 1"]
        answer: [0]
        explanation: "Pivot 5. j=1 swaps 3 to index 0, j=3 swaps 1 to index 1 (giving [3, 1, 7, 9, 5]), then the pivot swaps with index 2, giving [3, 1, 5, 9, 7]. Partition only guarantees smaller-left and larger-right, not a sorted array, which is why [1, 3, 5, 7, 9] is tempting but wrong."
      - id: q2
        kind: multi
        prompt: Which of these are stable?
        options:
          - "Merge sort that takes from the left half on ties"
          - "Heap sort"
          - "Python's sorted()"
          - "In-place quicksort with Lomuto partition"
        answer: [0, 2]
        explanation: "Merge sort with <= and CPython's sort keep equal elements in input order. Heap sort and in-place partitioning move equal elements past each other through long-distance swaps."
      - id: q3
        kind: single
        prompt: Quicksort that always picks the last element as pivot runs on an already sorted array of n elements. Time and recursion depth?
        options: ["O(n log n) time, O(log n) depth", "O(n²) time, O(n) depth", "O(n²) time, O(log n) depth", "O(n) time, O(1) depth"]
        answer: [1]
        explanation: "Every partition puts all other elements on one side, so sizes go n, n-1, n-2…: O(n²) comparisons and n nested calls. In CPython that depth also hits the default recursion limit of 1000 quickly."
      - id: q4
        kind: single
        prompt: Expected time of quickselect with a random pivot for the k-th smallest of n elements?
        options: ["O(log n)", "O(n)", "O(n log n)", "O(k log n)"]
        answer: [1]
        explanation: "It recurses into one side only; expected sizes shrink geometrically (n + n/2 + n/4 …), summing to O(n). O(n log n) is quicksort, which recurses into both sides."
      - id: q5
        kind: single
        prompt: 10⁶ exam scores are integers from 0 to 100. Which sort is asymptotically best and what does it cost?
        options: ["Merge sort, O(n log n)", "Counting sort, O(n + k) with k = 101", "Quicksort, O(n)", "Heap sort, O(n)"]
        answer: [1]
        explanation: "With only 101 possible values, counting does about n + 101 steps. A comparison sort cannot beat n log n; quicksort and heap sort are not O(n)."
      - id: q6
        kind: short
        prompt: Why can no comparison-based sort guarantee better than O(n log n), and why does that not apply to counting sort?
        model_answer: "A comparison sort must distinguish all n! orderings using yes/no comparisons, so its decision tree has at least n! leaves and height at least log₂(n!) = Θ(n log n). Counting sort reads values as array indexes instead of comparing pairs, so the decision-tree argument does not apply; its cost depends on the value range k."
        explanation: The lower bound is about the comparison model, not about sorting in general.
- key: dsa.sorting.exercise
  type: coding_exercise
  title: "Exercise: count inversions with merge sort"
  skills: [sorting.algorithms, recursion.fundamentals]
  minutes: 25
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1500}
  body:
    prompt: |-
      An inversion is a pair of indexes `i < j` with `a[i] > a[j]`. It measures how far a ranking is from sorted. Write `count_inversions(a)` in O(n log n). The brute force over all pairs is O(n²).
    examples:
      - "count_inversions([2, 4, 1, 3, 5]) == 3  (2>1, 4>1, 4>3)"
      - "count_inversions([1, 2, 3]) == 0"
      - "count_inversions([3, 2, 1]) == 3"
    constraints:
      - Up to 10⁵ integers, duplicates allowed (equal values are not inversions).
    hints:
      - Inversions = inversions inside the left half + inside the right half + pairs that cross the middle.
      - While merging, when you take right[j] before left[i], every remaining element of the left half is greater than right[j].
      - "Use <= when taking from the left so equal values are not counted."
    solution:
      language: python
      code: |-
        def count_inversions(a: list[int]) -> int:
            def sort_count(lo: int, hi: int) -> int:     # sorts a[lo:hi] in place, returns inversions
                if hi - lo <= 1:
                    return 0
                mid = (lo + hi) // 2
                count = sort_count(lo, mid) + sort_count(mid, hi)
                merged, i, j = [], lo, mid
                while i < mid and j < hi:
                    if a[i] <= a[j]:
                        merged.append(a[i]); i += 1
                    else:
                        merged.append(a[j]); j += 1
                        count += mid - i                 # a[i..mid-1] are all > a[j]
                merged.extend(a[i:mid]); merged.extend(a[j:hi])
                a[lo:hi] = merged
                return count
            a = list(a)                                  # do not mutate the caller's list
            return sort_count(0, len(a))
      explanation: O(n log n) time, O(n) extra for merge buffers, O(log n) recursion depth.
    rubric:
      - key: correct
        label: "Correct counts including duplicates and empty input"
        points: 4
      - key: cross_count
        label: "Adds mid minus i when taking from the right half"
        points: 3
      - key: no_mutation
        label: "Does not modify the caller's list or says it does"
        points: 1
      - key: complexity
        label: "States O(n log n) time and O(n) space with O(log n) stack"
        points: 2
    follow_ups:
      - prompt: How would you count, for each element, how many smaller elements are to its right?
        look_for: Merge sort over indexes, adding the number of right-half elements already taken to each left element; or a Fenwick tree over compressed values.
      - prompt: What is the maximum number of inversions for n elements?
        look_for: n(n-1)/2, a reverse-sorted array; it does not fit the answer into O(n) output, but the count is a single integer.
