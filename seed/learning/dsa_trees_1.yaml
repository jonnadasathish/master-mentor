# Learning content, DSA (1/4): binary search beyond the basics (rotated arrays, peaks, search on the answer), sorting algorithms and intervals.
seed_version: seed-v2
content:
# ---------------------------------------------------------------------------------------------- binary search: boundaries
- key: dsa.bs_boundaries.lesson
  type: lesson
  title: Boundary binary search on rotated arrays, peaks and predicates
  skills: [binary_search.boundaries, binary_search.basic]
  minutes: 25
  difficulty: MEDIUM
  body:
    summary: Turn every boundary question into "find the first index where a monotonic predicate becomes true", then prove each update keeps that index in range.
    what: |-
      A boundary search does not look for a value; it looks for the **first (or last) index where a yes/no predicate flips**. Lower bound, upper bound, the minimum of a rotated array and a peak element are all the same search with a different predicate.

      - **Lower bound**: first `i` with `a[i] >= x` (Python `bisect.bisect_left`).
      - **Upper bound**: first `i` with `a[i] > x` (Python `bisect.bisect_right`). The count of `x` is `bisect_right - bisect_left`.
      - **Rotated sorted array** (distinct values): the predicate `a[i] <= a[-1]` is false on the left (larger) segment and true on the right segment, so its first true index is the minimum.
      - **Peak element** (neighbours differ, imaginary minus infinity outside the array): the predicate `a[i] > a[i + 1]` is not globally monotonic, but "an uphill step to the right guarantees a peak on the right" is enough to discard half each time.
    why: |-
      The basic closed-interval template answers "is x present?". Real questions ask for positions: the first timestamp at or after T, where a sorted log was rotated, the first failing build. Getting these right needs a template that never returns early and an invariant that says exactly which index the range still contains.
    when: |-
      - The question says first, last, smallest index, insertion point, or "how many are less than x".
      - A sorted array has been rotated, or is made of two sorted pieces.
      - Any local comparison (mid with mid + 1, or mid with the right end) tells you which side still holds an answer, even if the whole array is not sorted.
    how: |-
      Write one generic template and only change the predicate:

      ```python
      def first_true(lo, hi, pred):
          # invariant: the answer is in [lo, hi]; hi itself means "no index is true"
          while lo < hi:
              mid = (lo + hi) // 2
              if pred(mid):
                  hi = mid          # mid may be the first true: keep it
              else:
                  lo = mid + 1      # mid is false, so is everything left of it
          return lo
      ```

      **Minimum of a rotated array.** Compare `a[mid]` with `a[hi]`, the right end of the current range:

      ```python
      def find_min(a):
          lo, hi = 0, len(a) - 1
          while lo < hi:
              mid = (lo + hi) // 2
              if a[mid] > a[hi]:
                  lo = mid + 1      # the drop is strictly right of mid
              else:
                  hi = mid          # mid is in the right (smaller) segment; it may be the minimum
          return a[lo]
      ```

      **Search in a rotated array.** One half of `[lo, hi]` is always sorted. If `a[lo] <= a[mid]` the left half is sorted: go left only when `a[lo] <= target < a[mid]`. Otherwise the right half is sorted: go right only when `a[mid] < target <= a[hi]`. Each decision is a range check on a sorted half, so it stays O(log n).

      **Peak finding.** If `a[mid] < a[mid + 1]` you are on an uphill step, and walking right must reach a peak (the values cannot rise forever because of the imaginary minus infinity at the end), so `lo = mid + 1`; else `hi = mid`.
    mental_model: |-
      Picture a row of lights that are all off and then all on. You are not looking for a specific light; you are looking for the first one that is on. For each problem, ask: "what is my light?" (the predicate) and "why is it off-then-on?" (the monotonicity argument). If you cannot say both sentences, the template will not save you.
    tradeoffs: |-
      Using `bisect` is shorter and less error-prone than a hand-written loop, and since Python 3.10 it accepts a `key=` function. Hand-writing is still expected in interviews, and is required when the predicate is not a plain comparison (rotated arrays, peaks). Comparing with the right end (`a[hi]`) works for an unrotated array too; comparing with the left end needs a special case, so prefer the right end.
    mistakes:
      - Comparing `a[mid]` with `a[lo]` to find the minimum. On an unrotated array the left half looks "sorted" and the search moves right, away from the minimum at index 0.
      - "Using `while lo <= hi` with `hi = mid`: when lo == hi and the predicate is true, nothing changes and the loop never ends."
      - "Using `a[i] == target` as a predicate: it is true on a block in the middle, not false-then-true, so boundary search on it is meaningless."
      - Forgetting that duplicates break the rotated-array decision. With `a[lo] == a[mid] == a[hi]` you cannot tell which side is sorted; shrink by one (`hi -= 1`) and accept O(n) worst case.
      - Reading `a[mid + 1]` in peak finding with `while lo <= hi`; with `lo < hi`, `mid < hi` so `mid + 1` is always valid.
    interview: |-
      Interviewers listen for the predicate and the invariant: "I search for the first index where a[i] <= a[-1]; everything before the rotation point is larger than the last element." Expect follow-ups: what changes with duplicates, why compare with the right end, how to find the rotation count (it is the index of the minimum), and how median of two sorted arrays becomes a binary search on a partition.
    explain_it:
      - Name the predicate and argue why it is false-then-true.
      - State the interval convention and what lo and hi mean.
      - Show that each branch keeps the first true index in range and that the range shrinks.
      - Give O(log n) time and O(1) space, and the O(n) worst case when duplicates are allowed in a rotated array.
    example:
      language: python
      code: |-
        def find_peak(a: list[int]) -> int:
            """Any index whose value is larger than its neighbours; a[i] != a[i + 1]."""
            lo, hi = 0, len(a) - 1
            while lo < hi:                  # mid < hi, so a[mid + 1] is in range
                mid = (lo + hi) // 2
                if a[mid] < a[mid + 1]:
                    lo = mid + 1            # uphill to the right: a peak exists in (mid, hi]
                else:
                    hi = mid                # downhill: a peak exists in [lo, mid]
            return lo
      explanation: "The invariant is \"[lo, hi] contains a peak\". It holds initially (the global maximum is a peak) and each branch keeps a half that must contain one."
    complexity: O(log n) time and O(1) extra space for all four searches; rotated search with duplicates degrades to O(n) in the worst case (for example all equal values except one).
    edge_cases:
      - Array of length one (the minimum and the peak are index 0).
      - A rotation by zero or by n positions, which leaves the array sorted.
      - Target equal to a[lo] or a[hi] in rotated search; the inclusive comparisons must cover it.
      - Duplicates in a rotated array.
    misconceptions:
      - "\"Binary search needs a sorted array.\" It needs a rule that discards half of the candidates; peak finding works on unsorted data."
      - "\"bisect_left and bisect_right only differ on missing values.\" They differ exactly when the value is present: left gives its first index, right gives one past its last."
- key: dsa.bs_boundaries.check
  type: concept_check
  title: "Concept check: rotated arrays, peaks and bisect"
  skills: [binary_search.boundaries]
  minutes: 10
  difficulty: MEDIUM
  body:
    intro: Trace each snippet on paper. Every question is about which index survives in the range.
    questions:
      - id: q1
        kind: single
        prompt: "What does `find_min` return for `[4, 5, 6, 7, 0, 1, 2]`, and at which index does the loop stop?"
        code:
          language: python
          code: |-
            def find_min(a):
                lo, hi = 0, len(a) - 1
                while lo < hi:
                    mid = (lo + hi) // 2
                    if a[mid] > a[hi]:
                        lo = mid + 1
                    else:
                        hi = mid
                return a[lo]
        options: ["0 at index 4", "0 at index 5", "7 at index 3", "1 at index 5"]
        answer: [0]
        explanation: "mid=3: 7 > 2 so lo=4. mid=5: 1 > 1 is false so hi=5. mid=4: 0 > 1 is false so hi=4. lo == hi == 4, value 0. Answering index 5 comes from stopping one step early when a[5]=1 is not greater than a[hi]."
      - id: q2
        kind: single
        prompt: "Why does `find_min` compare `a[mid]` with `a[hi]` rather than with `a[lo]`?"
        options:
          - "Comparing with a[lo] is slower"
          - "With a[lo], an unrotated array looks like a sorted left half and the search moves right, away from the minimum at index 0"
          - "a[lo] may be out of range"
          - "There is no difference; both work"
        answer: [1]
        explanation: "On [1, 2, 3, 4, 5], a[mid] >= a[lo] holds everywhere, so a left-end rule pushes lo to the right and misses index 0. The right end works because the minimum is always at or left of any element that is <= a[hi]."
      - id: q3
        kind: single
        prompt: "For `a = [1, 3, 3, 3, 7]`, what are `bisect.bisect_left(a, 3)` and `bisect.bisect_right(a, 3)`?"
        options: ["1 and 3", "1 and 4", "0 and 4", "1 and 5"]
        answer: [1]
        explanation: "bisect_left is the first index with a[i] >= 3, which is 1. bisect_right is the first index with a[i] > 3, which is 4 (one past the last 3). The count of 3s is 4 - 1 = 3; answering 3 for bisect_right confuses it with the last index."
      - id: q4
        kind: multi
        prompt: Which predicates are false-then-true over the indexes, so a first-true search on them is valid?
        options:
          - "a[i] >= x on a sorted array"
          - "a[i] <= a[-1] on a rotated sorted array of distinct values"
          - "a[i] == x on a sorted array"
          - "a[i] is odd, on a sorted array"
        answer: [0, 1]
        explanation: "The first two flip exactly once. Equality is true on a block in the middle (false, true, false), and parity has no order at all, so neither has a single boundary."
      - id: q5
        kind: single
        prompt: "Search in a rotated array that may contain duplicates, for example `[2, 2, 2, 0, 2]`. Worst-case time?"
        options: ["O(log n)", "O(n)", "O(n log n)", "O(1)"]
        answer: [1]
        explanation: "When a[lo] == a[mid] == a[hi] you cannot tell which half is sorted, so the safe move is to shrink one end by one. An array of equal values with one different element forces this n times. Claiming O(log n) ignores this case."
      - id: q6
        kind: short
        prompt: In peak finding, why is it safe to discard the left half when a[mid] < a[mid + 1]?
        model_answer: "From mid + 1 the values either keep rising until the end, where the imaginary minus infinity makes the last element a peak, or they fall at some point, and the element before the first fall is a peak. Either way a peak lies in [mid + 1, hi], so the invariant \"the range contains a peak\" survives."
        explanation: The proof is about existence, not sortedness, which is why binary search works on an unsorted array here.
- key: dsa.bs_boundaries.exercise
  type: coding_exercise
  title: "Exercise: search a rotated array with duplicates"
  skills: [binary_search.boundaries]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      A sorted array of integers (duplicates allowed) was rotated at an unknown index. Write `contains(a, target)` that returns whether `target` is present. Aim for O(log n) on typical inputs and state the worst case honestly.
    examples:
      - "contains([2, 5, 6, 0, 0, 1, 2], 0) == True"
      - "contains([2, 5, 6, 0, 0, 1, 2], 3) == False"
      - "contains([1, 0, 1, 1, 1], 0) == True"
    constraints:
      - Up to 5000 elements; values fit in 32-bit integers.
    hints:
      - Without duplicates, one half of [lo, hi] is always sorted; decide with a[lo] <= a[mid].
      - "When a[lo] == a[mid] == a[hi] the sorted half is unknown: move lo and hi inwards by one."
      - Use the closed interval [lo, hi] and return as soon as a[mid] == target; here presence is the question, not a boundary.
    solution:
      language: python
      code: |-
        def contains(a: list[int], target: int) -> bool:
            lo, hi = 0, len(a) - 1
            while lo <= hi:
                mid = (lo + hi) // 2
                if a[mid] == target:
                    return True
                if a[lo] == a[mid] == a[hi]:
                    lo += 1                     # cannot tell which half is sorted
                    hi -= 1
                elif a[lo] <= a[mid]:           # left half [lo, mid] is sorted
                    if a[lo] <= target < a[mid]:
                        hi = mid - 1
                    else:
                        lo = mid + 1
                else:                           # right half [mid, hi] is sorted
                    if a[mid] < target <= a[hi]:
                        lo = mid + 1
                    else:
                        hi = mid - 1
            return False
      explanation: "O(log n) when duplicates do not hide the rotation, O(n) worst case (for example [1, 1, 1, 0, 1, 1]); O(1) extra space."
    rubric:
      - key: correct
        label: "Passes the examples including the all-but-one-equal case"
        points: 4
      - key: sorted_half
        label: "Identifies the sorted half and uses inclusive range checks against it"
        points: 3
      - key: duplicates
        label: "Handles a[lo] == a[mid] == a[hi] by shrinking both ends"
        points: 2
      - key: complexity
        label: "States O(log n) typical and O(n) worst case with a concrete input"
        points: 1
    follow_ups:
      - prompt: How would you return the rotation index instead?
        look_for: It is the index of the minimum; use the compare-with-a[hi] boundary search, with hi -= 1 when a[mid] == a[hi] if duplicates exist.
      - prompt: Why can you not shrink only lo when the three values are equal?
        look_for: Shrinking both is safe because a[lo] and a[hi] are not the target (a[mid] equals them and was just checked); either alone also works but both converge faster.
- key: dsa.bs_boundaries.guided
  type: guided_problem
  title: "Guided practice: minimum of a rotated array"
  skills: [binary_search.boundaries]
  minutes: 15
  difficulty: MEDIUM
  problems: [76]
  body:
    guidance:
      - Write the predicate in words first ("index i is in the right, smaller segment") and why it is false-then-true.
      - Use the half-open style `while lo < hi` with `hi = mid` when mid may be the answer.
      - Trace an unrotated array and a two-element rotated array before submitting.
    hints:
      - Compare a[mid] with a[hi], not a[lo].
      - If a[mid] > a[hi], the minimum is strictly to the right of mid.
- key: dsa.bs_boundaries.timed
  type: timed_problem
  title: "Timed practice: rotated search and median of two sorted arrays"
  skills: [binary_search.boundaries]
  minutes: 40
  difficulty: HARD
  problems: [16, 77]
  body:
    guidance:
      - "Rotated search: say aloud which half is sorted and the exact inclusive range check before coding."
      - "Median of two arrays: binary search on how many elements the shorter array puts into the left half; state the partition condition (left maxima <= right minima) before writing indexes."
      - State time and space for each before the timer runs out; leave two minutes to trace an empty or one-element array.
- key: dsa.bs_boundaries.interview
  type: interview_question
  title: "Interview question: explain rotated-array search and its worst case"
  skills: [binary_search.boundaries]
  minutes: 10
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 600}
  body:
    prompt: "A sorted list of distinct release numbers was rotated at an unknown point. Explain, without code, how to find a given release in O(log n), how you would find the rotation point, and what breaks if duplicates are allowed."
    key_points:
      - "At every step one of the two halves around mid is sorted; a[lo] <= a[mid] identifies the left one."
      - "Moves into the sorted half only when the target lies inside its value range, otherwise into the other half."
      - "Rotation point is the minimum: first index where a[i] <= a[-1], found by comparing a[mid] with a[hi]."
      - "With duplicates, a[lo] == a[mid] == a[hi] hides the sorted half, so worst case becomes O(n)."
    model_answer: One half of any range of a rotated sorted array is sorted. I compare a[lo] with a[mid] to find it, check whether the target falls inside that half's value range, and discard the other half if it does. The rotation point is the index of the minimum, which is a boundary search on a[i] <= a[-1]. With duplicates, equal ends and middle make the sorted half ambiguous, so I shrink the range by one and the worst case is linear.
    pitfalls:
      - Finding the pivot with a linear scan first, which makes the whole search O(n).
      - Using strict comparisons at the range ends, which misses targets equal to a[lo] or a[hi].
    follow_ups:
      - prompt: How many times was the array rotated?
        look_for: The index of the minimum element equals the rotation count (for right rotation of an ascending array).
      - prompt: Can you do it with one binary search instead of pivot plus search?
        look_for: Yes, the sorted-half decision inside a single loop; two searches is also O(log n) and sometimes clearer.
- key: dsa.bs_boundaries.cards
  type: revision_card
  title: "Recall: boundary searches"
  skills: [binary_search.boundaries]
  minutes: 5
  body:
    cards:
      - front: bisect_left vs bisect_right?
        back: "First index with a[i] >= x vs first index with a[i] > x."
      - front: Minimum of a rotated array — compare mid with what?
        back: "a[hi]; if a[mid] > a[hi] go right (lo = mid + 1), else hi = mid."
      - front: Rotated search — how do you pick a side?
        back: Find the sorted half with a[lo] <= a[mid] and test if the target is inside its range.
      - front: Rotated search with duplicates — worst case?
        back: "O(n): equal lo, mid and hi force shrinking by one."
      - front: Why does peak finding work on unsorted data?
        back: An uphill step to the right guarantees a peak on that side.

# ---------------------------------------------------------------------------------------------- binary search: answer space
- key: dsa.bs_answer.lesson
  type: lesson
  title: Binary search on the answer with a feasibility function
  skills: [binary_search.answer_space, binary_search.boundaries]
  minutes: 25
  difficulty: MEDIUM
  body:
    summary: When the answer is a number and "can I do it with x?" is monotonic in x, binary search x and spend your effort on a fast, correct check.
    what: |-
      Binary search on the answer searches over **candidate answers**, not over array indexes. You need three things:

      - a **range** `[lo, hi]` that certainly contains the answer,
      - a **feasibility function** `can(x)` that answers yes/no for one candidate, usually with a greedy O(n) pass,
      - **monotonicity**: once `can(x)` is true it stays true for every larger x (minimisation), or once false it stays false (maximisation).

      Then the answer is the first true (minimise) or last true (maximise) value of `can` over the range.
    why: |-
      Directly constructing an optimal answer is often hard, while checking a proposed answer is easy. "What is the minimum time to produce 10⁹ items?" has no obvious formula, but "can we produce them by time T?" is a sum. Binary search turns an easy check into an optimiser at a cost of only about log₂(range) checks — around 60 checks even for a range of 10¹⁸.
    when: |-
      - The question asks for a minimum of a maximum, a maximum of a minimum, the smallest speed, capacity, time or size.
      - The search range is huge (10⁹ or more) so trying every candidate is impossible, but each check is cheap.
      - You can argue "if x works, x + 1 works" (or the reverse) in one sentence.
    how: |-
      **Minimise** (first feasible). Example: machines produce items, machine i takes `times[i]` per item; find the least time to make `target` items.

      ```python
      def min_time(times: list[int], target: int) -> int:
          def enough(t: int) -> bool:
              return sum(t // x for x in times) >= target   # monotonic: more time, more items

          lo, hi = 1, min(times) * target    # the fastest machine alone finishes by hi
          while lo < hi:
              mid = (lo + hi) // 2
              if enough(mid):
                  hi = mid                   # mid works; maybe something smaller does too
              else:
                  lo = mid + 1
          return lo
      ```

      **Maximise** (last feasible). Example: place k ≥ 2 markers at given positions so the smallest gap between any two is as large as possible. A larger required gap is harder to satisfy, so `can(gap)` is true-then-false and we want the last true.

      ```python
      lo, hi = 0, positions[-1] - positions[0]   # gap 0 is always feasible
      while lo < hi:
          mid = (lo + hi + 1) // 2               # upper middle, so lo = mid always moves
          if can(mid):
              lo = mid
          else:
              hi = mid - 1
      return lo
      ```

      Steps that always apply: prove monotonicity, pick bounds that are certainly feasible and certainly infeasible (or the edge of feasibility), write `can`, choose the first-true or last-true template, then count the cost: `O(log(hi - lo) × cost(can))`.
    mental_model: |-
      Imagine a dial labelled with every possible answer. Turning it up makes the task easier (more time, more capacity) until a light turns on and stays on. You are not computing the answer; you are asking an oracle "is this setting enough?" and using binary search to find where the light first turns on.
    tradeoffs: |-
      The check usually costs O(n), so the total is O(n log range). Sometimes a direct greedy or formula is O(n) or O(n log n) and simpler; binary search on the answer is the general tool when no formula is obvious. Tight bounds save only a few iterations (the cost is logarithmic), so correctness of bounds matters more than tightness. For real-valued answers, iterate a fixed number of times or scale to integer units (for example cents or milliseconds) instead of comparing floating-point values for equality.
    mistakes:
      - Choosing a lower bound that is infeasible for structural reasons, such as capacity below the heaviest package; the check may wrongly accept it if it does not handle that case.
      - "Using the lower middle in the maximise template: with lo = 3, hi = 4 and can(3) true, lo stays 3 forever."
      - Writing a check that is not actually monotonic (for example, with negative values in a split-array problem).
      - Letting the check do unnecessary work; stop the greedy pass as soon as the answer is known (count exceeds k, items reach target).
      - Using float division for ceilings; write `(p + s - 1) // s` or `-(-p // s)` to stay in integers.
    interview: |-
      Say the three ingredients aloud: range, check, monotonicity, then the complexity. Interviewers often probe the check ("why is greedy packing optimal?") and the bounds ("why max(weights)?"). Recognising the pattern quickly — "minimise the maximum" is a strong signal — is a large part of the evaluation.
    explain_it:
      - What the candidate answer x means in words.
      - The feasibility check and why it is correct for a fixed x.
      - Why feasibility is monotonic in x.
      - Bounds, template (first true or last true) and O(n log range) cost.
    example:
      language: python
      code: |-
        def max_min_gap(positions: list[int], k: int) -> int:
            positions = sorted(positions)            # k >= 2 and k <= len(positions)

            def can(gap: int) -> bool:               # greedy: place each marker as early as allowed
                placed, last = 1, positions[0]
                for p in positions[1:]:
                    if p - last >= gap:
                        placed, last = placed + 1, p
                        if placed == k:
                            return True
                return False

            lo, hi = 0, positions[-1] - positions[0]
            while lo < hi:
                mid = (lo + hi + 1) // 2
                if can(mid):
                    lo = mid
                else:
                    hi = mid - 1
            return lo
      explanation: "O(n log n) for the sort plus O(n log(range)) for the search; O(n) space for the sorted copy. Greedy is optimal because placing a marker as early as possible never reduces the room left for the remaining markers."
    complexity: O(cost(check) × log(hi - lo)); typically O(n log M) time where M is the size of the answer range, O(1) extra space beyond the input.
    edge_cases:
      - The lower bound itself is the answer (a single item, or k equal to the number of items).
      - Products such as min(times) × target that would overflow in fixed-width languages; Python integers do not overflow.
      - The answer does not exist (more groups requested than items); detect before searching.
    misconceptions:
      - "\"The array must be sorted.\" The array is irrelevant to the search; the answer range is what is ordered."
      - "\"Any optimisation problem works.\" Without a monotonic check, binary search can skip the true optimum."
- key: dsa.bs_answer.check
  type: concept_check
  title: "Concept check: search on the answer"
  skills: [binary_search.answer_space]
  minutes: 10
  difficulty: MEDIUM
  body:
    intro: Each question tests one of the three ingredients — range, check, monotonicity — or the template.
    questions:
      - id: q1
        kind: single
        prompt: "Piles of sizes [4, 9, 5] must be eaten within 6 hours; at speed s one pile takes ceil(size / s) hours. What is the smallest feasible speed?"
        options: ["3", "4", "5", "6"]
        answer: [1]
        explanation: "Speed 3 needs 2 + 3 + 2 = 7 hours, too many. Speed 4 needs 1 + 3 + 2 = 6, feasible. Picking 5 or 6 finds a feasible speed but not the smallest one, which is what the search must return."
      - id: q2
        kind: single
        prompt: What happens with this loop when can(mid) is true and lo == hi?
        code:
          language: python
          code: |-
            lo, hi = max(w), sum(w)
            while lo <= hi:
                mid = (lo + hi) // 2
                if can(mid):
                    hi = mid
                else:
                    lo = mid + 1
            return lo
        options:
          - "It returns lo correctly"
          - "It loops forever because hi = mid does not shrink the range"
          - "It returns lo - 1"
          - "It raises IndexError"
        answer: [1]
        explanation: "With lo == hi == mid and can(mid) true, hi = mid leaves the state unchanged. Either use while lo < hi with hi = mid, or while lo <= hi with hi = mid - 1 and track the best answer separately."
      - id: q3
        kind: multi
        prompt: Which feasibility functions are monotonic in their parameter?
        options:
          - "Packages can be shipped within D days with capacity c (parameter c)"
          - "A window of length L with sum at least S exists, all values positive (parameter L)"
          - "The maximum of some window of length L equals exactly X (parameter L)"
          - "All jobs finish by time T with k workers (parameter T)"
        answer: [0, 1, 3]
        explanation: "More capacity, a longer window of positive values, and more time each keep a feasible answer feasible. An exact-equality condition can switch from true to false and back as L grows, so it has no single boundary."
      - id: q4
        kind: single
        prompt: "n = 10⁵ weights, each up to 10⁹, so the sum is up to 10¹⁴. About how many O(n) checks does the search do?"
        options: ["About 17", "About 47", "About 10⁵", "About 10⁹"]
        answer: [1]
        explanation: "log₂(10¹⁴) is about 46.5, so roughly 47 checks and about 5 × 10⁶ operations in total. 17 is log₂(10⁵), the size of the array, which is not what is being searched."
      - id: q5
        kind: single
        prompt: "In the maximise template (last true), why use mid = (lo + hi + 1) // 2?"
        options:
          - "To avoid overflow"
          - "So that lo = mid always moves lo forward when hi = lo + 1"
          - "Because the answer is always odd"
          - "It is only a style preference"
        answer: [1]
        explanation: "With lo = 3 and hi = 4 the lower middle is 3; if can(3) is true then lo = 3 again and the loop never ends. The upper middle is 4, so either branch shrinks the range."
      - id: q6
        kind: short
        prompt: How do you recognise a binary-search-on-the-answer problem, and how do you justify monotonicity aloud?
        model_answer: "Signals: the answer is a number in a large range, the wording is minimise the maximum or maximise the minimum or smallest speed/capacity/time, and checking one candidate is easy. Justify monotonicity with a one-line argument: any plan that works with x also works with x + 1 (more capacity, more time), so feasibility is false-then-true."
        explanation: Saying the monotonicity argument is what separates a correct pattern match from a lucky guess.
- key: dsa.bs_answer.exercise
  type: coding_exercise
  title: "Exercise: earliest day to make the bouquets"
  skills: [binary_search.answer_space, greedy.core]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      Flowers stand in a row; flower i blooms on day `bloom[i]` and stays bloomed. A bouquet needs `k` **adjacent** bloomed flowers, and each flower can be used once. Return the earliest day on which you can make `m` bouquets, or -1 if it is impossible.
    examples:
      - "earliest_day([1, 10, 3, 10, 2], m=3, k=1) == 3"
      - "earliest_day([1, 10, 3, 10, 2], m=3, k=2) == -1  (needs 6 flowers, only 5 exist)"
      - "earliest_day([7, 7, 7, 7, 12, 7, 7], m=2, k=3) == 12"
    constraints:
      - Up to 10⁵ flowers; bloom days up to 10⁹.
    hints:
      - If m × k exceeds the number of flowers, return -1 before searching.
      - "For a fixed day d, scan left to right counting consecutive bloomed flowers; every k in a row is one bouquet."
      - More days never un-bloom a flower, so feasibility is monotonic; search between min(bloom) and max(bloom).
    solution:
      language: python
      code: |-
        def earliest_day(bloom: list[int], m: int, k: int) -> int:
            if m * k > len(bloom):
                return -1

            def can(day: int) -> bool:
                bouquets = run = 0
                for b in bloom:
                    if b <= day:
                        run += 1
                        if run == k:
                            bouquets += 1
                            run = 0
                    else:
                        run = 0
                return bouquets >= m

            lo, hi = min(bloom), max(bloom)
            while lo < hi:
                mid = (lo + hi) // 2
                if can(mid):
                    hi = mid
                else:
                    lo = mid + 1
            return lo
      explanation: O(n log(max - min)) time and O(1) extra space. Taking the leftmost k adjacent bloomed flowers greedily never prevents a later bouquet, so the count is the maximum for that day.
    rubric:
      - key: correct
        label: "Returns the right day and -1 when m times k exceeds n"
        points: 4
      - key: check
        label: "Greedy check resets the run on an unbloomed flower and after each bouquet"
        points: 3
      - key: monotonic
        label: "States why feasibility is monotonic in the day"
        points: 1
      - key: complexity
        label: "States O(n log range) time and O(1) space"
        points: 2
    follow_ups:
      - prompt: Could you search over the sorted distinct bloom days instead of the numeric range?
        look_for: Yes; the answer is always one of the bloom days, so binary search their sorted list (O(n log n) for the sort, same order overall).
      - prompt: Why is the greedy count optimal for a fixed day?
        look_for: Exchange argument; using the leftmost available run of k leaves at least as much room to the right as any other choice.
