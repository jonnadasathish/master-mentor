- key: dsa.sorting.interview
  type: interview_question
  title: "Interview question: choose the sort"
  skills: [sorting.algorithms, python.sorting_keys]
  minutes: 12
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 720}
  body:
    prompt: |-
      Pick an approach for each case and justify it in terms of time, memory and stability:

      - (a) 10 million order records sorted by country, and within a country by created_at;
      - (b) 50 million ages from 0 to 150;
      - (c) a 200 GB log file of timestamps on a machine with 16 GB of RAM.
    key_points:
      - "(a) one sorted() call with key=lambda r: (r.country, r.created_at), or two stable passes (created_at first, then country)."
      - "(b) counting sort: O(n + 151) time and a 151-slot count array."
      - "(c) external merge sort: sort chunks that fit in memory, write sorted runs, then k-way merge them with a heap."
      - States that stability is what makes the two-pass approach in (a) correct.
    model_answer: "(a) Python's sort is stable, so a tuple key or two passes (secondary key first) both work in O(n log n). (b) The value range is tiny, so counting sort runs in linear time with constant extra memory. (c) Data does not fit in RAM: split into roughly 10 GB chunks, sort each in memory and write it out, then merge the runs with a min-heap of their current heads, reading sequentially; total O(n log n) work with sequential I/O."
    pitfalls:
      - Sorting by the primary key first in the two-pass approach.
      - Proposing to load 200 GB into memory or to use quicksort on disk with random access.
    follow_ups:
      - prompt: In (c), how many runs would you merge at once and why?
        look_for: All runs in one k-way merge if file handles and buffers fit (here about 20 runs); otherwise multiple passes; heap gives O(log k) per record.
      - prompt: Why is a stable sort required for multi-pass sorting?
        look_for: The second pass must keep the order produced by the first pass among equal primary keys.
- key: dsa.sorting.cards
  type: revision_card
  title: "Recall: sorting algorithms"
  skills: [sorting.algorithms]
  minutes: 5
  body:
    cards:
      - front: Merge sort time, space, stable?
        back: O(n log n) always, O(n) extra, stable.
      - front: Quicksort worst case and its trigger?
        back: O(n²) when pivots are extreme, e.g. last-element pivot on sorted input.
      - front: Quickselect expected time?
        back: O(n) — recurse into one side only.
      - front: Counting sort cost?
        back: O(n + k) for values in a range of size k.
      - front: Comparison sort lower bound?
        back: Ω(n log n) because log₂(n!) = Θ(n log n).

# ---------------------------------------------------------------------------------------------- intervals
- key: dsa.intervals.lesson
  type: lesson
  title: "Intervals: overlap, merge, insert and the sweep line"
  skills: [intervals.core, python.sorting_keys]
  minutes: 25
  difficulty: MEDIUM
  body:
    summary: Fix the endpoint convention, sort by the right key (start to merge, end to schedule), and sweep once.
    what: |-
      Interval problems work on pairs `[start, end]`. Four operations cover most of them:

      - **Merge** overlapping intervals into disjoint ones (sort by start).
      - **Insert** one interval into a sorted, disjoint list (one linear pass).
      - **Schedule**: keep as many non-overlapping intervals as possible, or remove the fewest (sort by end, greedy).
      - **Sweep line**: turn intervals into +1/-1 events to find maximum concurrency, such as meeting rooms or peak load.
    why: |-
      Calendars, booking systems, IP ranges, rate-limit windows and log time ranges are all intervals. A pairwise overlap check is O(n²); sorting once makes almost every question O(n log n).
    when: |-
      - Inputs are ranges, bookings, sessions or segments.
      - The question asks about overlap, coverage, free time, the number of concurrent items, or the fewest items to remove.
    how: |-
      **Overlap test.** Closed intervals `[a, b]` and `[c, d]` overlap when `a <= d and c <= b`. Half-open `[a, b)` and `[c, d)` (meetings ending at 10 do not clash with ones starting at 10) overlap when `a < d and c < b`. Decide the convention first.

      **Merge.** Sort by start; extend the last merged interval while the next one starts before (or at) its end:

      ```python
      def merge(intervals):
          out = []
          for s, e in sorted(intervals):
              if out and s <= out[-1][1]:
                  out[-1][1] = max(out[-1][1], e)   # max: the new one may be nested inside
              else:
                  out.append([s, e])
          return out
      ```

      **Insert.** Three phases in one pass: copy intervals ending before the new one, absorb those that overlap (min of starts, max of ends), copy the rest.

      **Scheduling.** Sort by **end** and keep an interval when it starts at or after the last kept end. Fewest removals = n − kept.

      **Sweep line.** Each interval adds `(start, +1)` and `(end, -1)`. Sorting the tuples places `(t, -1)` before `(t, +1)`, so an end at time t frees its room before a start at t takes one — exactly the half-open convention.
    mental_model: |-
      Draw the intervals as bars on a timeline and slide a vertical line from left to right. Merging is "the line is inside some bar"; concurrency is "how many bars does the line cross right now"; scheduling is "finish as early as possible to leave the most room".
    tradeoffs: |-
      Sweep events cost O(n) extra memory and an O(n log n) sort; the alternative for meeting rooms — sort by start and keep a min-heap of end times — has the same complexity and also tells you which room is free. If coordinates are small integers, a difference array gives O(n + range) without sorting. For many queries against a changing set of intervals, use a balanced tree or an interval tree, which Python does not provide in the standard library.
    mistakes:
      - Using `out[-1][1] = e` instead of `max(...)`, which shrinks the merged interval when a later one is nested.
      - Sorting by start for the fewest-removals problem; one long early interval then blocks many short ones.
      - Getting the tie at equal times wrong in the sweep, which over-counts rooms for back-to-back meetings.
      - Mutating the input lists while merging, which surprises callers.
      - Re-sorting in insert, which costs O(n log n) when the input is already sorted.
    interview: |-
      State the endpoint convention as a clarifying question ("does [1, 2] overlap [2, 3]?"). Then name the sort key and why. Common follow-ups: free time across several people's calendars, intersection of two sorted interval lists (two pointers), and "what if intervals arrive as a stream?" (a sorted structure with neighbour checks).
    explain_it:
      - The endpoint convention and the overlap condition.
      - The sort key and why it is the right one for this question.
      - The single pass and what state it keeps.
      - O(n log n) for the sort, O(n) for the pass, and the output or event space.
    example:
      language: python
      code: |-
        def max_concurrent(intervals: list[tuple[int, int]]) -> int:
            """Half-open [start, end): peak number of overlapping intervals."""
            events = []
            for start, end in intervals:
                events.append((start, 1))
                events.append((end, -1))
            events.sort()          # at equal times (t, -1) comes before (t, 1)
            current = best = 0
            for _, delta in events:
                current += delta
                best = max(best, current)
            return best
      explanation: "For [(0, 30), (5, 10), (10, 20)] the peak is 2: the meeting ending at 10 frees its room before the one starting at 10 takes it. O(n log n) time, O(n) space."
    complexity: O(n log n) time for sorting plus O(n) for the sweep; O(n) extra space for events or output.
    edge_cases:
      - Empty list and a single interval.
      - Touching intervals such as [1, 2] and [2, 3] under each convention.
      - An interval nested completely inside another.
      - Zero-length intervals [5, 5].
    misconceptions:
      - "\"Sorting by start is always right.\" Scheduling needs the earliest end."
      - "\"Merging needs two nested loops.\" After sorting, each interval only needs to be compared with the last merged one."
- key: dsa.intervals.check
  type: concept_check
  title: "Concept check: intervals"
  skills: [intervals.core]
  minutes: 10
  difficulty: MEDIUM
  body:
    intro: Draw the intervals on a number line before answering.
    questions:
      - id: q1
        kind: single
        prompt: "This buggy merge runs on [[1, 4], [2, 3], [6, 8], [8, 9]]. What does it return?"
        code:
          language: python
          code: |-
            def merge(intervals):
                out = []
                for s, e in sorted(intervals):
                    if out and s <= out[-1][1]:
                        out[-1][1] = e
                    else:
                        out.append([s, e])
                return out
        options: ["[[1, 4], [6, 9]]", "[[1, 3], [6, 9]]", "[[1, 3], [6, 8], [8, 9]]", "[[1, 4], [6, 8], [8, 9]]"]
        answer: [1]
        explanation: "[2, 3] overlaps [1, 4] and overwrites the end with 3, shrinking the interval; [8, 9] then extends [6, 8] to [6, 9]. The correct output [[1, 4], [6, 9]] needs max(out[-1][1], e)."
      - id: q2
        kind: single
        prompt: "To remove the fewest intervals so the rest do not overlap, sort by…"
        options: ["start ascending", "end ascending", "length ascending", "start descending"]
        answer: [1]
        explanation: "Keeping the interval that ends earliest leaves the most room. Sorting by start fails on [[1, 100], [2, 3], [4, 5]]: the long interval would be kept first. Shortest-first also fails in some cases, for example a short interval that overlaps two long disjoint ones."
      - id: q3
        kind: multi
        prompt: Which statements about the sweep-line solution for meeting rooms are true?
        options:
          - "For half-open meetings, ends must be processed before starts at the same time"
          - "It uses O(n) extra space for the events"
          - "It requires a heap"
          - "Its time is dominated by sorting the events, O(n log n)"
        answer: [0, 1, 3]
        explanation: "Ends-before-starts makes back-to-back meetings share a room; 2n events take O(n) space and sorting them dominates. A heap is used by the other approach (min-heap of end times), not by the sweep."
      - id: q4
        kind: single
        prompt: Inserting one interval into a sorted list of n disjoint intervals, returning a new list. Best time complexity?
        options: ["O(log n)", "O(n)", "O(n log n)", "O(1)"]
        answer: [1]
        explanation: "Binary search finds the position in O(log n), but building the output list (and possibly merging a run of intervals) is O(n). Re-sorting would be O(n log n) for no benefit."
      - id: q5
        kind: single
        prompt: "With closed intervals, do [1, 3] and [3, 5] overlap? With half-open [1, 3) and [3, 5)?"
        options: ["Yes and yes", "Yes and no", "No and yes", "No and no"]
        answer: [1]
        explanation: "Closed intervals share the point 3; half-open ones do not, because [1, 3) excludes 3. Assuming one convention without asking is a common interview slip."
      - id: q6
        kind: short
        prompt: Why does greedily keeping the interval with the earliest end maximise the number of non-overlapping intervals?
        model_answer: "Exchange argument: take any optimal solution and replace its first interval with the earliest-ending one. That interval ends no later, so it does not overlap the rest of the optimal solution, and the count is unchanged. Repeat on the remaining intervals that start after it; the greedy result is therefore as large as the optimum."
        explanation: Being able to state the exchange argument is what makes the greedy choice defensible.
- key: dsa.intervals.exercise
  type: coding_exercise
  title: "Exercise: intersection of two schedules"
  skills: [intervals.core, two_pointers.core]
  minutes: 20
  difficulty: MEDIUM
  observation: {kind: CODE_EXERCISE, time_limit_seconds: 1200}
  body:
    prompt: |-
      Two people each have a list of busy intervals, closed `[start, end]`, sorted and pairwise disjoint within each list. Return the intervals during which **both** are busy.
    examples:
      - "intersect([[0, 2], [5, 10]], [[1, 5], [8, 12]]) == [[1, 2], [5, 5], [8, 10]]"
      - "intersect([[1, 3]], []) == []"
    constraints:
      - Up to 10⁵ intervals per list.
    hints:
      - Two pointers, one per list.
      - "The overlap of [a, b] and [c, d] is [max(a, c), min(b, d)] when that is non-empty."
      - Advance the pointer whose interval ends first; it cannot overlap anything later in the other list.
    solution:
      language: python
      code: |-
        def intersect(a: list[list[int]], b: list[list[int]]) -> list[list[int]]:
            i = j = 0
            out = []
            while i < len(a) and j < len(b):
                lo = max(a[i][0], b[j][0])
                hi = min(a[i][1], b[j][1])
                if lo <= hi:
                    out.append([lo, hi])
                if a[i][1] < b[j][1]:
                    i += 1
                else:
                    j += 1
            return out
      explanation: O(m + n) time, O(1) extra space besides the output; no sorting needed because both inputs are already sorted.
    rubric:
      - key: correct
        label: "Correct output including single-point overlaps and empty lists"
        points: 4
      - key: advance
        label: "Advances the pointer with the smaller end and explains why"
        points: 3
      - key: complexity
        label: "States O(m + n) time and output space"
        points: 2
      - key: convention
        label: "Asks or states the closed-interval convention"
        points: 1
    follow_ups:
      - prompt: How would you find time slots when k people are all free?
        look_for: Merge all busy intervals (sort by start or k-way merge with a heap), then the gaps between merged intervals are common free time; O(N log N) or O(N log k).
      - prompt: What changes for half-open intervals?
        look_for: The non-empty condition becomes lo < hi, so touching endpoints are not reported.
