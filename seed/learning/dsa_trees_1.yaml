- key: dsa.intervals.interview
  type: interview_question
  title: "Interview question: common free time"
  skills: [intervals.core, heap.two_heaps_merge_k]
  minutes: 15
  difficulty: MEDIUM
  observation: {kind: CONCEPT_EXPLAIN, time_limit_seconds: 900}
  body:
    prompt: "Each of k employees has a sorted list of busy intervals. Describe how to return the finite intervals in which every employee is free, the complexity, and how you would test it."
    key_points:
      - "Common free time is the gaps in the union of all busy intervals."
      - "Merge all intervals: flatten and sort in O(N log N), or k-way merge the sorted lists with a heap in O(N log k)."
      - "Walk the merged list and emit (prev_end, next_start) when next_start > prev_end, depending on the endpoint convention."
      - "Tests: overlapping employees, touching intervals, one employee, no gaps."
    model_answer: Free time for everyone is the complement of the union of busy time. I would merge all busy intervals in start order, either by sorting all N intervals or by a k-way heap merge of the already sorted lists, extend a current block while the next start is within it, and record a gap whenever the next start is beyond the current end. Only finite gaps between the earliest and latest busy times are reported.
    pitfalls:
      - Intersecting free times pairwise, which is correct but needs complement lists first and is easy to get wrong.
      - Ignoring nested intervals when extending the current block.
    follow_ups:
      - prompt: Why is the heap merge O(N log k)?
        look_for: Each of the N intervals is pushed and popped once from a heap that holds at most k heads.
      - prompt: Return only gaps of at least 30 minutes. What changes?
        look_for: Filter on next_start - prev_end >= 30; complexity unchanged.
- key: dsa.intervals.cards
  type: revision_card
  title: "Recall: intervals"
  skills: [intervals.core]
  minutes: 5
  body:
    cards:
      - front: Overlap of closed [a, b] and [c, d]?
        back: "a <= d and c <= b (half-open: a < d and c < b)."
      - front: Sort key for merging?
        back: Start; compare only with the last merged interval.
      - front: Sort key for fewest removals?
        back: End; keep the earliest-ending compatible interval.
      - front: Sweep-line tie rule for meeting rooms?
        back: Process ends before starts at the same time.
      - front: Merge bug that shrinks intervals?
        back: "Assigning the end instead of taking max(old_end, new_end)."
