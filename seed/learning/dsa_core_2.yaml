- key: dsa.sliding_window.cards
  type: revision_card
  title: "Recall: sliding window"
  skills: [sliding_window.core]
  minutes: 5
  body:
    cards:
      - front: Condition for a variable sliding window to be correct?
        back: Validity is monotonic in window size (e.g. non-negative values, at-most constraints).
      - front: Longest-window template — where is the answer recorded?
        back: After the shrink-while-invalid loop.
      - front: Shortest-window template — where is the answer recorded?
        back: Inside the while-valid loop, before removing the left element.
      - front: Count windows with exactly k distinct values?
        back: at_most(k) - at_most(k - 1).
      - front: Why is a window with a nested while loop O(n)?
        back: left and right each move at most n times in total.
      - front: Window over sums with negative values?
        back: Not valid; use prefix sums with a hash map.
