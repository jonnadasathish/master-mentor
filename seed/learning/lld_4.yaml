      - {key: abstractions, label: "SplitStrategy protocol with three strategies and integer paise throughout", points: 2}
      - {key: extensibility, label: "Adds or sketches a new split type such as weights with no ledger change", points: 1}
      - {key: tradeoffs, label: "Explains the greedy settlement limitation and the cost of keeping two views", points: 1}
      - {key: edge_cases, label: "Handles remainder paise and unknown users and invalid splits and overpayment and pairwise netting", points: 1}
